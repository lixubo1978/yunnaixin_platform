
<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        viewport-fit=cover
    "
>

<meta
    name="theme-color"
    content="#fff7fa"
>

<title>孕乃馨 - 城市销售价格</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root {

    --pink-50:#fff7fa;
    --pink-100:#ffeef4;
    --pink-200:#ffd9e7;
    --pink-300:#f8bdd2;
    --pink-400:#f28aae;
    --pink-500:#e85d8f;
    --pink-600:#d94d7d;
    --pink-700:#b93667;

    --rose:#662844;

    --text:#282329;
    --text2:#716a72;
    --text3:#a49ba1;

    --border:#eee4e9;

    --green:#16815d;
    --green-bg:#edfaf4;

    --yellow:#a56b12;
    --yellow-bg:#fff7e7;

    --gray:#806f76;
    --gray-bg:#f1edef;

    --danger:#c83355;

    --shadow:
        0 10px 30px
        rgba(123,50,79,.07);

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    margin:0;

    min-height:100%;

}


body {

    min-height:100vh;
    min-height:100dvh;

    background:
        linear-gradient(
            180deg,
            #fff9fb,
            #faf8f9
        );

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

}


button,
input,
select {

    font:inherit;

}


button {

    cursor:pointer;

}


.hidden {

    display:none !important;

}


/* =========================================================
   TOPBAR
========================================================= */

.topbar {

    min-height:68px;

    padding:
        8px
        24px;

    position:sticky;

    top:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    gap:15px;

    background:
        rgba(
            255,
            255,
            255,
            .95
        );

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    border-bottom:
        1px solid
        var(--border);

}


.brand {

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;

}


.brand img {

    width:42px;

    height:42px;

    flex:
        0 0 42px;

    border-radius:12px;

    object-fit:contain;

}


.brand-title {

    font-size:18px;

    font-weight:750;

    color:
        var(--rose);

}


.brand-sub {

    margin-top:2px;

    font-size:11px;

    color:
        var(--text3);

}


.top-actions {

    display:flex;

    align-items:center;

    gap:9px;

}


.back-button,
.logout-button {

    min-height:44px;

    padding:
        0
        15px;

    border-radius:12px;

    font-size:12px;

    font-weight:700;

}


.back-button {

    border:
        1px solid
        var(--border);

    background:#ffffff;

    color:
        var(--text2);

}


.logout-button {

    border:0;

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-600)
        );

}


/* =========================================================
   MAIN
========================================================= */

.main {

    width:100%;

    max-width:1450px;

    margin:
        0 auto;

    padding:28px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    position:relative;

    overflow:hidden;

    padding:
        27px
        29px;

    margin-bottom:18px;

    border:
        1px solid
        rgba(
            232,
            93,
            143,
            .10
        );

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #fff0f5,
            #ffe1ec
        );

    box-shadow:
        var(--shadow);

}


.hero::after {

    content:"";

    position:absolute;

    width:190px;

    height:190px;

    right:-60px;

    top:-75px;

    border-radius:50%;

    background:
        rgba(
            255,
            255,
            255,
            .30
        );

}


.hero-content {

    position:relative;

    z-index:2;

}


.hero-tag {

    display:inline-flex;

    align-items:center;

    min-height:27px;

    padding:
        3px
        10px;

    margin-bottom:9px;

    border-radius:999px;

    background:
        rgba(
            255,
            255,
            255,
            .72
        );

    color:
        var(--pink-700);

    font-size:10px;

    font-weight:750;

}


.hero h1 {

    margin:
        0
        0
        6px;

    font-size:26px;

    color:
        var(--rose);

}


.hero p {

    margin:0;

    max-width:920px;

    font-size:13px;

    line-height:1.8;

    color:
        #875064;

}


/* =========================================================
   STATS
========================================================= */

.stats {

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:12px;

    margin-bottom:18px;

}


.stat {

    min-height:103px;

    padding:17px;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:#ffffff;

}


.stat-label {

    font-size:10px;

    color:
        var(--text3);

}


.stat-value {

    margin-top:7px;

    font-size:22px;

    font-weight:750;

    color:
        var(--rose);

}


.stat-note {

    margin-top:3px;

    font-size:10px;

    color:
        var(--text3);

}


/* =========================================================
   FILTER
========================================================= */

.toolbar {

    display:grid;

    grid-template-columns:
        minmax(
            260px,
            1.2fr
        )
        minmax(
            220px,
            1fr
        )
        minmax(
            220px,
            1fr
        );

    gap:10px;

    padding:14px;

    margin-bottom:15px;

    border:
        1px solid
        var(--border);

    border-radius:17px;

    background:#ffffff;

}


.input,
.select {

    width:100%;

    min-height:48px;

    padding:
        0
        13px;

    border:
        1px solid
        #e4dce0;

    border-radius:11px;

    background:#ffffff;

    outline:none;

    color:
        var(--text);

}


.input:focus,
.select:focus {

    border-color:
        var(--pink-300);

    box-shadow:
        0 0 0 3px
        var(--pink-50);

}


/* =========================================================
   CURRENT CITY
========================================================= */

.current-city {

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    gap:12px;

    padding:
        15px
        17px;

    margin-bottom:14px;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    background:#ffffff;

}


.current-city-label {

    font-size:10px;

    color:
        var(--text3);

}


.current-city-name {

    margin-top:3px;

    font-size:16px;

    font-weight:750;

}


.current-city-note {

    font-size:11px;

    color:
        var(--text3);

    text-align:right;

}


/* =========================================================
   TABLE
========================================================= */

.panel {

    overflow:hidden;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:#ffffff;

}


.table-scroll {

    overflow-x:auto;

}


table {

    width:100%;

    min-width:1050px;

    border-collapse:
        collapse;

}


th {

    padding:
        13px
        14px;

    text-align:left;

    white-space:nowrap;

    background:
        #fffafb;

    color:
        #837980;

    font-size:11px;

}


td {

    padding:
        15px
        14px;

    border-top:
        1px solid
        #f1eaee;

    font-size:12px;

    vertical-align:middle;

}


.product-name {

    font-weight:700;

}


.product-code {

    margin-top:3px;

    font-size:10px;

    color:
        var(--text3);

}


.product-type {

    display:inline-flex;

    align-items:center;

    min-height:25px;

    padding:
        3px
        8px;

    border-radius:999px;

    background:
        var(--pink-50);

    color:
        var(--pink-700);

    font-size:10px;

    font-weight:700;

}


.price-defined {

    font-size:14px;

    font-weight:750;

    color:
        var(--text);

}


.price-undefined {

    display:inline-flex;

    align-items:center;

    min-height:26px;

    padding:
        3px
        8px;

    border-radius:999px;

    background:
        var(--yellow-bg);

    color:
        var(--yellow);

    font-size:10px;

    font-weight:700;

}


.badge {

    display:inline-flex;

    align-items:center;

    min-height:26px;

    padding:
        3px
        8px;

    border-radius:999px;

    font-size:10px;

    font-weight:700;

}


.badge-active {

    background:
        var(--green-bg);

    color:
        var(--green);

}


.badge-inactive {

    background:
        var(--gray-bg);

    color:
        var(--gray);

}


.action {

    min-height:39px;

    padding:
        0
        12px;

    border:
        1px solid
        var(--pink-200);

    border-radius:10px;

    background:
        var(--pink-50);

    color:
        var(--pink-700);

    font-size:11px;

    font-weight:700;

}


.action:hover {

    background:
        var(--pink-100);

}


.readonly-text {

    color:
        var(--text3);

    font-size:11px;

}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    padding:
        60px
        20px;

    text-align:center;

    color:
        var(--text3);

}


.empty-icon {

    margin-bottom:8px;

    font-size:34px;

}


/* =========================================================
   MOBILE CARDS
========================================================= */

.mobile-list {

    display:none;

}


.price-card {

    padding:16px;

    margin-bottom:10px;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:#ffffff;

}


.price-card-head {

    display:flex;

    align-items:flex-start;

    justify-content:
        space-between;

    gap:10px;

    margin-bottom:12px;

}


.price-card-name {

    font-size:15px;

    font-weight:750;

}


.price-card-code {

    margin-top:3px;

    color:
        var(--text3);

    font-size:10px;

}


.price-grid {

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:8px;

    margin-bottom:12px;

}


.price-info {

    padding:10px;

    border-radius:11px;

    background:
        #fcfafb;

}


.price-info-label {

    font-size:10px;

    color:
        var(--text3);

}


.price-info-value {

    margin-top:3px;

    font-size:12px;

    font-weight:700;

}


.mobile-action {

    width:100%;

    min-height:47px;

    border:
        1px solid
        var(--pink-200);

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-600)
        );

    color:#ffffff;

    font-weight:700;

}


/* =========================================================
   MODAL
========================================================= */

.modal-mask {

    display:none;

    position:fixed;

    inset:0;

    z-index:5000;

    padding:16px;

    align-items:center;

    justify-content:center;

    background:
        rgba(
            35,
            25,
            31,
            .45
        );

    backdrop-filter:
        blur(3px);

}


.modal-mask.show {

    display:flex;

}


.modal {

    width:100%;

    max-width:520px;

    max-height:92vh;

    overflow:auto;

    border-radius:20px;

    background:#ffffff;

    box-shadow:
        0 25px 70px
        rgba(
            50,
            20,
            32,
            .20
        );

}


.modal-head {

    position:sticky;

    top:0;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    gap:12px;

    padding:
        18px
        20px;

    background:#ffffff;

    border-bottom:
        1px solid
        var(--border);

}


.modal-title {

    font-size:18px;

    font-weight:750;

}


.modal-close {

    width:42px;

    height:42px;

    border:0;

    border-radius:11px;

    background:
        var(--pink-50);

    color:
        var(--pink-700);

    font-size:20px;

}


.modal-body {

    padding:20px;

}


.modal-product {

    padding:13px;

    margin-bottom:17px;

    border-radius:13px;

    background:
        var(--pink-50);

}


.modal-product-name {

    font-size:14px;

    font-weight:750;

}


.modal-product-city {

    margin-top:4px;

    font-size:11px;

    color:
        var(--text2);

}


.form-group {

    margin-bottom:15px;

}


.form-label {

    display:block;

    margin-bottom:7px;

    color:
        var(--text2);

    font-size:12px;

    font-weight:650;

}


.form-control {

    width:100%;

    min-height:52px;

    padding:
        0
        13px;

    border:
        1px solid
        #e3dce0;

    border-radius:12px;

    outline:none;

    background:#ffffff;

    font-size:16px;

}


.form-control:focus {

    border-color:
        var(--pink-300);

    box-shadow:
        0 0 0 3px
        var(--pink-50);

}


.form-hint {

    margin-top:6px;

    font-size:10px;

    line-height:1.6;

    color:
        var(--text3);

}


.modal-footer {

    position:sticky;

    bottom:0;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:9px;

    padding:
        15px
        20px
        20px;

    background:#ffffff;

    border-top:
        1px solid
        var(--border);

}


.cancel-button,
.save-button {

    min-height:50px;

    border-radius:12px;

    font-weight:700;

}


.cancel-button {

    border:
        1px solid
        var(--border);

    background:#ffffff;

}


.save-button {

    border:0;

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-600)
        );

}


.save-button:disabled {

    opacity:.55;

}


/* =========================================================
   TOAST
========================================================= */

.toast {

    display:none;

    position:fixed;

    z-index:9000;

    right:18px;

    bottom:18px;

    max-width:400px;

    padding:
        13px
        16px;

    border-radius:12px;

    font-size:13px;

    box-shadow:
        var(--shadow);

}


.toast.show {

    display:block;

}


.toast.success {

    color:#17664c;

    background:#effaf5;

}


.toast.error {

    color:#af294b;

    background:#fff0f4;

}


.toast.info {

    color:#665c62;

    background:#f8f5f7;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;

    background:#fffafd;

}


.spinner {

    width:38px;

    height:38px;

    border:
        4px solid
        var(--pink-100);

    border-top-color:
        var(--pink-500);

    border-radius:50%;

    animation:
        spin .8s
        linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media
(max-width:1000px) {

    .stats {

        grid-template-columns:
            1fr
            1fr;

    }


    .toolbar {

        grid-template-columns:
            1fr;

    }

}


@media
(max-width:760px) {

    .topbar {

        min-height:64px;

        padding:
            max(
                5px,
                env(
                    safe-area-inset-top
                )
            )
            11px
            5px;

    }


    .brand img {

        width:38px;

        height:38px;

        flex-basis:38px;

    }


    .brand-title {

        font-size:16px;

    }


    .brand-sub {

        display:none;

    }


    .back-button {

        display:none;

    }


    .logout-button {

        min-height:42px;

        padding:
            0
            13px;

        font-size:11px;

    }


    .main {

        padding:
            14px
            11px
            28px;

    }


    .hero {

        padding:
            21px
            18px;

        margin-bottom:13px;

        border-radius:18px;

    }


    .hero h1 {

        font-size:21px;

    }


    .hero p {

        font-size:12px;

    }


    .stats {

        grid-template-columns:
            1fr
            1fr;

        gap:8px;

        margin-bottom:12px;

    }


    .stat {

        min-height:92px;

        padding:14px;

    }


    .stat-value {

        font-size:20px;

    }


    .toolbar {

        padding:10px;

        grid-template-columns:
            1fr;

        gap:8px;

        margin-bottom:11px;

    }


    .current-city {

        align-items:flex-start;

        flex-direction:column;

        padding:13px;

    }


    .current-city-note {

        text-align:left;

    }


    .panel {

        border:0;

        background:transparent;

    }


    .table-scroll {

        display:none;

    }


    .mobile-list {

        display:block;

    }


    .modal-mask {

        align-items:flex-end;

        padding:0;

    }


    .modal {

        max-width:none;

        max-height:92dvh;

        border-radius:
            22px
            22px
            0
            0;

    }


    .modal-footer {

        padding-bottom:
            max(
                18px,
                env(
                    safe-area-inset-bottom
                )
            );

    }


    .toast {

        left:10px;

        right:10px;

        bottom:
            max(
                12px,
                env(
                    safe-area-inset-bottom
                )
            );

    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING
========================================================= -->

<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div
        style="
            color:#756a71;
            font-size:13px;
        "
    >
        正在读取城市销售价格...
    </div>

</div>



<!-- =========================================================
     TOP
========================================================= -->

<header class="topbar">


    <div class="brand">


        <img
            src="./logo.jpeg"
            alt="孕乃馨"
        >


        <div>


            <div class="brand-title">
                城市销售价格
            </div>


            <div class="brand-sub">
                孕乃馨平台管理中心
            </div>


        </div>


    </div>



    <div class="top-actions">


        <button
            class="back-button"
            onclick="goHome()"
        >
            返回工作台
        </button>


        <button
            class="logout-button"
            onclick="logout()"
        >
            退出
        </button>


    </div>


</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">


    <div class="hero-content">


        <div class="hero-tag">
            CITY SALES PRICE
        </div>


        <h1>
            城市销售价格
        </h1>


        <p>
            平台统一建立产品名录，各个已开通服务城市分别定义本地销售价格。
            新开通城市的产品销售价格初始为“未定义”，由有权限的管理人员根据当地市场情况填写。
        </p>


    </div>


</section>



<!-- =========================================================
     STATS
========================================================= -->

<section class="stats">


    <div class="stat">

        <div class="stat-label">
            已开展业务城市
        </div>

        <div
            id="statCities"
            class="stat-value"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            当前城市产品
        </div>

        <div
            id="statProducts"
            class="stat-value"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            已定义销售价
        </div>

        <div
            id="statDefined"
            class="stat-value"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            未定义销售价
        </div>

        <div
            id="statUndefined"
            class="stat-value"
        >
            0
        </div>

        <div class="stat-note">
            需要本地管理人员定义
        </div>

    </div>


</section>



<!-- =========================================================
     FILTER
========================================================= -->

<section class="toolbar">


    <select
        id="cityFilter"
        class="select"
        onchange="cityChanged()"
    >

        <option value="">
            请选择已开展业务城市
        </option>

    </select>


    <input
        id="searchInput"
        class="input"
        type="search"
        placeholder="搜索产品名称或产品编号"
        oninput="renderPrices()"
    >


    <select
        id="priceFilter"
        class="select"
        onchange="renderPrices()"
    >

        <option value="">
            全部价格状态

<div

>

    </button>

        >

>

<script>


/* =========================================================
   01. Supabase
========================================================= */


const SUPABASE_URL =
    "https://qbuqjwpkltbjhlfbyjyb.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY,

        {

            auth:{

                persistSession:true,

                autoRefreshToken:true,

                detectSessionInUrl:true

            }

        }

    );


const LOGIN_PAGE =
    "./login.html";


const HOME_PAGE =
    "./wholemanagement.html";



/* =========================================================
   02. DATA
========================================================= */


let currentUser =
    null;


let currentProfile =
    null;


let currentAssignment =
    null;


let provinces =
    [];


let cities =
    [];


let serviceAreas =
    [];


let products =
    [];


let cityPrices =
    [];


let currentCityId =
    null;


let currentRows =
    [];


let editingProductId =
    null;


let canEditPrice =
    false;



/* =========================================================
   03. INIT
========================================================= */


async function initialize() {


    try {


        const {

            data:{
                session
            },

            error:sessionError

        } =

        await supabaseClient.auth
            .getSession();



        if (
            sessionError
            ||
            !session
        ) {


            location.replace(
                LOGIN_PAGE
            );


            return;

        }



        currentUser =
            session.user;



        await verifyAccess();



        await Promise.all([

            loadRegions(),

            loadServiceAreas(),

            loadProducts()

        ]);



        buildAccessibleCities();


        fillCityFilter();



        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const requestedCityId =
            urlParams.get(
                "city_id"
            );



        if (
            requestedCityId
            &&
            accessibleCityIds()
                .has(
                    String(
                        requestedCityId
                    )
                )
        ) {


            document.getElementById(
                "cityFilter"
            ).value =
                String(
                    requestedCityId
                );


            await selectCity(
                requestedCityId
            );

        }


        else {


            const accessible =
                getAccessibleServiceAreas();



            if (
                accessible.length ===
                1
            ) {


                const cityId =
                    String(
                        accessible[0].city_id
                    );


                document.getElementById(
                    "cityFilter"
                ).value =
                    cityId;


                await selectCity(
                    cityId
                );

            }

            else {


                updateCityStats();

            }

        }



        document.getElementById(
            "loading"
        ).style.display =
            "none";


    }

    catch(error) {


        console.error(
            "城市价格页面初始化失败：",
            error
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        alert(
            error.message
            ||
            "城市销售价格页面加载失败。"
        );

    }

}



/* =========================================================
   04. ACCESS
========================================================= */


async function verifyAccess() {


    const {

        data:profile,

        error

    } =

    await supabaseClient

        .from(
            "profiles"
        )

        .select(`
            id,
            full_name,
            role,
            status
        `)

        .eq(
            "id",
            currentUser.id
        )

        .maybeSingle();



    if (
        error
        ||
        !profile
    ) {


        throw new Error(
            "无法读取当前管理账号资料。"
        );

    }



    if (
        profile.status !==
        "active"
    ) {


        await supabaseClient.auth
            .signOut();


        throw new Error(
            "当前账号已经停用。"
        );

    }



    const allowedRoles = [

        "founder",

        "platform_admin",

        "province_admin",

        "city_admin"

    ];



    if (
        !allowedRoles.includes(
            profile.role
        )
    ) {


        alert(
            "当前账号没有城市销售价格页面访问权限。"
        );


        location.replace(
            HOME_PAGE
        );


        throw new Error(
            "没有访问权限"
        );

    }



    currentProfile =
        profile;



    if (
        [
            "province_admin",
            "city_admin"
        ].includes(
            profile.role
        )
    ) {


        const {

            data:assignment,

            error:assignmentError

        } =

        await supabaseClient

            .from(
                "admin_assignments"
            )

            .select(`
                province_id,
                city_id,
                district_id,
                status
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .eq(
                "status",
                "active"
            )

            .limit(1)

            .maybeSingle();



        if (
            assignmentError
        ) {


            throw assignmentError;

        }



        if (!assignment) {


            throw new Error(
                "当前账号尚未配置管理辖区。"
            );

        }



        currentAssignment =
            assignment;

    }



    /*
        1.0版本价格编辑权限：

        founder
        platform_admin
        city_admin

        省管理员只查看
    */


    canEditPrice =
        [

            "founder",

            "platform_admin",

            "city_admin"

        ].includes(
            currentProfile.role
        );

}



/* =========================================================
   05. REGIONS
========================================================= */


async function loadRegions() {


    const [

        provinceResult,

        cityResult

    ] =

    await Promise.all([


        supabaseClient

            .from(
                "provinces"
            )

            .select(`
                id,
                province_name,
                status
            `),


        supabaseClient

            .from(
                "cities"
            )

            .select(`
                id,
                province_id,
                city_name,
                status
            `)


    ]);



    if (
        provinceResult.error
    ) {


        throw provinceResult.error;

    }



    if (
        cityResult.error
    ) {


        throw cityResult.error;

    }



    provinces =
        provinceResult.data
        ||
        [];


    cities =
        cityResult.data
        ||
        [];

}



/* =========================================================
   06. SERVICE AREAS
========================================================= */


async function loadServiceAreas() {


    const {

        data,

        error

    } =

    await supabaseClient

        .from(
            "service_areas"
        )

        .select(`
            id,
            area_no,
            province_id,
            city_id,
            district_id,
            status,
            created_at
        `)

        .eq(
            "status",
            "active"
        )

        .order(
            "area_no",
            {
                ascending:true
            }
        );



    if (error) {


        throw error;

    }



    serviceAreas =
        data
        ||
        [];

}



/* =========================================================
   07. PRODUCTS
========================================================= */


async function loadProducts() {


    const {

        data,

        error

    } =

    await supabaseClient

        .from(
            "products"
        )

        .select("*")

        .eq(
            "status",
            "active"
        )

        .order(
            "id",
            {
                ascending:true
            }
        );



    if (error) {


        throw error;

    }



    products =
        data
        ||
        [];

}



/* =========================================================
   08. ACCESSIBLE CITIES
========================================================= */


function getAccessibleServiceAreas() {


    if (
        !currentProfile
    ) {


        return [];

    }



    if (
        [
            "founder",
            "platform_admin"
        ].includes(
            currentProfile.role
        )
    ) {


        return serviceAreas;

    }



    if (
        currentProfile.role ===
        "province_admin"
    ) {


        return serviceAreas.filter(

            area =>
                String(
                    area.province_id
                )
                ===
                String(
                    currentAssignment?.province_id
                )

        );

    }



    if (
        currentProfile.role ===
        "city_admin"
    ) {


        return serviceAreas.filter(

            area =>
                String(
                    area.city_id
                )
                ===
                String(
                    currentAssignment?.city_id
                )

        );

    }



    return [];

}



function accessibleCityIds() {


    return new Set(

        getAccessibleServiceAreas()

        .map(

            area =>
                String(
                    area.city_id
                )

        )

    );

}



/* =========================================================
   09. BUILD ACCESS
========================================================= */


function buildAccessibleCities() {


    const areas =
        getAccessibleServiceAreas();



    document.getElementById(
        "statCities"
    ).textContent =
        new Set(

            areas.map(
                item =>
                    String(
                        item.city_id
                    )
            )

        ).size;

}



/* =========================================================
   10. CITY FILTER
========================================================= */


function fillCityFilter() {


    const select =
        document.getElementById(
            "cityFilter"
        );


    select.innerHTML =
        `
        <option value="">
            请选择已开展业务城市
        </option>
        `;



    const areas =
        getAccessibleServiceAreas();



    const used =
        new Set();



    areas.forEach(

        area => {


            const cityId =
                String(
                    area.city_id
                );



            if (
                used.has(
                    cityId
                )
            ) {


                return;

            }



            used.add(
                cityId
            );



            const province =
                provinceName(
                    area.province_id
                );


            const city =
                cityName(
                    area.city_id
                );



            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cityId;


            option.textContent =
                `${formatNo(area.area_no)}｜${province} · ${city}`;


            select.appendChild(
                option
            );

        }

    );

}



/* =========================================================
   11. CITY CHANGED
========================================================= */


async function cityChanged() {


    const value =
        document.getElementById(
            "cityFilter"
        ).value;



    if (!value) {


        currentCityId =
            null;


        currentRows =
            [];


        cityPrices =
            [];


        document.getElementById(
            "currentCityBox"
        ).classList.add(
            "hidden"
        );


        renderPrices();


        updateCityStats();


        return;

    }



    await selectCity(
        value
    );

}



/* =========================================================
   12. SELECT CITY
========================================================= */


async function selectCity(
    cityId
) {


    if (
        !accessibleCityIds()
            .has(
                String(
                    cityId
                )
            )
    ) {


        showToast(
            "当前账号没有该城市的价格管理权限。",
            "error"
        );


        return;

    }



    currentCityId =
        String(
            cityId
        );



    await loadCityPrices();



    buildCurrentRows();



    renderCurrentCity();


    renderPrices();


    updateCityStats();

}



/* =========================================================
   13. LOAD CITY PRICES
========================================================= */


async function loadCityPrices() {


    if (
        !currentCityId
    ) {


        cityPrices =
            [];


        return;

    }



    const {

        data,

        error

    } =

    await supabaseClient

        .from(
            "city_prices"
        )

        .select(`
            city_id,
            product_id,
            price,
            status
        `)

        .eq(
            "city_id",
            Number(
                currentCityId
            )
        );



    if (error) {


        throw error;

    }



    cityPrices =
        data
        ||
        [];

}



/* =========================================================
   14. BUILD ROWS
========================================================= */


function buildCurrentRows() {


    const priceMap =
        new Map();



    cityPrices.forEach(

        item => {


            priceMap.set(

                String(
                    item.product_id
                ),

                item

            );

        }

    );



    currentRows =
        products.map(

            product => {


                const priceRow =
                    priceMap.get(
                        String(
                            product.id
                        )
                    )
                    ||
                    null;



                return {

                    product,

                    priceRow

                };

            }

        );

}



/* =========================================================
   15. CURRENT CITY
========================================================= */


function renderCurrentCity() {


    const area =
        getAccessibleServiceAreas()
        .find(

            item =>
                String(
                    item.city_id
                )
                ===
                String(
                    currentCityId
                )

        );



    if (!area) {


        document.getElementById(
            "currentCityBox"
        ).classList.add(
            "hidden"
        );


        return;

    }



    document.getElementById(
        "currentCityBox"
    ).classList.remove(
        "hidden"
    );



    document.getElementById(
        "currentCityName"
    ).textContent =

        `${provinceName(area.province_id)} · ${cityName(area.city_id)}`;



    let note =
        "";



    if (
        currentProfile.role ===
        "city_admin"
    ) {


        note =
            "您负责本城市销售价格维护";

    }


    else if (
        currentProfile.role ===
        "province_admin"
    ) {


        note =
            "省级管理员当前为查看权限";

    }


    else {


        note =
            "平台管理人员可维护该城市销售价格";

    }



    document.getElementById(
        "currentCityNote"
    ).textContent =
        note;

}



/* =========================================================
   16. RENDER
========================================================= */


function renderPrices() {


    const tbody =
        document.getElementById(
            "priceTable"
        );


    const mobile =
        document.getElementById(
            "mobileList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );



    tbody.innerHTML =
        "";


    mobile.innerHTML =
        "";



    if (
        !currentCityId
    ) {


        empty.classList.remove(
            "hidden"
        );


        empty.innerHTML =
            `
            <div class="empty-icon">
                💗
            </div>

            请选择一个已经开展业务的城市
            `;


        return;

    }



    const keyword =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();



    const priceFilter =
        document.getElementById(
            "priceFilter"
        ).value;



    const rows =
        currentRows.filter(

            row => {


                const name =
                    getProductName(
                        row.product
                    );


                const code =
                    getProductCode(
                        row.product
                    );


                const text =
                    `${name} ${code}`
                    .toLowerCase();



                if (
                    keyword
                    &&
                    !text.includes(
                        keyword
                    )
                ) {


                    return false;

                }



                const price =
                    row.priceRow?.price;



                const isDefined =
                    price !== null
                    &&
                    price !== undefined
                    &&
                    price !== "";



                if (
                    priceFilter ===
                    "defined"
                    &&
                    !isDefined
                ) {


                    return false;

                }



                if (
                    priceFilter ===
                    "undefined"
                    &&
                    isDefined
                ) {


                    return false;

                }



                return true;

            }

        );



    if (
        rows.length ===
        0
    ) {


        empty.classList.remove(
            "hidden"
        );


        empty.innerHTML =
            `
            <div class="empty-icon">
                📦
            </div>

            暂无符合条件的产品价格
            `;


        return;

    }



    empty.classList.add(
        "hidden"
    );



    const city =
        cityName(
            currentCityId
        );



    rows.forEach(

        row => {


            const product =
                row.product;


            const priceRow =
                row.priceRow;



            const price =
                priceRow?.price
                ??
                null;



            const defined =
                price !== null
                &&
                price !== undefined
                &&
                price !== "";



            const status =
                priceRow?.status
                ||
                "active";



            tbody.insertAdjacentHTML(

                "beforeend",

                `

                <tr>


                    <td>

                        <div class="product-name">
                            ${escapeHtml(
                                getProductName(
                                    product
                                )
                            )}
                        </div>

                        <div class="product-code">
                            ${escapeHtml(
                                getProductCode(
                                    product
                                )
                            )}
                        </div>

                    </td>


                    <td>

                        <span class="product-type">
                            ${escapeHtml(
                                getProductTypeText(
                                    product
                                )
                            )}
                        </span>

                    </td>


                    <td>
                        ${escapeHtml(city)}
                    </td>


                    <td>

                        ${
                            formatPrice(
                                price
                            )
                        }

                    </td>


                    <td>

                        ${
                            defined
                            ?
                            `
                            <span class="badge badge-active">
                                已定义
                            </span>
                            `
                            :
                            `
                            <span class="badge badge-inactive">
                                未定义
                            </span>
                            `
                        }

                    </td>


                    <td>

                        ${
                            canEditPrice
                            ?
                            `
                            <button
                                class="action"
                                onclick="openPriceModal(${Number(product.id)})"
                            >
                                ${
                                    defined
                                    ?
                                    "修改价格"
                                    :
                                    "定义价格"
                                }
                            </button>
                            `
                            :
                            `
                            <span class="readonly-text">
                                仅查看
                            </span>
                            `
                        }

                    </td>


                </tr>

                `

            );



            mobile.insertAdjacentHTML(

                "beforeend",

                `

                <div class="price-card">


                    <div class="price-card-head">


                        <div>


                            <div class="price-card-name">
                                ${escapeHtml(
                                    getProductName(
                                        product
                                    )
                                )}
                            </div>


                            <div class="price-card-code">
                                ${escapeHtml(
                                    getProductCode(
                                        product
                                    )
                                )}
                            </div>


                        </div>


                        <span class="product-type">
                            ${escapeHtml(
                                getProductTypeText(
                                    product
                                )
                            )}
                        </span>


                    </div>



                    <div class="price-grid">


                        <div class="price-info">

                            <div class="price-info-label">
                                城市
                            </div>

                            <div class="price-info-value">
                                ${escapeHtml(city)}
                            </div>

                        </div>


                        <div class="price-info">

                            <div class="price-info-label">
                                销售价格
                            </div>

                            <div class="price-info-value">
                                ${formatPrice(price)}
                            </div>

                        </div>


                        <div class="price-info">

                            <div class="price-info-label">
                                价格状态
                            </div>

                            <div class="price-info-value">
                                ${
                                    defined
                                    ?
                                    "已定义"
                                    :
                                    "未定义"
                                }
                            </div>

                        </div>


                        <div class="price-info">

                            <div class="price-info-label">
                                数据状态
                            </div>

                            <div class="price-info-value">
                                ${
                                    status ===
                                    "active"
                                    ?
                                    "有效"
                                    :
                                    "无效"
                                }
                            </div>

                        </div>


                    </div>


                    ${
                        canEditPrice
                        ?
                        `
                        <button
                            class="mobile-action"
                            onclick="openPriceModal(${Number(product.id)})"
                        >
                            ${
                                defined
                                ?
                                "修改销售价格"
                                :
                                "定义销售价格"
                            }
                        </button>
                        `
                        :
                        `
                        <div class="readonly-text">
                            当前账号仅可查看该城市销售价格
                        </div>
                        `
                    }


                </div>

                `

            );

        }

    );

}



/* =========================================================
   17. STATS
========================================================= */


function updateCityStats() {


    if (
        !currentCityId
    ) {


        document.getElementById(
            "statProducts"
        ).textContent =
            0;


        document.getElementById(
            "statDefined"
        ).textContent =
            0;


        document.getElementById(
            "statUndefined"
        ).textContent =
            0;


        return;

    }



    const total =
        currentRows.length;



    const defined =
        currentRows.filter(

            row => {


                const price =
                    row.priceRow?.price;


                return (
                    price !== null
                    &&
                    price !== undefined
                    &&
                    price !== ""
                );

            }

        ).length;



    document.getElementById(
        "statProducts"
    ).textContent =
        total;



    document.getElementById(
        "statDefined"
    ).textContent =
        defined;



    document.getElementById(
        "statUndefined"
    ).textContent =
        total - defined;

}



/* =========================================================
   18. OPEN MODAL
========================================================= */


function openPriceModal(
    productId
) {


    if (
        !canEditPrice
    ) {


        showToast(
            "当前账号没有销售价格修改权限。",
            "error"
        );


        return;

    }



    if (
        !currentCityId
    ) {


        showToast(
            "请先选择城市。",
            "error"
        );


        return;

    }



    const row =
        currentRows.find(

            item =>
                Number(
                    item.product.id
                )
                ===
                Number(
                    productId
                )

        );



    if (!row) {


        showToast(
            "没有找到该产品。",
            "error"
        );


        return;

    }



    editingProductId =
        Number(
            productId
        );



    document.getElementById(
        "modalProductName"
    ).textContent =
        getProductName(
            row.product
        );



    document.getElementById(
        "modalProductCity"
    ).textContent =

        `${cityName(currentCityId)} · 当前销售价格：${
            row.priceRow?.price === null
            ||
            row.priceRow?.price === undefined
            ?
            "未定义"
            :
            "¥" + Number(row.priceRow.price).toFixed(2)
        }`;



    document.getElementById(
        "priceInput"
    ).value =

        row.priceRow?.price
        ??
        "";



    document.getElementById(
        "priceModal"
    ).classList.add(
        "show"
    );

}



/* =========================================================
   19. CLOSE MODAL
========================================================= */


function closePriceModal() {


    editingProductId =
        null;


    document.getElementById(
        "priceModal"
    ).classList.remove(
        "show"
    );

}



/* =========================================================
   20. SAVE
========================================================= */


async function savePrice() {


    if (
        !canEditPrice
    ) {


        showToast(
            "当前账号没有价格修改权限。",
            "error"
        );


        return;

    }



    if (
        !currentCityId
        ||
        editingProductId ===
        null
    ) {


        return;

    }



    const raw =
        document.getElementById(
            "priceInput"
        )
        .value
        .trim();



    let price =
        null;



    if (
        raw !==
        ""
    ) {


        price =
            Number(
                raw
            );



        if (
            !Number.isFinite(
                price
            )
            ||
            price < 0
        ) {


            showToast(
                "销售价格必须是大于或等于0的数字。",
                "error"
            );


            return;

        }

    }



    const button =
        document.getElementById(
            "savePriceButton"
        );


    button.disabled =
        true;


    button.textContent =
        "保存中...";



    try {


        /*
            先尝试更新现有城市价格记录
        */


        const {

            data:updateData,

            error:updateError

        } =

        await supabaseClient

            .from(
                "city_prices"
            )

            .update({

                price:
                    price,

                status:
                    "active"

            })

            .eq(
                "city_id",
                Number(
                    currentCityId
                )
            )

            .eq(
                "product_id",
                Number(
                    editingProductId
                )
            )

            .select(`
                city_id,
                product_id,
                price,
                status
            `);



        if (
            updateError
        ) {


            throw updateError;

        }



        /*
            理论上开通城市后已经自动建立city_prices。
            如果数据库中意外缺失，则补建一条。
        */


        if (
            !updateData
            ||
            updateData.length ===
            0
        ) {


            const {

                error:insertError

            } =

            await supabaseClient

                .from(
                    "city_prices"
                )

                .insert({

                    city_id:
                        Number(
                            currentCityId
                        ),

                    product_id:
                        Number(
                            editingProductId
                        ),

                    price:
                        price,

                    status:
                        "active"

                });



            if (
                insertError
            ) {


                throw insertError;

            }

        }



        showToast(
            price ===
            null
            ?
            "销售价格已设为未定义。"
            :
            "城市销售价格已保存。",
            "success"
        );



        closePriceModal();


        await loadCityPrices();


        buildCurrentRows();


        renderPrices();


        updateCityStats();


    }

    catch(error) {


        console.error(
            "保存城市价格失败：",
            error
        );


        showToast(
            error.message
            ||
            "销售价格保存失败。",
            "error"
        );


    }

    finally {


        button.disabled =
            false;


        button.textContent =
            "保存价格";

    }

}



/* =========================================================
   21. PRODUCT HELPERS
========================================================= */


function getProductName(
    product
) {


    if (!product) {


        return "未知产品";

    }



    return (

        product.product_name
        ||
        product.name
        ||
        "未命名产品"

    );

}



function getProductCode(
    product
) {


    if (!product) {


        return "-";

    }



    return (

        product.product_code
        ||
        product.code
        ||
        `P${String(product.id).padStart(3,"0")}`

    );

}



function getProductTypeText(
    product
) {


    const type =

        product?.product_type
        ??
        product?.type
        ??
        "";



    if (
        type ===
        "service"
    ) {


        return "服务类";

    }



    if (
        type ===
        "physical"
        ||
        type ===
        "physical_goods"
    ) {


        return "实物类";

    }



    return "标准产品";

}



/* =========================================================
   22. REGION HELPERS
========================================================= */


function provinceName(
    id
) {


    if (!id) {


        return "-";

    }



    return (

        provinces.find(

            item =>
                String(
                    item.id
                )
                ===
                String(
                    id
                )

        )?.province_name

        ||

        "-"

    );

}



function cityName(
    id
) {


    if (!id) {


        return "-";

    }



    return (

        cities.find(

            item =>
                String(
                    item.id
                )
                ===
                String(
                    id
                )

        )?.city_name

        ||

        "-"

    );

}



/* =========================================================
   23. PRICE
========================================================= */


function formatPrice(
    value
) {


    if (
        value ===
        null
        ||
        value ===
        undefined
        ||
        value ===
        ""
    ) {


        return `
            <span class="price-undefined">
                未定义
            </span>
        `;

    }



    const number =
        Number(
            value
        );



    if (
        Number.isNaN(
            number
        )
    ) {


        return escapeHtml(
            value
        );

    }



    return `
        <span class="price-defined">
            ¥${number.toFixed(2)}
        </span>
    `;

}



/* =========================================================
   24. FORMAT
========================================================= */


function formatNo(
    value
) {


    if (
        value ===
        null
        ||
        value ===
        undefined
        ||
        value ===
        ""
    ) {


        return "-";

    }



    return String(
        value
    )
    .padStart(
        3,
        "0"
    );

}



function escapeHtml(
    value
) {


    return String(
        value
        ??
        ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   25. TOAST
========================================================= */


let toastTimer;



function showToast(
    text,
    type="info"
) {


    const toast =
        document.getElementById(
            "toast"
        );



    toast.textContent =
        text;



    toast.className =
        `toast show ${type}`;



    clearTimeout(
        toastTimer
    );



    toastTimer =
        setTimeout(

            () => {


                toast.className =
                    "toast";


            },

            3500

        );

}

========================================================= */

    location.href =
        HOME_PAGE;

}



/* =========================================================
   27. LOGOUT
========================================================= */


async function logout() {


    if (
        !confirm(
            "确定退出登录吗？"
        )
    ) {


        return;

    }



    try {


        await supabaseClient.auth
            .signOut();


    }

    catch(error) {


        console.error(
            error
        );

    }



    location.replace(
        LOGIN_PAGE
    );

}



/* =========================================================
   28. IDLE
========================================================= */


let idleTimer;



function resetIdle() {


    clearTimeout(
        idleTimer
    );



    idleTimer =
        setTimeout(

            async () => {


                try {


                    await supabaseClient.auth
                        .signOut();


                }

                catch(error) {


                    console.error(
                        error
                    );

                }



                alert(
                    "由于10分钟未操作，系统已经自动退出。"
                );



                location.replace(
                    LOGIN_PAGE
                );


            },

            10 * 60 * 1000

        );

}



[
    "click",
    "touchstart",
    "keydown",
    "mousemove",
    "scroll"
]
.forEach(

    eventName => {


        document.addEventListener(

            eventName,

            resetIdle,

            {
                passive:true
            }

        );

    }

);



/* =========================================================
   29. AUTH WATCH
========================================================= */


supabaseClient.auth

    .onAuthStateChange(

        (
            event,
            session
        ) => {


            if (
                event ===
                "SIGNED_OUT"
            ) {


                location.replace(
                    LOGIN_PAGE
                );

            }

        }

    );



/* =========================================================
   30. START
========================================================= */


document.addEventListener(

    "DOMContentLoaded",

    () => {


        resetIdle();


        initialize();

    }

);
