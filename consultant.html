}

<body class="auth-loading">


<header class="topbar">


<div>


<div class="brand">

孕乃馨 · 商户分账规则管理

</div>


<div class="brand-sub">

YUNNAIXIN MANAGEMENT

</div>


</div>




<div class="topbar-right">


<div id="currentUser"
class="current-user">

正在验证登录...

</div>



<button
class="btn btn-secondary"
onclick="goBack()">

返回工作台

</button>



<button
class="btn btn-danger"
onclick="logout()">

退出

</button>


</div>


</header>



<main class="page">



<div class="page-header">


<div>


<div class="page-title">

产品级分账规则管理

</div>


<div class="page-description">

每个城市、商户、服务项目独立配置。
已经生效的分账规则自动锁定。

</div>


</div>


</div>



<!-- 选择区域 -->

<section class="card">


<div class="card-title">

选择已开通服务城市

</div>


<div class="select-grid">



<div class="form-group">

<label>
省份
</label>


<select id="provinceSelect">

<option>
加载中...
</option>

</select>

</div>




<div class="form-group">

<label>
已开通服务城市
</label>


<select id="citySelect">

<option>
请选择城市
</option>

</select>

</div>




<div class="form-group">

<label>
商户
</label>


<select id="merchantSelect">

<option>
请选择商户
</option>

</select>

</div>



</div>

<script>


/* =====================================================
   Supabase
===================================================== */


const SUPABASE_URL =
"https://icmifhjihgjrhkunjbmu.supabase.co";


const SUPABASE_ANON_KEY =
"你的anon-key";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



let currentSession=null;

let currentProfile=null;


let selectedProductId=null;



/* =====================================================
   初始化
===================================================== */


window.onload=async()=>{


const ok =
await requireAccess();


if(!ok){

return;

}


await loadProvinces();


bindEvents();


};





/* =====================================================
   权限验证
===================================================== */


async function requireAccess(){


const {

data:{
session

}

}

=
await supabaseClient.auth.getSession();



if(!session){


location.href="page10.html";


return false;


}



currentSession=session;



const {

data:profile

}

=
await supabaseClient

.from("profiles")

.select(`
id,
display_name,
role,
is_active
`)

.eq(
"id",
session.user.id
)

.single();



if(!profile || profile.is_active!==true){


await supabaseClient.auth.signOut();


location.href="page10.html";


return false;


}



const roles=[

"founder",
"admin"

];



if(!roles.includes(profile.role)){


alert(
"无权限访问"
);


location.href=
"wholemanagement.html";


return false;


}



currentProfile=profile;



document.getElementById(
"currentUser"
)
.textContent=

(
profile.display_name ||
session.user.email
)
+
" · "
+
profile.role;



document.body.classList.remove(
"auth-loading"
);



resetTimer();



return true;


}






/* =====================================================
   省份
===================================================== */


async function loadProvinces(){



const {

data

}

=
await supabaseClient

.from("provinces")

.select(
"id,name"
)

.eq(
"status",
"active"
)

.order(
"id"
);



const box =
document.getElementById(
"provinceSelect"
);



box.innerHTML="";



data?.forEach(p=>{


let op =
document.createElement(
"option"
);


op.value=p.id;


op.textContent=p.name;


box.appendChild(op);


});



await loadCities();


}







/* =====================================================
   已开通服务城市
===================================================== */


async function loadCities(){



const provinceId =
document.getElementById(
"provinceSelect"
)
.value;



const box =
document.getElementById(
"citySelect"
);



box.innerHTML=
"<option>加载中...</option>";



/*

只显示已经存在城市价格的城市

city_prices
        |
        |
      cities

*/


const {

data

}

=
await supabaseClient

.from("city_prices")

.select(`

city_id,

cities(

id,

city_name,

province_id

)

`)

.eq(
"status",
"active"
)

.eq(
"cities.province_id",
provinceId
);





let cityMap={};



data?.forEach(item=>{


if(item.cities){


cityMap[item.city_id]=
item.cities;


}


});





box.innerHTML=
"<option value=''>请选择已开通城市</option>";




Object.values(cityMap)

.forEach(city=>{


let op =
document.createElement(
"option"
);



op.value =
city.id;



op.textContent =
city.city_name;



box.appendChild(op);



});



}








/* =====================================================
   商户
===================================================== */


async function loadMerchants(){



const cityId =
document.getElementById(
"citySelect"
)
.value;



const box =
document.getElementById(
"merchantSelect"
);



box.innerHTML=
"<option>请选择商户</option>";



if(!cityId){

return;

}




const {

data

}

=
await supabaseClient

.from("merchants")

.select(`
id,
merchant_name
`)

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);





data?.forEach(m=>{


let op =
document.createElement(
"option"
);



op.value=m.id;


op.textContent=m.merchant_name;



box.appendChild(op);



});



}








/* =====================================================
   加载商户全部服务项目
===================================================== */


async function loadMerchantProducts(){



const merchantId =
document.getElementById(
"merchantSelect"
)
.value;


const cityId =
document.getElementById(
"citySelect"
)
.value;



if(
!merchantId ||
!cityId
){

return;

}



const tbody =
document.getElementById(
"productList"
);



tbody.innerHTML=
"";





/*

第一步：

读取城市已经开通产品

*/


const {

data:prices

}

=
await supabaseClient

.from("city_prices")

.select(`

product_id,

price,

products(

id,

product_name

)

`)

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);






/*

第二步：

读取已经定义规则

*/


const {

data:rules

}

=
await supabaseClient

.from("merchant_product_rules")

.select("*")

.eq(
"merchant_id",
merchantId
)

.eq(
"status",
"active"
);






if(!prices || prices.length===0){


tbody.innerHTML=

`

<tr>

<td colspan="4">

该城市暂无开通服务项目

</td>

</tr>

`;


return;

}





/*

第三步：

合并显示

*/


prices.forEach(item=>{



let rule =
rules?.find(
r=>
r.product_id===
item.product_id
);



let tr =
document.createElement(
"tr"
);





if(rule){


/*

已经定义

灰色锁定

*/


tr.className=
"lock-row";



tr.innerHTML=

`

<td>

${escapeHtml(
item.products.product_name
)}

</td>


<td>

<span class="badge-active">

已生效

</span>

</td>



<td>

平台：
${rule.platform_ratio||0}%

<br>

城市：
${rule.city_manager_ratio||0}%

<br>

商户：
${rule.store_ratio||0}%

<br>

服务人员：
${rule.operator_ratio||0}%

<br>

顾问：
${rule.order_source_ratio||0}%

<br>

软件：
${rule.software_service_ratio||2}%

</td>



<td>

<button

class="btn-small btn-lock"

disabled

>

已锁定

</button>

</td>


`;



}

else{


/*

未定义

允许创建

*/


tr.innerHTML=

`

<td>

${escapeHtml(
item.products.product_name
)}

</td>



<td>

<span class="badge-warning">

未定义

</span>

</td>



<td>

--

</td>



<td>


<button

class="btn-small btn-set"

onclick="openRule(
${item.product_id},
'${item.products.product_name}'
)"

>

设置分账

</button>


</td>


`;



}



tbody.appendChild(tr);



});




}


  <!-- =====================================================
     服务项目列表
===================================================== -->


<section class="card">


<div class="card-title">

该城市已开通服务项目

</div>



<div class="table-box">


<table>


<thead>

<tr>

<th>
服务项目
</th>

<th>
状态
</th>

<th>
当前分账比例
</th>

<th>
操作
</th>

</tr>


</thead>


<tbody id="productList">


</tbody>


</table>


</div>


</section>






<!-- =====================================================
     分账设置
===================================================== -->


<section
id="ruleEditor"
class="card hidden"
>


<div class="card-title"
id="ruleTitle">

设置分账规则

</div>




<div class="rule-grid">



<div class="rule-item">

<span>

城市负责人 %

</span>


<input
id="cityRatio"
type="number"
value="0"
min="0"
>


</div>





<div class="rule-item">

<span>

软件服务商 %

</span>


<input
id="softwareRatio"
type="number"
value="2"
readonly
>


</div>





<div class="rule-item">

<span>

运营平台 %

</span>


<input
id="platformRatio"
type="number"
value="0"
min="0"
>


</div>






<div class="rule-item">

<span>

商户 %

</span>


<input
id="merchantRatio"
type="number"
value="0"
min="0"
>


</div>





<div class="rule-item">

<span>

服务人员 %

</span>


<input
id="workerRatio"
type="number"
value="0"
min="0"
>


</div>





<div class="rule-item">

<span>

健康顾问 %

</span>


<input
id="advisorRatio"
type="number"
value="0"
min="0"
>


</div>


</div>




<div class="total-box">

当前比例合计：

<span id="totalRatio">

2

</span>

%

</div>




<div class="save-area">


<button

class="btn btn-primary"

onclick="saveRule()"

>

保存分账规则

</button>


</div>


</section>






<div id="messageBox">


</div>



<script>




/* =====================================================
   事件绑定
===================================================== */


function bindEvents(){



document

.getElementById(
"provinceSelect"
)

.onchange =
async()=>{


await loadCities();


};





document

.getElementById(
"citySelect"
)

.onchange =
async()=>{


await loadMerchants();


};





document

.getElementById(
"merchantSelect"
)

.onchange =
async()=>{


await loadMerchantProducts();


};







[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

]

.forEach(id=>{


document

.getElementById(id)

.oninput =
calculateTotal;



});



}







/* =====================================================
   打开规则编辑
===================================================== */


function openRule(
productId,
productName
){


selectedProductId =
productId;



document

.getElementById(
"ruleEditor"
)

.classList

.remove(
"hidden"
);



document

.getElementById(
"ruleTitle"
)

.innerHTML =

"设置服务项目：" +
escapeHtml(
productName
);




[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

]

.forEach(id=>{


document

.getElementById(id)

.value=0;



});



calculateTotal();



window.scrollTo({

top:
document.body.scrollHeight,

behavior:"smooth"

});


}







/* =====================================================
   比例计算
===================================================== */


function calculateTotal(){


let total = 2;



[

"cityRatio",

"platformRatio",

"merchantRatio",

"workerRatio",

"advisorRatio"

]

.forEach(id=>{


total += Number(

document

.getElementById(id)

.value || 0

);


});




document

.getElementById(
"totalRatio"
)

.innerText =
total;



}








/* =====================================================
   保存规则
===================================================== */


async function saveRule(){



if(!selectedProductId){


showMessage(
"请选择服务项目"
);

return;

}




const merchantId =

document

.getElementById(
"merchantSelect"
)

.value;




if(!merchantId){


showMessage(
"请选择商户"
);


return;

}





const total =

Number(

document

.getElementById(
"totalRatio"
)

.innerText

);





if(total!==100){


showMessage(
"六方比例必须等于100%"
);


return;


}






/*

二次检查：

防止重复创建

*/


const {

data:exists

}

=

await supabaseClient

.from(
"merchant_product_rules"
)

.select(
"id"
)

.eq(
"merchant_id",
merchantId
)

.eq(
"product_id",
selectedProductId
)

.eq(
"status",
"active"
);







if(
exists &&
exists.length
){


showMessage(

"该项目已经存在有效规则"

);


return;


}







const insertData={



merchant_id:
merchantId,



product_id:
selectedProductId,



rule_type:
"standard",



city_manager_ratio:

Number(
cityRatio.value || 0
),



platform_ratio:

Number(
platformRatio.value || 0
),



store_ratio:

Number(
merchantRatio.value || 0
),



operator_ratio:

Number(
workerRatio.value || 0
),



order_source_ratio:

Number(
advisorRatio.value || 0
),



software_service_ratio:

2,



status:

"active",



version_no:

1,



created_by:

currentSession.user.id


};








const {

error

}

=

await supabaseClient

.from(
"merchant_product_rules"
)

.insert(
insertData
);







if(error){


console.error(error);


showMessage(

"保存失败："+
error.message

);


return;


}





showMessage(

"分账规则保存成功"

);




document

.getElementById(
"ruleEditor"
)

.classList

.add(
"hidden"
);





await loadMerchantProducts();



}







/* =====================================================
   返回
===================================================== */


function goBack(){


location.href=
"wholemanagement.html";


}





/* =====================================================
   退出
===================================================== */


async function logout(){


await supabaseClient.auth.signOut();


location.href=
"page10.html";


}






/* =====================================================
   消息
===================================================== */


function showMessage(msg){



const box =
document.getElementById(
"messageBox"
);



box.innerText =
msg;



box.style.display =
"block";



box.style.position =
"fixed";



box.style.bottom =
"30px";



box.style.left =
"50%";



box.style.transform =
"translateX(-50%)";



box.style.background =
"#2563eb";



box.style.color =
"white";



box.style.padding =
"12px 25px";



box.style.borderRadius =
"8px";




setTimeout(()=>{


box.style.display =
"none";


},3000);


}







/* =====================================================
   HTML安全
===================================================== */


function escapeHtml(value){


if(
value===null ||
value===undefined
){

return "";

}


return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);


}







/* =====================================================
   10分钟退出
===================================================== */


let timer=null;


function resetTimer(){



clearTimeout(timer);



timer=setTimeout(
async()=>{


await supabaseClient.auth.signOut();


alert(
"登录超时，请重新登录"
);


location.href=
"page10.html";



},
10*60*1000
);



}



[

"click",

"mousemove",

"keydown",

"scroll",

"touchstart"

]

.forEach(event=>{


document.addEventListener(

event,

resetTimer,

{
passive:true
}

);


});





</script>


</body>

</html>
