<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>商户分账规则管理</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#fff8fb;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"PingFang SC",
"Microsoft YaHei",
sans-serif;
color:#382a30;
}


header{

height:72px;
background:white;
border-bottom:1px solid #eee;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 30px;

}


.brand{

display:flex;
align-items:center;
gap:12px;

}


.logo{

width:40px;
height:40px;

border-radius:50%;

background:#ff7198;

color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;

}


.brand h1{

margin:0;

font-size:18px;

color:#7b3450;

}


.brand small{

color:#aaa;

font-size:11px;

}


button{

border:0;

border-radius:10px;

padding:10px 18px;

cursor:pointer;

}



.btn-primary{

background:#e64f7c;

color:white;

}


.btn{

background:white;

border:1px solid #eee;

}



main{

max-width:1200px;

margin:25px auto;

padding:0 20px;

}



.banner{

background:
linear-gradient(
110deg,
#fff0f5,
#ffe0ea
);

border-radius:20px;

padding:25px;

margin-bottom:20px;

}



.banner h2{

margin:0 0 10px;

color:#73334d;

}


.banner p{

margin:0;

font-size:13px;

color:#9b6879;

}



.panel{

background:white;

border-radius:16px;

border:1px solid #eee;

margin-bottom:18px;

}



.panel-title{

padding:16px 20px;

font-weight:bold;

border-bottom:1px solid #eee;

color:#713148;

}



.form{

padding:20px;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:15px;

}



label{

display:block;

font-size:12px;

color:#999;

margin-bottom:6px;

}



select,
input{

width:100%;

height:42px;

border:1px solid #ddd;

border-radius:10px;

padding:0 12px;

background:white;

}



.split-box{

padding:20px;

}



.split-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:15px;

}



.split-item{

background:#fff8fa;

border-radius:12px;

padding:15px;

border:1px solid #f3dce4;

}



.split-item input{

background:white;

}



.fixed{

color:#e64f7c;

font-weight:bold;

}



.total{

margin-top:20px;

padding:15px;

background:#fff4f7;

border-radius:12px;

font-weight:bold;

}



.table-wrap{

overflow:auto;

}


table{

width:100%;

border-collapse:collapse;

min-width:1000px;

}


th{

background:#fff8fb;

font-size:12px;

color:#999;

padding:12px;

text-align:left;

}



td{

padding:12px;

border-bottom:1px solid #eee;

font-size:13px;

}



.status{

padding:5px 10px;

border-radius:20px;

font-size:11px;

background:#eaf8f1;

color:#2e9d68;

}



@media(max-width:800px){

.form,
.split-grid{

grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<header>


<div class="brand">

<div class="logo">
♡
</div>

<div>

<h1>
商户分账规则管理
</h1>

<small>
六方分账配置中心
</small>

</div>

</div>


<div>

<button class="btn"
onclick="goBack()">
返回
</button>


<button class="btn-primary"
onclick="logout()">
退出
</button>

</div>


</header>



<main>


<div class="banner">

<h2>
产品级分账规则定义
</h2>

<p>
每个城市、每个商户、每个服务项目独立定义。
软件服务商固定2%，其他分账比例人工配置。
</p>


</div>



<div class="panel">


<div class="panel-title">
选择经营对象
</div>



<div class="form">


<div>

<label>
省份
</label>

<select id="provinceSelect">

<option>
加载中...
</option>

</select>


</div>



<div>

<label>
城市
</label>

<select id="citySelect">

<option>
请选择城市
</option>

</select>


</div>




<div>

<label>
商户
</label>

<select id="merchantSelect">

<option>
请选择商户
</option>

</select>


</div>



<div>

<label>
服务项目
</label>

<select id="productSelect">

<option>
请选择项目
</option>

</select>


</div>



</div>


</div>





<div class="panel">


<div class="panel-title">
六方分账比例
</div>



<div class="split-box">


<div class="split-grid">



<div class="split-item">

<label>
城市负责人
</label>

<input id="cityManagerRatio"
type="number"
value="0">

</div>




<div class="split-item">

<label>
软件服务商
</label>

<input
value="2"
disabled
class="fixed"
id="softwareRatio">

</div>




<div class="split-item">

<label>
运营平台
</label>

<input id="platformRatio"
type="number"
value="0">

</div>




<div class="split-item">

<label>
商户
</label>

<input id="merchantRatio"
type="number"
value="0">

</div>




<div class="split-item">

<label>
服务人员
</label>

<input id="serviceRatio"
type="number"
value="0">

</div>




<div class="split-item">

<label>
健康顾问
</label>

<input id="consultantRatio"
type="number"
value="0">

</div>



</div>



<div class="total">

当前比例合计：
<span id="totalRatio">
2
</span>
%

</div>



<br>


<button
class="btn-primary"
onclick="saveRule()">

保存分账规则

</button>


</div>


</div>





<div class="panel">


<div class="panel-title">

已有分账规则

</div>


<div class="table-wrap">


<table>


<thead>

<tr>

<th>
城市
</th>

<th>
商户
</th>

<th>
项目
</th>

<th>
城市负责人
</th>

<th>
软件服务商
</th>

<th>
运营平台
</th>

<th>
商户
</th>

<th>
服务人员
</th>

<th>
健康顾问
</th>

<th>
状态
</th>

</tr>


</thead>


<tbody id="ruleTable">


</tbody>


</table>


</div>


</div>


</main>
<script>


const SUPABASE_URL =
"你的SUPABASE_URL";


const SUPABASE_ANON_KEY =
"你的SUPABASE_ANON_KEY";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);



let provinces=[];

let cities=[];

let merchants=[];

let products=[];

let rules=[];



let currentUser=null;

let currentProfile=null;



const $=id=>document.getElementById(id);





function goBack(){

location.href="wholemanagement.html";

}



async function logout(){

await supabaseClient.auth.signOut();

location.href="login.html";

}





function toast(msg){

alert(msg);

}






async function init(){



const {

data:{
session

}

}=await supabaseClient.auth.getSession();



if(!session){

location.href="login.html";

return;

}



currentUser=session.user;




const {

data:profile

}=await supabaseClient

.from("profiles")

.select("*")

.eq(
"id",
currentUser.id
)

.single();



if(!profile){

toast("没有权限");

return;

}


currentProfile=profile;



await loadProvinces();

await loadProducts();

await loadRules();



}







async function loadProvinces(){



const {

data

}=await supabaseClient

.from("provinces")

.select("*")

.eq(
"status",
"active"
)

.order("id");



provinces=data||[];



renderProvinces();



}






function renderProvinces(){



let html="";



provinces.forEach(p=>{


html+=`

<option value="${p.id}">

${p.province_name}

</option>

`;


});



$("provinceSelect").innerHTML=html;



// 默认江苏省


const js=

provinces.find(

p=>
p.province_name==="江苏省"

);



if(js){


$("provinceSelect").value=js.id;


loadCities(js.id);


}else if(provinces.length){


loadCities(
provinces[0].id
);


}



}







async function loadCities(provinceId){



const {

data

}=await supabaseClient

.from("cities")

.select("*")

.eq(
"province_id",
provinceId
)

.eq(
"status",
"active"
)

.order("id");



cities=data||[];



let html=`

<option value="">
请选择城市
</option>

`;



cities.forEach(c=>{


html+=`

<option value="${c.id}">

${c.city_name}

</option>

`;


});


$("citySelect").innerHTML=html;



}








async function loadMerchants(cityId){



const {

data

}=await supabaseClient

.from("merchants")

.select("*")

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);



merchants=data||[];



let html=`

<option value="">
请选择商户
</option>

`;



merchants.forEach(m=>{


html+=`

<option value="${m.id}">
${m.merchant_name}
</option>

`;


});


$("merchantSelect").innerHTML=html;



}









async function loadProducts(){



const {

data

}=await supabaseClient

.from("products")

.select("*")

.eq(
"status",
"active"
)

.order("id");



products=data||[];



let html=`

<option value="">
请选择服务项目
</option>

`;



products.forEach(p=>{


html+=`

<option value="${p.id}">

${p.product_name}

</option>

`;


});


$("productSelect").innerHTML=html;



}








async function loadRules(){



const {

data,

error

}=await supabaseClient

.from("merchant_product_rules")

.select(`

*,

cities(
city_name
),

merchants(
merchant_name
),

products(
product_name
)

`)

.order(
"created_at",
{
ascending:false
}
);



if(error){

toast(error.message);

return;

}



rules=data||[];



renderRules();



}









function renderRules(){



let html="";



rules.forEach(r=>{


html+=`

<tr>

<td>
${r.cities?.city_name||""}
</td>


<td>
${r.merchants?.merchant_name||""}
</td>


<td>
${r.products?.product_name||""}
</td>


<td>
${r.city_manager_ratio||0}%
</td>


<td>
${r.software_service_ratio||2}%
</td>


<td>
${r.platform_ratio||0}%
</td>


<td>
${r.merchant_ratio||0}%
</td>


<td>
${r.service_person_ratio||0}%
</td>


<td>
${r.health_consultant_ratio||0}%
</td>


<td>

<span class="status">

${r.status}

</span>

</td>


</tr>

`;


});


$("ruleTable").innerHTML=html;


}








function calcTotal(){



let total=

Number(
$("cityManagerRatio").value||0
)

+

2

+

Number(
$("platformRatio").value||0
)

+

Number(
$("merchantRatio").value||0
)

+

Number(
$("serviceRatio").value||0
)

+

Number(
$("consultantRatio").value||0
);



$("totalRatio").innerText=total;



}



document
.querySelectorAll("input[type=number]")
.forEach(

e=>{

e.addEventListener(
"input",
calcTotal
);

}

);









$("provinceSelect")
.addEventListener(
"change",
e=>{


loadCities(
Number(e.target.value)
);


});







$("citySelect")
.addEventListener(
"change",
e=>{


loadMerchants(
Number(e.target.value)
);


});









async function saveRule(){



const cityId=
Number(
$("citySelect").value
);


const merchantId=
Number(
$("merchantSelect").value
);


const productId=
Number(
$("productSelect").value
);



if(
!cityId||
!merchantId||
!productId
){

toast(
"请选择完整信息"
);

return;

}





const data={


city_id:cityId,


merchant_id:merchantId,


product_id:productId,


city_manager_ratio:
Number(
$("cityManagerRatio").value||0
),


software_service_ratio:2,


platform_ratio:
Number(
$("platformRatio").value||0
),


merchant_ratio:
Number(
$("merchantRatio").value||0
),


service_person_ratio:
Number(
$("serviceRatio").value||0
),


health_consultant_ratio:
Number(
$("consultantRatio").value||0
),


status:"active",


version_no:1,


created_by:
currentUser.id


};





let total=

data.city_manager_ratio

+

data.software_service_ratio

+

data.platform_ratio

+

data.merchant_ratio

+

data.service_person_ratio

+

data.health_consultant_ratio;




if(total!==100){

toast(
"六方比例必须合计100%"
);

return;

}






const {

error

}=await supabaseClient

.from(
"merchant_product_rules"
)

.insert(data);





if(error){

toast(error.message);

return;

}



toast(
"保存成功"
);



await loadRules();



}







init();


</script>


</body>

</html>
