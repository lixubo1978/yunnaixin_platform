<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商户分账规则</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;
}

body{
    margin:0;
    background:#fff7fa;
    color:#5b2333;
}


.header{

    height:70px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    border-bottom:1px solid #f3dce5;

}


.logo{

    font-size:22px;
    font-weight:bold;
    color:#df4f7d;

}


.header button{

    border:none;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;

}


.btn-back{

    background:white;
    border:1px solid #f0b7ca!important;

}


.btn-out{

    background:#df4f7d;
    color:white;

}



.container{

    width:1200px;
    max-width:95%;
    margin:30px auto;

}


.card{

    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;

    box-shadow:
    0 4px 15px rgba(200,100,130,.08);

}


.title-box{

    background:#ffe9f1;

}


.title-box h1{

    margin:0 0 10px;
    font-size:26px;

}


.title-box p{

    color:#9b6678;

}



/* 选择区域 */


.select-row{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

}


.form-group label{

    display:block;
    margin-bottom:8px;

    color:#996274;
    font-size:14px;

}


select,
input{

    width:100%;
    height:42px;

    border:1px solid #efd5df;

    border-radius:10px;

    padding:0 12px;

    background:white;

}


select:focus,
input:focus{

    outline:none;
    border-color:#df4f7d;

}



/* 比例 */


.rule-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

}


.rule-item{

    background:#fff7fa;

    padding:15px;

    border-radius:12px;

}


.rule-item span{

    display:block;

    margin-bottom:8px;

    color:#9b6678;

}


.fixed{

    color:#df4f7d;
    font-weight:bold;

    background:#ffe1eb;

}



/* 合计 */

.total-box{

    margin-top:20px;

    padding:15px;

    background:#fff0f5;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

}



.save-btn{

    margin-top:20px;

    background:#df4f7d;

    color:white;

    border:none;

    padding:12px 30px;

    border-radius:20px;

    cursor:pointer;

}



/* 表格 */

.table-box{

    overflow:auto;

}


table{

    width:100%;

    border-collapse:collapse;

}


th{

    background:#fff1f6;

}


th,td{

    padding:12px;

    border-bottom:1px solid #f5e2e8;

    text-align:center;

    white-space:nowrap;

}



.badge{

    padding:4px 10px;

    border-radius:15px;

    background:#e9fff1;

    color:#26a269;

}



.pending{

    background:#fff3d8;

    color:#d48a00;

}



.create-btn{

    background:#df4f7d;

    color:white;

    border:none;

    padding:7px 15px;

    border-radius:15px;

    cursor:pointer;

}


</style>

</head>


<body>


<div class="header">


<div class="logo">

🌸 六方分账配置中心

</div>


<div>

<button class="btn-back"
onclick="goBack()">

返回工作台

</button>


<button class="btn-out"
onclick="logout()">

退出

</button>

</div>


</div>



<div class="container">



<div class="card title-box">


<h1>
产品级分账规则定义
</h1>


<p>

每个城市、每个商户、每个服务项目独立定义。
软件服务商固定2%，其他比例人工配置。

</p>


</div>




<div class="card">


<h3>
选择经营对象
</h3>


<div class="select-row">



<div class="form-group">

<label>
省份
</label>

<select id="provinceSelect">

<option>
加载中...
</option>

</select>

</div>




<div class="form-group">

<label>
城市
</label>

<select id="citySelect">

<option>
请选择城市
</option>

</select>

</div>




<div class="form-group">

<label>
商户
</label>

<select id="merchantSelect">

<option>
请选择商户
</option>

</select>

</div>



<div class="form-group">

<label>
服务项目
</label>

<select id="productSelect">

<option>
请选择项目
</option>

</select>

</div>



</div>


</div>




<div class="card">


<h3>
六方分账比例
</h3>



<div class="rule-grid">



<div class="rule-item">

<span>
城市负责人 %
</span>

<input id="cityRatio"
type="number"
value="0"
min="0">

</div>



<div class="rule-item">

<span>
软件服务商 %
</span>

<input
class="fixed"
id="softwareRatio"
type="number"
value="2"
readonly>

</div>



<div class="rule-item">

<span>
运营平台 %
</span>

<input id="platformRatio"
type="number"
value="0"
min="0">

</div>




<div class="rule-item">

<span>
商户 %
</span>

<input id="merchantRatio"
type="number"
value="0"
min="0">

</div>




<div class="rule-item">

<span>
服务人员 %
</span>

<input id="workerRatio"
type="number"
value="0"
min="0">

</div>




<div class="rule-item">

<span>
健康顾问 %
</span>

<input id="advisorRatio"
type="number"
value="0"
min="0">

</div>



</div>



<div class="total-box">

当前比例合计：

<span id="totalRatio">
2
</span>
%

</div>



<button class="save-btn"
onclick="saveRule()">

保存分账规则

</button>


</div>
<script>


/* ===============================
   Supabase配置
================================ */


const SUPABASE_URL =
"https://你的项目.supabase.co";


const SUPABASE_KEY =
"你的anon-key";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



let currentUser = null;

let currentRole = null;



/* ===============================
   初始化
================================ */


window.onload = async function(){

    await checkLogin();

    await loadProvinces();

    bindEvents();

};



/* ===============================
   登录权限
================================ */


async function checkLogin(){


    const {
        data:{
            user
        }
    } = await supabaseClient.auth.getUser();



    if(!user){

        location.href="login.html";

        return;

    }



    currentUser=user;



    const {
        data,
        error
    } = await supabaseClient

    .from("profiles")

    .select("*")

    .eq(
        "id",
        user.id
    )

    .single();



    if(error){

        alert(
        "无法读取用户权限"
        );

        return;

    }



    currentRole=data.role;



    window.userProfile=data;



}





/* ===============================
   加载省份
================================ */


async function loadProvinces(){



let query =
supabaseClient

.from("provinces")

.select(
"id,name"
)

.eq(
"status",
"active"
)

.order(
"id"
);



/*
城市管理员只能读取自己的范围
*/

if(
currentRole==="city_manager"
){

    const {
        data
    } =
    await supabaseClient

    .from(
    "admin_assignments"
    )

    .select(
    "province_id"
    )

    .eq(
    "user_id",
    currentUser.id
    );


    if(data && data.length){

        query =
        query.in(
        "id",
        data.map(
        x=>x.province_id
        ));

    }

}




const {
data,
error
}
=
await query;



const select =
document.getElementById(
"provinceSelect"
);



select.innerHTML="";



data.forEach(
item=>{


let op =
document.createElement(
"option"
);


op.value=item.id;

op.textContent=item.name;



select.appendChild(op);



});



/*

默认江苏省

*/

let jiangsu =
data.find(
x=>x.name==="江苏省"
);



if(jiangsu){

select.value=
jiangsu.id;

}



await loadCities();



}




/* ===============================
   加载城市
================================ */


async function loadCities(){



let provinceId =
document.getElementById(
"provinceSelect"
).value;



const select =
document.getElementById(
"citySelect"
);



select.innerHTML=
"<option>加载中...</option>";




let query =
supabaseClient

.from(
"service_areas"
)

.select(
`
city_id,
cities(
id,
name,
province_id
)
`
)

.eq(
"status",
"active"
)

.eq(
"province_id",
provinceId
);



/*
城市管理员限制
*/


if(
currentRole==="city_manager"
){


const {
data
}
=
await supabaseClient

.from(
"admin_assignments"
)

.select(
"city_id"
)

.eq(
"user_id",
currentUser.id
);



if(data && data.length){


query =
query.in(
"city_id",
data.map(
x=>x.city_id
));


}



}





const {
data,
error
}
=
await query;



select.innerHTML=
"<option value=''>请选择城市</option>";



if(!data)
return;



data.forEach(
item=>{


let op=
document.createElement(
"option"
);


op.value=
item.city_id;



op.textContent=
item.cities.name;



select.appendChild(op);



});




await loadMerchants();



}




/* ===============================
 商户
================================ */


async function loadMerchants(){



let cityId =
document.getElementById(
"citySelect"
).value;



const select =
document.getElementById(
"merchantSelect"
);



select.innerHTML=
"<option>请选择商户</option>";



if(!cityId)
return;




const {
data
}
=
await supabaseClient

.from(
"merchants"
)

.select(
"id,
merchant_name"
)

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);



data?.forEach(
m=>{


let op=
document.createElement(
"option"
);


op.value=m.id;

op.textContent=
m.merchant_name;



select.appendChild(op);



});



}




/* ===============================
 项目目录
================================ */


async function loadProducts(){



let cityId =
document.getElementById(
"citySelect"
).value;



const select =
document.getElementById(
"productSelect"
);



select.innerHTML=
"<option>加载中...</option>";



const {
data
}
=
await supabaseClient

.from(
"city_prices"
)

.select(
`
product_id,
products(
id,
product_name
)
`
)

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);



select.innerHTML=
"<option value=''>请选择项目</option>";



data?.forEach(
item=>{


let op=
document.createElement(
"option"
);


op.value=
item.product_id;


op.textContent=
item.products.product_name;


select.appendChild(op);



});



}




   
/* ===============================
   绑定事件
================================ */


function bindEvents(){


document
.getElementById("provinceSelect")
.onchange =
async()=>{

await loadCities();

};



document
.getElementById("citySelect")
.onchange =
async()=>{

await loadMerchants();

await loadProducts();

await loadExistingRules();

};



document
.getElementById("merchantSelect")
.onchange =
async()=>{

await loadExistingRules();

};



document
.getElementById("productSelect")
.onchange =
async()=>{

await loadExistingRules();

};



/*
比例变化自动计算
*/

[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

].forEach(id=>{


document
.getElementById(id)
.oninput=
calculateTotal;


});


}




/* ===============================
   比例计算
================================ */


function calculateTotal(){


let total =
2;


[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

]
.forEach(id=>{


total +=
Number(
document.getElementById(id).value
||0
);


});


document
.getElementById(
"totalRatio"
)
.innerText =
total;



}





/* ===============================
   读取已有分账规则
================================ */


async function loadExistingRules(){


let merchantId =
document.getElementById(
"merchantSelect"
).value;


let productId =
document.getElementById(
"productSelect"
).value;



if(!merchantId || !productId)
return;



const {
data,
error
}
=
await supabaseClient

.from(
"merchant_product_rules"
)

.select(
`
*,
merchants(
merchant_name
),
products(
product_name
)
`
)

.eq(
"merchant_id",
merchantId
)

.eq(
"product_id",
productId
)

.eq(
"status",
"active"
);



if(error)
{

console.log(error);

return;

}



if(
data &&
data.length
){


let rule=data[0];



document
.getElementById(
"cityRatio"
)
.value =
rule.city_manager_ratio ||0;



document
.getElementById(
"platformRatio"
)
.value =
rule.platform_ratio ||0;



document
.getElementById(
"merchantRatio"
)
.value =
rule.store_ratio ||0;



document
.getElementById(
"workerRatio"
)
.value =
rule.operator_ratio ||0;



document
.getElementById(
"advisorRatio"
)
.value =
rule.order_source_ratio ||0;



}


else{


/*
没有定义
恢复默认
*/


[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

]
.forEach(id=>{

document
.getElementById(id)
.value=0;

});


}



calculateTotal();



}





/* ===============================
   保存分账规则
================================ */


async function saveRule(){



let merchantId =
document.getElementById(
"merchantSelect"
).value;



let productId =
document.getElementById(
"productSelect"
).value;



if(
!merchantId ||
!productId
){

alert(
"请选择商户和项目"
);

return;

}




let total =
Number(
document
.getElementById(
"totalRatio"
)
.innerText
);



if(total!==100){


alert(
"六方比例必须等于100%"
);


return;


}




let insertData={



merchant_id:
merchantId,


product_id:
productId,


rule_type:
"standard",



city_manager_ratio:

Number(
cityRatio.value||0
),



platform_ratio:

Number(
platformRatio.value||0
),



store_ratio:

Number(
merchantRatio.value||0
),



operator_ratio:

Number(
workerRatio.value||0
),



order_source_ratio:

Number(
advisorRatio.value||0
),



software_service_ratio:
2,



status:
"active",


version_no:
1,


created_by:
currentUser.id,


created_at:
new Date()

};






/*
先关闭旧规则
*/


await supabaseClient

.from(
"merchant_product_rules"
)

.update({

status:
"inactive"

})

.eq(
"merchant_id",
merchantId
)

.eq(
"product_id",
productId
)

.eq(
"status",
"active"
);






/*
创建新规则
*/


const {
error
}
=
await supabaseClient

.from(
"merchant_product_rules"
)

.insert(
insertData
);



if(error){


alert(
"保存失败:"
+
error.message
);


return;


}



alert(
"分账规则保存成功"
);



await loadExistingRules();



}






/* ===============================
   返回
================================ */


function goBack(){


location.href=
"wholemanagement.html";


}



/* ===============================
   退出
================================ */


async function logout(){


await supabaseClient.auth.signOut();


location.href=
"login.html";


}



</script>


</body>

</html>
