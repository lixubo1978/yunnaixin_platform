<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff3f7">
<title>孕乃馨 - 登录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 26%),radial-gradient(circle at 90% 18%,rgba(255,210,226,.60) 0,rgba(255,210,226,0) 30%),linear-gradient(160deg,#fff8fb 0%,#ffeef4 45%,#fff5f8 100%);color:#46353c;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none}
body::before{width:230px;height:230px;left:-95px;bottom:7%;background:rgba(255,205,222,.28);filter:blur(4px)}
body::after{width:170px;height:170px;right:-65px;top:31%;background:rgba(255,225,235,.55)}
button,input{font:inherit}button{cursor:pointer}
.page{width:100%;max-width:460px;display:flex;flex-direction:column;position:relative;z-index:1;min-height:calc(100dvh - max(18px,env(safe-area-inset-top)) - max(20px,env(safe-area-inset-bottom)) - 32px)}
.brand{text-align:center;padding-top:6vh;padding-bottom:27px}
.brand-main{display:flex;align-items:center;justify-content:center;gap:13px;width:100%}
.brand-logo-image{width:62px;height:62px;flex:0 0 62px;border-radius:20px;object-fit:contain;display:block;background:#fff;border:1px solid rgba(255,185,209,.38);box-shadow:0 10px 30px rgba(205,105,140,.14)}
.brand-title{margin:0;font-size:30px;line-height:1.25;font-weight:750;letter-spacing:3px;color:#5b3b47}
.brand-subtitle{margin-top:11px;font-size:14px;color:#a27687;letter-spacing:2px}
.login-card{width:100%;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(255,249,252,.97));border-radius:28px;padding:9px 18px 23px;box-shadow:0 18px 50px rgba(180,90,120,.12);border:1px solid rgba(255,190,213,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.login-heading{margin:10px 0 24px;padding:14px 10px;text-align:center;border:1px solid rgba(255,195,215,.30);border-radius:17px;background:#fff0f5;color:#b34b71;font-size:16px;font-weight:650}
.form-group{margin-bottom:18px}
.form-label{display:block;margin-bottom:8px;font-size:14px;font-weight:650;color:#6c505b}
.input{width:100%;height:54px;border-radius:15px;border:1px solid #efd7e0;padding:0 15px;background:rgba(255,255,255,.94);font-size:16px;color:#3e3035;outline:none;transition:.18s}
.input:focus{border-color:#efa7c0;box-shadow:0 0 0 4px rgba(239,167,192,.14);background:#fff}
.input::placeholder{color:#c6adb6}
.business-tip{padding:13px 14px;margin-bottom:20px;border-radius:15px;background:linear-gradient(135deg,#fff6f9,#fffafb);border:1px solid #f5dce5;color:#987381;font-size:13px;line-height:1.65}
.business-tip strong{color:#754e5d}
.password-wrap{position:relative}.password-wrap .input{padding-right:72px}
.password-toggle{position:absolute;right:9px;top:7px;height:40px;padding:0 10px;border:0;background:transparent;color:#b06680;font-size:14px}
.primary-button,.home-button,.consultant-apply-button{width:100%;min-height:56px;border-radius:16px;transition:.15s}
.primary-button{margin-top:5px;border:0;background:linear-gradient(135deg,#f48fb1,#e96f9a);color:#fff;font-size:17px;font-weight:700;letter-spacing:1px;box-shadow:0 9px 22px rgba(220,91,137,.24)}
.primary-button:active,.home-button:active,.consultant-apply-button:active{transform:scale(.985)}
.primary-button:disabled{opacity:.55;cursor:not-allowed}
.consultant-apply-button{margin-top:13px;border:1px solid #f3bfd1;background:linear-gradient(135deg,#fff1f6,#ffe5ee);color:#c04f78;font-size:16px;font-weight:700;letter-spacing:.5px;box-shadow:0 5px 15px rgba(219,111,150,.10)}
.consultant-apply-button:active{background:#ffdae7}.flower{display:inline-block;margin-right:6px}
.home-button{margin-top:12px;border:1px solid #efdbe2;background:rgba(255,255,255,.92);color:#745966;font-size:16px;font-weight:650;letter-spacing:1px}
.home-button:active{background:#fff5f8}
.message{display:none;margin:16px 0 0;padding:12px 14px;border-radius:13px;font-size:14px;line-height:1.55}
.message.show{display:block}
.message.error{background:#fff0f3;color:#b4234d;border:1px solid #ffd1dc}
.message.info{background:#fff5f8;color:#765b65;border:1px solid #f5dfe7}
.footer{margin-top:auto;padding:26px 8px 6px;text-align:center;font-size:12px;line-height:1.7;color:#b792a0}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.password-gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));background:rgba(70,40,53,.45)}
.password-gate-card{width:100%;max-width:460px;margin:auto 0;border:1px solid #f3d4e0;border-radius:24px;padding:24px;background:#fffafd;box-shadow:0 18px 55px #50263822}
.password-gate-card h2{margin:0 0 10px;color:#b94e77;font-size:22px}
.password-gate-card>p{margin:0 0 22px;color:#9d7887;font-size:13px;line-height:1.8}
.password-gate-card .message{margin:0 0 14px}
@media(max-width:600px){.brand{padding-top:3.5vh;padding-bottom:22px}.login-card{border-radius:23px;padding-bottom:20px}}
@media(max-width:360px){body{padding-left:10px;padding-right:10px}.login-card{padding-left:14px;padding-right:14px}.brand{padding-top:3vh}.brand-title{font-size:26px}.brand-logo-image{width:52px;height:52px;flex-basis:52px;border-radius:17px}.login-heading{font-size:14px}.consultant-apply-button{font-size:15px}}
@media(min-width:768px){body{align-items:center}.page{min-height:auto}.brand{padding-top:0}.login-card{padding:12px 28px 28px}}
</style>
</head>
<body>
<div class="page">
  <header class="brand">
    <div class="brand-main">
      <img src="./logo.jpeg" class="brand-logo-image" alt="孕乃馨 Logo">
      <h1 class="brand-title">孕乃馨</h1>
    </div>
    <div class="brand-subtitle">专业服务 · 安心生活</div>
  </header>
  <main class="login-card">
    <h2 class="login-heading">管理 / 商户 / 服务人员 / 顾问</h2>
    <section aria-label="账号登录">
      <div class="business-tip">
        商户、技术服务人员和平台管理人员使用登录邮箱，健康顾问使用系统分配的永久ID。系统会自动识别账号角色并进入相应工作页面。
      </div>
      <div class="form-group">
        <label class="form-label" for="businessAccount">邮箱或系统ID</label>
        <input id="businessAccount" class="input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="邮箱或系统ID">
      </div>
      <div class="form-group">
        <label class="form-label" for="businessPassword">登录密码</label>
        <div class="password-wrap">
          <input id="businessPassword" class="input" type="password" autocomplete="current-password" placeholder="请输入登录密码">
          <button id="passwordToggle" class="password-toggle" type="button">显示</button>
        </div>
      </div>
      <button id="businessLoginButton" class="primary-button" type="button">登录</button>
      <button class="consultant-apply-button" type="button" onclick="window.location.href='./health_consultant_application.html'"><span class="flower">🌸</span>申请成为健康顾问</button>
      <button class="home-button" type="button" onclick="window.location.href='./index.html'">返回主页</button>
      <div id="businessMessage" class="message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <footer class="footer">登录即表示您同意平台相关服务条款和隐私政策<br>© 孕乃馨</footer>
</div>
<div id="merchantPasswordGate" class="password-gate" hidden>
  <section class="password-gate-card" role="dialog" aria-modal="true" aria-labelledby="merchantPasswordTitle" aria-describedby="merchantPasswordHelp">
    <h2 id="merchantPasswordTitle">请修改初始密码</h2>
    <p id="merchantPasswordHelp">您本次使用的是初始密码 12345678。设置新密码后即可进入商户工作台，以后使用新密码登录将直接进入。</p>
    <form id="merchantPasswordForm">
      <div class="form-group">
        <label class="form-label" for="merchantNewPassword">新密码</label>
        <input id="merchantNewPassword" class="input" type="password" autocomplete="new-password" placeholder="请输入新密码">
      </div>
      <div class="form-group">
        <label class="form-label" for="merchantConfirmPassword">再次输入新密码</label>
        <input id="merchantConfirmPassword" class="input" type="password" autocomplete="new-password" placeholder="请再次输入新密码">
      </div>
      <div id="merchantPasswordMessage" class="message" role="status" aria-live="polite"></div>
      <button id="merchantPasswordSave" class="primary-button" type="submit">保存并进入工作台</button>
      <button id="merchantPasswordExit" class="home-button" type="button">退出登录</button>
    </form>
  </section>
</div>
<script>
const SUPABASE_URL="https://qbuqjwpkltbjhlfbyjyb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";
const INITIAL_MERCHANT_PASSWORD="12345678";
const PAGE_PLATFORM="./wholemanagement.html", PAGE_MERCHANT="./merchantplatform.html";
const PAGE_HEALTH_CONSULTANT="./healthconsultant.html", PAGE_TECHNICIAN="./technician.html";
const PLATFORM_ROLES=["founder","platform_admin","platform_staff","province_admin","city_admin"];
const businessAccount=document.getElementById("businessAccount");
const businessPassword=document.getElementById("businessPassword");
const businessLoginButton=document.getElementById("businessLoginButton");
const businessMessage=document.getElementById("businessMessage");
const passwordToggle=document.getElementById("passwordToggle");
const merchantPasswordGate=document.getElementById("merchantPasswordGate");
const merchantNewPassword=document.getElementById("merchantNewPassword");
const merchantConfirmPassword=document.getElementById("merchantConfirmPassword");
const merchantPasswordMessage=document.getElementById("merchantPasswordMessage");
const merchantPasswordSave=document.getElementById("merchantPasswordSave");
const merchantPasswordExit=document.getElementById("merchantPasswordExit");
let supabaseClient=null, businessBusy=false;
let merchantPasswordClient=null, merchantPasswordUserId=null, merchantPasswordBusy=false;

function initializeSupabase(){
  try{
    if(typeof window.supabase?.createClient!=="function")return false;
    supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    return true;
  }catch(error){
    console.error("Supabase初始化失败：",error);
    supabaseClient=null;
    return false;
  }
}
function showMessage(element,message,type="info"){
  element.textContent=message;
  element.className="message show "+type;
}
function clearMessage(element){
  element.textContent="";
  element.className="message";
}
function requireSupabase(){
  if(supabaseClient||initializeSupabase())return true;
  showMessage(businessMessage,"登录系统连接失败，请刷新页面重新尝试。","error");
  return false;
}
function normalizeBusinessAccount(value){
  const account=String(value||"").trim().toLowerCase();
  if(/^\d{6,12}$/.test(account))return `${account}@consultant.yunnaixin.internal`;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account)?account:null;
}
function setButtonLoading(button,loading,text){
  button.disabled=loading;
  if(loading)button.innerHTML='<span class="spinner"></span>'+text;
  else button.textContent=text;
}
async function getCurrentIdentity(client=supabaseClient){
  const {data:userData,error:userError}=await client.auth.getUser();
  if(userError)throw userError;
  const user=userData?.user;
  if(!user)throw new Error("无法获取登录用户信息。");
  const {data:profile,error:profileError}=await client.from("profiles")
    .select("id,role,status,full_name,login_email").eq("id",user.id).maybeSingle();
  if(profileError)console.warn("读取profiles失败：",profileError);
  if(profile){
    if(profile.status!=="active")throw new Error("该账号当前已被停用。");
    if(!profile.role)throw new Error("账号尚未配置用户角色，请联系平台管理员。");
    return {role:profile.role,status:profile.status,profile,user};
  }
  const authRole=String(user.app_metadata?.role||user.user_metadata?.account_type||"");
  if(authRole==="health_consultant"||authRole==="service_technician"){
    return {role:authRole,status:"active",profile:null,user,mustChangePassword:user.user_metadata?.must_change_password===true};
  }
  throw new Error("该账号尚未建立平台身份资料，请联系管理员。");
}
function redirectByRole(role){
  if(PLATFORM_ROLES.includes(role)){window.location.replace(PAGE_PLATFORM);return;}
  if(role==="merchant"){window.location.replace(PAGE_MERCHANT);return;}
  if(role==="health_consultant"){window.location.replace(PAGE_HEALTH_CONSULTANT);return;}
  if(role==="service_technician"){window.location.replace(PAGE_TECHNICIAN);return;}
  throw new Error("当前账号角色无法识别。");
}
function getReadableError(error){
  const original=String(error?.message||""), message=original.toLowerCase();
  if(message.includes("invalid login credentials"))return "邮箱、系统ID或密码错误。";
  if(message.includes("email not confirmed"))return "该登录账户尚未完成确认。";
  if(message.includes("rate limit")||message.includes("too many requests"))return "操作过于频繁，请稍后再试。";
  if(message.includes("user_type"))return "登录页面版本过旧，请刷新页面重新登录。";
  return original||"登录失败，请稍后重新尝试。";
}
async function businessLogin(){
  if(businessBusy||merchantPasswordClient)return;
  clearMessage(businessMessage);
  if(!requireSupabase())return;
  const email=normalizeBusinessAccount(businessAccount.value), password=businessPassword.value;
  if(!email){
    showMessage(businessMessage,"请输入正确的邮箱或系统ID。","error");
    businessAccount.focus();
    return;
  }
  if(!password){
    showMessage(businessMessage,"请输入登录密码。","error");
    businessPassword.focus();
    return;
  }
  businessBusy=true;
  setButtonLoading(businessLoginButton,true,"正在验证");
  let client=supabaseClient;
  try{
    if(password===INITIAL_MERCHANT_PASSWORD){
      client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
        auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"ynx-initial-password-login"}
      });
    }
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data?.user||!data?.session)throw new Error("登录失败，请重新尝试。");
    const identity=await getCurrentIdentity(client);
    if(identity.user.id!==data.user.id)throw new Error("登录状态已变化，请重新登录。");
    if(!PLATFORM_ROLES.includes(identity.role)&&!["merchant","health_consultant","service_technician"].includes(identity.role)){
      await client.auth.signOut();
      throw new Error("此入口仅供平台管理人员、商户、技术服务人员及健康顾问使用。");
    }
    businessPassword.value="";
    if(identity.role==="merchant"&&password===INITIAL_MERCHANT_PASSWORD){
      openInitialMerchantPassword(client,identity.user.id);
      return;
    }
    await acceptBusinessSession(client);
    redirectByRole(identity.role);
  }catch(error){
    console.error("账号密码登录失败：",error);
    try{
      const {data}=await client.auth.getSession();
      if(data?.session)await client.auth.signOut();
    }catch(signOutError){console.error(signOutError);}
    showMessage(businessMessage,getReadableError(error),"error");
    setButtonLoading(businessLoginButton,false,"登录");
  }finally{businessBusy=false;}
}
async function autoRedirectExistingSession(){
  if(!supabaseClient||businessBusy||merchantPasswordClient)return;
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error||!data?.session||businessBusy||merchantPasswordClient)return;
    const {role}=await getCurrentIdentity();
    if(businessBusy||merchantPasswordClient||role==="customer")return;
    redirectByRole(role);
  }catch(error){
    if(businessBusy||merchantPasswordClient)return;
    console.error("自动登录检测失败：",error);
    try{await supabaseClient.auth.signOut();}
    catch(signOutError){console.error(signOutError);}
  }
}
async function acceptBusinessSession(client){
  if(client===supabaseClient)return;
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(!data?.session)throw new Error("登录已过期，请重新登录。");
  const result=await supabaseClient.auth.setSession({
    access_token:data.session.access_token,
    refresh_token:data.session.refresh_token
  });
  if(result.error)throw result.error;
  if(!result.data?.session||result.data.session.user?.id!==data.session.user?.id){
    throw new Error("登录状态异常，请重新登录。");
  }
}
function openInitialMerchantPassword(client,userId){
  merchantPasswordClient=client;
  merchantPasswordUserId=userId;
  merchantNewPassword.value=merchantConfirmPassword.value="";
  clearMessage(merchantPasswordMessage);
  document.querySelector(".page").inert=true;
  merchantPasswordGate.hidden=false;
  merchantNewPassword.focus();
}
function closeInitialMerchantPassword(){
  merchantPasswordClient=null;
  merchantPasswordUserId=null;
  merchantNewPassword.value=merchantConfirmPassword.value=businessPassword.value="";
  merchantPasswordGate.hidden=true;
  document.querySelector(".page").inert=false;
  setButtonLoading(businessLoginButton,false,"登录");
  clearMessage(businessMessage);
}
async function saveInitialMerchantPassword(event){
  event.preventDefault();
  if(merchantPasswordBusy||!merchantPasswordClient)return;
  const password=merchantNewPassword.value;
  clearMessage(merchantPasswordMessage);
  if(!password){
    showMessage(merchantPasswordMessage,"请输入新密码。","error");
    merchantNewPassword.focus();
    return;
  }
  if(password===INITIAL_MERCHANT_PASSWORD){
    showMessage(merchantPasswordMessage,"请设置一个不同于初始密码的新密码。","error");
    merchantNewPassword.focus();
    return;
  }
  if(password!==merchantConfirmPassword.value){
    showMessage(merchantPasswordMessage,"两次输入的新密码不一致。","error");
    merchantConfirmPassword.focus();
    return;
  }
  const client=merchantPasswordClient, userId=merchantPasswordUserId;
  merchantPasswordBusy=true;
  merchantPasswordExit.disabled=true;
  setButtonLoading(merchantPasswordSave,true,"正在保存");
  try{
    const identity=await getCurrentIdentity(client);
    if(identity.role!=="merchant"||identity.user.id!==userId){
      throw new Error("登录状态已变化，请退出后重新登录。");
    }
    const {data,error}=await client.auth.updateUser({password});
    if(error)throw error;
    if(data?.user?.id!==userId)throw new Error("密码更新结果无法确认，请重新登录。");
    merchantNewPassword.value=merchantConfirmPassword.value=businessPassword.value="";
    try{
      await acceptBusinessSession(client);
      window.location.replace(PAGE_MERCHANT);
    }catch(sessionError){
      try{await client.auth.signOut({scope:"local"});}
      catch(signOutError){console.error(signOutError);}
      closeInitialMerchantPassword();
      showMessage(businessMessage,"密码已修改，请使用新密码重新登录。","info");
      businessPassword.focus();
    }
  }catch(error){
    showMessage(merchantPasswordMessage,getReadableError(error),"error");
  }finally{
    merchantPasswordBusy=false;
    merchantPasswordExit.disabled=false;
    setButtonLoading(merchantPasswordSave,false,"保存并进入工作台");
  }
}
async function exitInitialMerchantPassword(){
  if(merchantPasswordBusy||!merchantPasswordClient)return;
  merchantPasswordBusy=true;
  merchantPasswordExit.disabled=true;
  try{
    const {error}=await merchantPasswordClient.auth.signOut({scope:"local"});
    if(error)throw error;
    closeInitialMerchantPassword();
    businessAccount.focus();
  }catch(error){
    showMessage(merchantPasswordMessage,getReadableError(error),"error");
  }finally{
    merchantPasswordBusy=false;
    merchantPasswordExit.disabled=false;
  }
}
passwordToggle.onclick=()=>{
  const hidden=businessPassword.type==="password";
  businessPassword.type=hidden?"text":"password";
  passwordToggle.textContent=hidden?"隐藏":"显示";
};
businessLoginButton.onclick=businessLogin;
businessAccount.addEventListener("keydown",event=>{if(event.key==="Enter")businessPassword.focus();});
businessPassword.addEventListener("keydown",event=>{if(event.key==="Enter")businessLogin();});
document.getElementById("merchantPasswordForm").onsubmit=saveInitialMerchantPassword;
merchantPasswordExit.onclick=exitInitialMerchantPassword;
document.addEventListener("keydown",event=>{
  if(merchantPasswordGate.hidden)return;
  if(event.key==="Escape"){event.preventDefault();return;}
  if(event.key!=="Tab")return;
  const items=[...merchantPasswordGate.querySelectorAll("input:not([disabled]),button:not([disabled])")];
  const first=items[0], last=items[items.length-1];
  if(!first)return;
  if(!merchantPasswordGate.contains(document.activeElement)||(event.shiftKey&&document.activeElement===first)){
    event.preventDefault();
    (event.shiftKey?last:first).focus();
  }else if(!event.shiftKey&&document.activeElement===last){
    event.preventDefault();
    first.focus();
  }
});
initializeSupabase();
autoRedirectExistingSession();
</script>
</body>
</html>
