<div class="field">
<label class="label">短信验证码</label>
<div class="otp">

</div>
</div>
<button class="primary" id="verifyLogin" type="button" style="width:100%;margin-top:12px">验证并继续下单</button>

<div class="msg" id="loginMsg">
</div>
</section>
<section class="section" id="merchantSection" hidden>

<div class="list" id="merchantList">
</div>
</section>
<section class="section" id="technicianSection" hidden>

<div class="list" id="technicianList">
</div>
</section>

<button class="source" data-source="health_consultant">健康顾问</button>
