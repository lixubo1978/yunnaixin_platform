<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#fff7fa"
>

<title>投诉处理 - 孕乃馨</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {

  --pink: #e85d8f;
  --pink-dark: #c84374;
  --pink-light: #fff0f5;

  --red: #df263f;
  --red-dark: #b81931;
  --red-light: #fff0f2;

  --green: #23926b;
  --green-light: #eaf8f2;

  --orange: #d88821;
  --orange-light: #fff5e6;

  --blue: #4f7fae;
  --blue-light: #eef5fb;

  --text: #342d31;
  --text-sub: #786d73;
  --text-light: #a0979c;

  --border: #eee2e7;

  --white: #ffffff;

  --shadow:
    0 8px 25px
    rgba(100, 40, 65, .07);

}


html,
body {

  width: 100%;
  min-height: 100%;

}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    #fbf8fa;

  color:
    var(--text);

  min-height:
    100vh;

  min-height:
    100dvh;

}


button,
input,
textarea {

  font: inherit;

}


button {

  cursor: pointer;

}


.hidden {

  display: none !important;

}



/* =========================================================
   顶部
========================================================= */

.topbar {

  position: sticky;

  top: 0;

  z-index: 100;

  min-height: 68px;

  display: grid;

  grid-template-columns:
    52px
    1fr
    52px;

  align-items: center;

  padding:
    max(
      6px,
      env(safe-area-inset-top)
    )
    14px
    6px;

  background:
    rgba(
      255,
      255,
      255,
      .96
    );

  backdrop-filter:
    blur(16px);

  border-bottom:
    1px solid
    var(--border);

}


.back-btn,
.refresh-btn {

  width: 46px;
  height: 46px;

  border: 0;

  border-radius: 14px;

  background:
    #fff5f8;

  color:
    var(--pink-dark);

  font-size: 21px;

  font-weight: 700;

}


.header-center {

  text-align: center;

}


.header-title {

  font-size: 18px;

  font-weight: 800;

}


.header-subtitle {

  margin-top: 2px;

  color:
    var(--text-light);

  font-size: 10px;

}



/* =========================================================
   主体
========================================================= */

.container {

  width: 100%;

  max-width: 1180px;

  margin: 0 auto;

  padding:
    22px
    18px
    50px;

}



/* =========================================================
   报警概览
========================================================= */

.alert-summary {

  position: relative;

  overflow: hidden;

  padding:
    22px;

  border-radius:
    20px;

  background:
    linear-gradient(
      135deg,
      #d51d37,
      #f14358
    );

  color:
    white;

  box-shadow:
    0 10px 30px
    rgba(
      210,
      30,
      55,
      .20
    );

}


.alert-summary::after {

  content: "";

  position: absolute;

  right: -45px;
  top: -60px;

  width: 150px;
  height: 150px;

  border-radius: 50%;

  background:
    rgba(
      255,
      255,
      255,
      .12
    );

}


.alert-summary-title {

  position: relative;

  z-index: 2;

  font-size: 13px;

  opacity: .95;

}


.alert-summary-number {

  position: relative;

  z-index: 2;

  margin-top: 4px;

  font-size: 34px;

  line-height: 1.2;

  font-weight: 900;

}


.alert-summary-number span {

  margin-left: 5px;

  font-size: 13px;

  font-weight: 600;

}


.alert-summary-desc {

  position: relative;

  z-index: 2;

  margin-top: 7px;

  font-size: 12px;

  opacity: .92;

}



/* =========================================================
   统计
========================================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap: 12px;

  margin-top: 14px;

}


.stat-card {

  padding: 16px;

  border:
    1px solid
    var(--border);

  border-radius:
    16px;

  background:
    white;

  box-shadow:
    var(--shadow);

}


.stat-label {

  color:
    var(--text-light);

  font-size: 11px;

}


.stat-value {

  margin-top: 4px;

  font-size: 23px;

  font-weight: 850;

}


.stat-red {

  color:
    var(--red);

}


.stat-orange {

  color:
    var(--orange);

}


.stat-green {

  color:
    var(--green);

}



/* =========================================================
   筛选
========================================================= */

.toolbar {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 12px;

  margin:
    25px
    0
    14px;

}


.toolbar-title {

  font-size: 18px;

  font-weight: 800;

}


.filters {

  display: flex;

  gap: 7px;

  overflow-x: auto;

  scrollbar-width: none;

}


.filters::-webkit-scrollbar {

  display: none;

}


.filter-btn {

  min-height: 42px;

  padding:
    0
    15px;

  border:
    1px solid
    var(--border);

  border-radius:
    12px;

  background:
    white;

  color:
    var(--text-sub);

  font-size: 12px;

  font-weight: 700;

  white-space: nowrap;

}


.filter-btn.active {

  border-color:
    var(--pink);

  background:
    var(--pink);

  color:
    white;

}



/* =========================================================
   投诉卡
========================================================= */

.complaint-card {

  margin-bottom: 14px;

  padding: 18px;

  border:
    1px solid
    var(--border);

  border-radius:
    20px;

  background:
    white;

  box-shadow:
    var(--shadow);

}


.complaint-card.pending {

  border:
    1px solid
    rgba(
      223,
      38,
      63,
      .35
    );

  box-shadow:
    0 8px 28px
    rgba(
      210,
      25,
      50,
      .09
    );

}


.card-head {

  display: flex;

  align-items:
    flex-start;

  justify-content:
    space-between;

  gap: 14px;

  padding-bottom: 13px;

  border-bottom:
    1px solid
    #f4eaee;

}


.head-left {

  min-width: 0;

  flex: 1;

}


.merchant-name {

  font-size: 16px;

  font-weight: 850;

}


.order-no {

  margin-top: 4px;

  color:
    var(--text-light);

  font-size: 11px;

  word-break:
    break-all;

}


.status-badge {

  flex-shrink: 0;

  padding:
    6px
    10px;

  border-radius:
    999px;

  font-size: 11px;

  font-weight: 800;

}


.status-pending {

  color:
    #c21d36;

  background:
    #fff0f2;

}


.status-wait {

  color:
    #b86f11;

  background:
    #fff5e5;

}


.status-resolved {

  color:
    #27825f;

  background:
    #eaf8f2;

}



/* =========================================================
   信息
========================================================= */

.info-grid {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap: 9px;

  margin-top: 14px;

}


.info-item {

  padding:
    11px
    12px;

  border-radius:
    12px;

  background:
    #fcf9fa;

}


.info-label {

  color:
    var(--text-light);

  font-size: 10px;

}


.info-text {

  margin-top: 3px;

  font-size: 12px;

  font-weight: 700;

  word-break:
    break-word;

}



/* =========================================================
   投诉内容
========================================================= */

.complaint-content {

  margin-top: 14px;

  padding:
    14px;

  border-radius:
    14px;

  background:
    #fff7f9;

  border:
    1px solid
    #f4dce4;

}


.content-label {

  margin-bottom: 6px;

  color:
    #a64c69;

  font-size: 11px;

  font-weight: 800;

}


.content-text {

  font-size: 13px;

  line-height: 1.75;

  white-space:
    pre-wrap;

  word-break:
    break-word;

}



/* =========================================================
   双确认状态
========================================================= */

.confirm-status {

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 8px;

  margin-top: 13px;

}


.confirm-box {

  padding:
    11px;

  border-radius:
    12px;

  font-size: 11px;

  line-height: 1.5;

}


.confirmed {

  color:
    #26795b;

  background:
    var(--green-light);

}


.unconfirmed {

  color:
    #b51f37;

  background:
    var(--red-light);

}



/* =========================================================
   操作
========================================================= */

.card-actions {

  display: flex;

  justify-content:
    flex-end;

  gap: 8px;

  margin-top: 14px;

}


.secondary-btn,
.confirm-btn {

  min-height: 46px;

  padding:
    0
    16px;

  border-radius:
    13px;

  font-size: 12px;

  font-weight: 800;

}


.secondary-btn {

  border:
    1px solid
    #efdce3;

  background:
    white;

  color:
    var(--pink-dark);

}


.confirm-btn {

  border: 0;

  background:
    linear-gradient(
      135deg,
      #e02640,
      #c91834
    );

  color:
    white;

}


.confirm-btn:disabled {

  opacity: .5;

  cursor: default;

}



/* =========================================================
   空状态
========================================================= */

.state-box {

  padding:
    50px
    20px;

  border:
    1px solid
    var(--border);

  border-radius:
    20px;

  background:
    white;

  text-align: center;

  box-shadow:
    var(--shadow);

}


.state-icon {

  font-size: 42px;

}


.state-title {

  margin-top: 9px;

  font-size: 16px;

  font-weight: 800;

}


.state-desc {

  margin-top: 7px;

  color:
    var(--text-light);

  font-size: 12px;

}



/* =========================================================
   图片弹窗
========================================================= */

.modal-mask {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 18px;

  background:
    rgba(
      40,
      29,
      34,
      .64
    );

  backdrop-filter:
    blur(6px);

}


.modal {

  width: 100%;

  max-width: 720px;

  max-height: 88vh;

  overflow-y: auto;

  padding: 20px;

  border-radius:
    20px;

  background:
    white;

}


.modal-head {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 10px;

}


.modal-title {

  font-size: 18px;

  font-weight: 850;

}


.close-btn {

  width: 44px;
  height: 44px;

  border: 0;

  border-radius:
    12px;

  background:
    #f7f2f4;

  color:
    #806e76;

  font-size: 23px;

}


.image-grid {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap: 10px;

  margin-top: 15px;

}


.image-item {

  overflow: hidden;

  aspect-ratio:
    1 / 1;

  border-radius:
    13px;

  background:
    #f5f2f3;

}


.image-item img {

  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  cursor: pointer;

}



/* =========================================================
   Toast
========================================================= */

.toast {

  position: fixed;

  left: 50%;
  bottom: 30px;

  z-index: 2000;

  transform:
    translateX(-50%)
    translateY(15px);

  max-width:
    calc(
      100%
      - 40px
    );

  padding:
    11px
    17px;

  border-radius:
    12px;

  background:
    rgba(
      52,
      45,
      49,
      .94
    );

  color:
    white;

  font-size: 12px;

  text-align: center;

  opacity: 0;

  pointer-events: none;

  transition: .22s;

}


.toast.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}



/* =========================================================
   手机
========================================================= */

@media
(max-width: 720px) {

  .container {

    padding:
      14px
      12px
      35px;

  }


  .alert-summary {

    padding: 18px;

  }


  .stats {

    gap: 7px;

  }


  .stat-card {

    padding:
      13px
      10px;

  }


  .stat-value {

    font-size: 19px;

  }


  .toolbar {

    display: block;

  }


  .filters {

    margin-top: 10px;

  }


  .complaint-card {

    padding: 14px;

  }


  .info-grid {

    grid-template-columns:
      1fr
      1fr;

  }


  .confirm-status {

    grid-template-columns:
      1fr;

  }


  .card-actions {

    display: grid;

    grid-template-columns:
      1fr
      1fr;

  }


  .secondary-btn,
  .confirm-btn {

    width: 100%;

  }


  .image-grid {

    grid-template-columns:
      repeat(
        2,
        1fr
      );

  }

}

</style>

</head>


<body>


<header class="topbar">

  <button
    class="back-btn"
    type="button"
    onclick="goBack()"
  >
    ‹
  </button>


  <div class="header-center">

    <div class="header-title">
      投诉处理
    </div>

    <div class="header-subtitle">
      平台客户投诉管理中心
    </div>

  </div>


  <button
    class="refresh-btn"
    type="button"
    onclick="loadComplaints()"
  >
    ↻
  </button>

</header>



<main class="container">


  <section class="alert-summary">

    <div class="alert-summary-title">
      平台待确认投诉
    </div>

    <div class="alert-summary-number">

      <span
        id="pendingNumber"
        style="
          margin-left:0;
          font-size:34px;
        "
      >
        0
      </span>

      <span>
        条
      </span>

    </div>

    <div class="alert-summary-desc">
      平台确认和对应商户确认全部完成后，投诉报警自动结束。
    </div>

  </section>



  <section class="stats">


    <div class="stat-card">

      <div class="stat-label">
        平台待确认
      </div>

      <div
        id="platformPending"
        class="stat-value stat-red"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        等待商户
      </div>

      <div
        id="merchantPending"
        class="stat-value stat-orange"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        已处理完成
      </div>

      <div
        id="resolvedNumber"
        class="stat-value stat-green"
      >
        0
      </div>

    </div>


  </section>



  <section class="toolbar">


    <div class="toolbar-title">
      投诉记录
    </div>


    <div class="filters">


      <button
        class="filter-btn active"
        data-filter="pending"
        onclick="setFilter('pending',this)"
      >
        待我确认
      </button>


      <button
        class="filter-btn"
        data-filter="merchant"
        onclick="setFilter('merchant',this)"
      >
        等待商户
      </button>


      <button
        class="filter-btn"
        data-filter="resolved"
        onclick="setFilter('resolved',this)"
      >
        已完成
      </button>


      <button
        class="filter-btn"
        data-filter="all"
        onclick="setFilter('all',this)"
      >
        全部
      </button>


    </div>

  </section>



  <section id="complaintList">

    <div class="state-box">

      <div class="state-icon">
        ⏳
      </div>

      <div class="state-title">
        正在读取投诉
      </div>

    </div>

  </section>


</main>



<!-- =====================================================
     图片弹窗
====================================================== -->

<div
  id="imageModal"
  class="modal-mask hidden"
  onclick="handleMask(event)"
>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >


    <div class="modal-head">

      <div class="modal-title">
        投诉图片
      </div>

      <button
        class="close-btn"
        type="button"
        onclick="closeImages()"
      >
        ×
      </button>

    </div>


    <div
      id="imageGrid"
      class="image-grid"
    ></div>


  </div>

</div>


<div
  id="toast"
  class="toast"
></div>



<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://qbuqjwpkltbjhlfbyjyb.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const LOGIN_PAGE =
  "login.html";


const COMPLAINT_BUCKET =
  "customer-complaints";


let currentUser = null;

let currentProfile = null;

let allComplaints = [];

let currentFilter =
  "pending";



/* =========================================================
   10分钟无操作退出
========================================================= */

const IDLE_LIMIT =
  10 * 60 * 1000;


let idleTimer;


function resetIdleTimer() {

  clearTimeout(
    idleTimer
  );


  idleTimer =
    setTimeout(
      autoLogout,
      IDLE_LIMIT
    );

}


async function autoLogout() {

  try {

    await sb.auth.signOut();

  }
  catch (error) {

    console.error(error);

  }


  alert(
    "由于10分钟未操作，系统已自动退出。"
  );


  window.location.replace(
    LOGIN_PAGE
  );

}


[
  "mousemove",
  "mousedown",
  "keydown",
  "touchstart",
  "scroll",
  "click"
]
.forEach(eventName => {

  document.addEventListener(
    eventName,
    resetIdleTimer,
    {
      passive: true
    }
  );

});



/* =========================================================
   工具
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const d =
    new Date(value);


  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return "-";

  }


  return d.toLocaleString(
    "zh-CN",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  );

}


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    showToast.timer
  );


  showToast.timer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 2500);

}


function goBack() {

  window.location.href =
    "wholemanagement.html";

}



/* =========================================================
   权限
========================================================= */

function allowedRole(role) {

  return [
    "founder",
    "platform_admin"
  ].includes(role);

}


async function requireLogin() {

  const {
    data: {
      session
    },
    error
  } =
  await sb.auth.getSession();


  if (
    error ||
    !session ||
    !session.user
  ) {

    window.location.replace(
      LOGIN_PAGE
    );

    return false;

  }


  currentUser =
    session.user;


  const {
    data: profile,
    error: profileError
  } =
  await sb
    .from("profiles")
    .select(`
      id,
      full_name,
      role,
      status
    `)
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if (
    profileError ||
    !profile ||
    profile.status !== "active" ||
    !allowedRole(profile.role)
  ) {

    await sb.auth.signOut();


    alert(
      "当前账号没有投诉处理权限。"
    );


    window.location.replace(
      LOGIN_PAGE
    );


    return false;

  }


  currentProfile =
    profile;


  return true;

}



/* =========================================================
   读取投诉
========================================================= */

async function loadComplaints() {

  try {

    const {
      data,
      error
    } =
    await sb.rpc(
      "get_platform_complaints"
    );


    if (error) {
      throw error;
    }


    allComplaints =
      Array.isArray(data)
        ? data
        : [];


    updateStats();

    renderComplaints();

  }
  catch (error) {

    console.error(
      "读取投诉失败：",
      error
    );


    document.getElementById(
      "complaintList"
    ).innerHTML = `

      <div class="state-box">

        <div class="state-icon">
          ⚠️
        </div>

        <div class="state-title">
          投诉读取失败
        </div>

        <div class="state-desc">
          ${escapeHtml(
            error?.message ||
            "请稍后重试"
          )}
        </div>

      </div>

    `;

  }

}



/* =========================================================
   统计
========================================================= */

function updateStats() {

  const platformPending =
    allComplaints.filter(
      item =>
        item.platform_confirmed
        !== true
    ).length;


  const merchantPending =
    allComplaints.filter(
      item =>
        item.platform_confirmed
        === true
        &&
        item.merchant_confirmed
        !== true
    ).length;


  const resolved =
    allComplaints.filter(
      item =>
        item.platform_confirmed
        === true
        &&
        item.merchant_confirmed
        === true
    ).length;


  document.getElementById(
    "pendingNumber"
  ).textContent =
    platformPending;


  document.getElementById(
    "platformPending"
  ).textContent =
    platformPending;


  document.getElementById(
    "merchantPending"
  ).textContent =
    merchantPending;


  document.getElementById(
    "resolvedNumber"
  ).textContent =
    resolved;

}



/* =========================================================
   筛选
========================================================= */

function setFilter(
  filter,
  button
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(item => {

      item.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  renderComplaints();

}


function filteredComplaints() {

  switch (
    currentFilter
  ) {

    case "pending":

      return allComplaints.filter(
        item =>
          item.platform_confirmed
          !== true
      );


    case "merchant":

      return allComplaints.filter(
        item =>
          item.platform_confirmed
          === true
          &&
          item.merchant_confirmed
          !== true
      );


    case "resolved":

      return allComplaints.filter(
        item =>
          item.platform_confirmed
          === true
          &&
          item.merchant_confirmed
          === true
      );


    default:

      return allComplaints;

  }

}



/* =========================================================
   投诉状态
========================================================= */

function complaintStatus(item) {

  if (
    item.platform_confirmed === true
    &&
    item.merchant_confirmed === true
  ) {

    return {
      text:
        "已处理完成",
      cls:
        "status-resolved"
    };

  }


  if (
    item.platform_confirmed === true
  ) {

    return {
      text:
        "等待商户",
      cls:
        "status-wait"
    };

  }


  return {
    text:
      "平台待确认",
    cls:
      "status-pending"
  };

}



/* =========================================================
   渲染
========================================================= */

function renderComplaints() {

  const list =

      "complaintList"
    );


  const rows =
    filteredComplaints();

    rows.length === 0
  ) {

          🌷
        </div>

        <div class="state-title">

        </div>

          当前分类暂无需要处理的客户投诉。
        </div>

      </div>

  }


  list.innerHTML =

      const status =
        complaintStatus(item);


      const pending =
        item.platform_confirmed

        <article
          class="

          "
        >


          <div class="card-head">


            <div class="head-left">

              <div class="merchant-name">
                ${escapeHtml(
                  item.merchant_name ||
                  "商户"
                )}
              </div>

              <div class="order-no">
                订单号：
                ${escapeHtml(
                  item.order_no ||
                  item.order_id ||
                  "-"
                )}
              </div>

            </div>


            <span
              class="
                status-badge

            >
              ${status.text}
            </span>


          </div>



          <div class="info-grid">


            <div class="info-item">

              <div class="info-label">
                投诉编号
              </div>

              <div class="info-text">
                #${escapeHtml(
                  item.complaint_id
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                客户
              </div>

              <div class="info-text">
                ${escapeHtml(
                  item.customer_name ||
                  "-"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                客户编号
              </div>

              <div class="info-text">
                ${escapeHtml(
                  item.customer_no ||
                  "-"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                客户手机
              </div>

              <div class="info-text">
                ${escapeHtml(
                  item.customer_phone ||
                  "-"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                商户编号
              </div>

              <div class="info-text">
                ${escapeHtml(
                  item.merchant_no ||
                  "-"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                投诉时间
              </div>

              <div class="info-text">

                }

                item.merchant_confirmed

                ? `
                  ✓ 商户已确认
                  <br>

/* =========================================================
   平台确认
========================================================= */

async function confirmComplaint(
  complaintId
) {

  const complaint =
    allComplaints.find(
      item =>
        Number(
          item.complaint_id
        )
        ===
        Number(
          complaintId
        )
    );


  if (!complaint) {

    showToast(
      "没有找到该投诉。"
    );

    return;

  }


  if (
    complaint.platform_confirmed
  ) {

    showToast(
      "平台已经确认过该投诉。"
    );

    return;

  }


  const confirmed =
    window.confirm(

      "确认已经收到并处理该客户投诉吗？\n\n" +

      "平台确认后，该投诉仍会保留记录。" +

      (
        complaint.merchant_confirmed

        ? "\n商户已经确认，本次确认后投诉报警将结束。"

        : "\n目前商户尚未确认，投诉将继续等待商户确认。"
      )

    );


  if (!confirmed) {
    return;
  }


  try {


    const {
      data,
      error
    } =
    await sb.rpc(
      "confirm_platform_complaint",
      {
        p_complaint_id:
          Number(
            complaintId
          )
      }
    );


    if (error) {
      throw error;
    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "平台确认失败"
      );

    }


    alert(
      data.message ||
      "平台确认成功"
    );


    await loadComplaints();


  }
  catch (error) {

    console.error(
      "平台确认投诉失败：",
      error
    );


    alert(
      "确认失败：\n\n" +
      (
        error?.message ||
        "未知错误"
      )
    );

  }

}



/* =========================================================
   查看投诉图片
========================================================= */

async function showImages(
  complaintId
) {

  const grid =
    document.getElementById(
      "imageGrid"
    );


  grid.innerHTML = `

    <div
      style="
        grid-column:1/-1;
        padding:30px;
        text-align:center;
        color:#9a9095;
      "
    >
      正在读取图片...
    </div>

  `;


  document.getElementById(
    "imageModal"
  ).classList.remove(
    "hidden"
  );


  document.body.style.overflow =
    "hidden";


  try {


    const {
      data,
      error
    } =
    await sb.rpc(
      "get_platform_complaint_images",
      {
        p_complaint_id:
          Number(
            complaintId
          )
      }
    );


    if (error) {
      throw error;
    }


    const rows =
      Array.isArray(data)
        ? data
        : [];


    if (
      rows.length === 0
    ) {

      grid.innerHTML = `

        <div
          style="
            grid-column:1/-1;
            padding:35px;
            text-align:center;
            color:#9a9095;
          "
        >
          该投诉没有上传图片
        </div>

      `;


      return;

    }


    const imageResults =
      [];


    for (
      const row of rows
    ) {


      const {
        data: signedData,
        error: signedError
      } =
      await sb.storage

        .from(
          COMPLAINT_BUCKET
        )

        .createSignedUrl(
          row.storage_path,
          600
        );


      if (
        !signedError &&
        signedData?.signedUrl
      ) {

        imageResults.push({
          path:
            row.storage_path,
          url:
            signedData.signedUrl
        });

      }

    }


    if (
      imageResults.length === 0
    ) {

      throw new Error(
        "图片存在，但暂时无法取得查看权限。"
      );

    }


    grid.innerHTML =
      imageResults.map(
        image => `

          <div class="image-item">

            <img
              src="${escapeHtml(
                image.url
              )}"
              alt="投诉图片"
              onclick="
                window.open(
                  '${escapeHtml(
                    image.url
                  )}',
                  '_blank'
                )
              "
            >

          </div>

        `
      ).join("");


  }
  catch (error) {

    console.error(
      "读取投诉图片失败：",
      error
    );


    grid.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          padding:35px;
          text-align:center;
          color:#c12a43;
        "
      >

        图片读取失败
        <br>

        <span
          style="
            font-size:11px;
            color:#9a9095;
          "
        >
          ${escapeHtml(
            error?.message ||
            ""
          )}
        </span>

      </div>

    `;

  }

}



/* =========================================================
   关闭图片
========================================================= */

function closeImages() {

  document.getElementById(
    "imageModal"
  ).classList.add(
    "hidden"
  );


  document.body.style.overflow =
    "";

}


function handleMask(event) {

  if (
    event.target.id ===
    "imageModal"
  ) {

    closeImages();

  }

}



/* =========================================================
   初始化
========================================================= */

async function initialize() {

  resetIdleTimer();


  const ok =
    await requireLogin();


  if (!ok) {
    return;
  }


  await loadComplaints();

}



/* =========================================================
   Auth
========================================================= */

sb.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    if (
      event === "SIGNED_OUT"
      ||
      !session
    ) {

      window.location.replace(
        LOGIN_PAGE
      );

    }

  }
);



/* =========================================================
   启动
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


</script>
