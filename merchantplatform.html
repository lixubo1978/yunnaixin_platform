<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>商户工作台 - 孕乃馨</title>


    <!-- =======================================================
         Supabase
    ======================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =====================================================
           基础
        ====================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background: #fff7fa;

            color: #43363c;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "PingFang SC",
                "Microsoft YaHei",
                Arial,
                sans-serif;
        }


        body {
            padding-bottom:
                calc(88px + env(safe-area-inset-bottom));
        }


        button,
        input,
        select,
        textarea {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        .hidden {
            display: none !important;
        }


        .app {
            width: 100%;

            max-width: 560px;

            min-height: 100vh;

            margin: 0 auto;

            background:
                linear-gradient(
                    180deg,
                    #ffe8f1 0px,
                    #fff7fa 290px,
                    #fff7fa 100%
                );
        }


        /* =====================================================
           顶部
        ====================================================== */

        .safe-top {
            height:
                env(safe-area-inset-top);
        }


        .topbar {
            min-height: 62px;

            padding:
                9px 17px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }


        .logo {
            width: 43px;

            height: 43px;

            flex-shrink: 0;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #ff6899,
                    #ff91b2
                );

            color: white;

            font-size: 23px;

            box-shadow:
                0 7px 21px
                rgba(244, 92, 140, .22);
        }


        .brand-text {
            min-width: 0;
        }


        .brand-title {
            font-size: 18px;

            line-height: 1.2;

            font-weight: 900;

            color: #573846;
        }


        .brand-subtitle {
            margin-top: 3px;

            font-size: 11px;

            color: #a37888;
        }


        .logout-btn {
            min-height: 40px;

            padding:
                8px 12px;

            border: none;

            border-radius: 14px;

            background:
                rgba(255,255,255,.78);

            color: #a15d76;

            font-size: 13px;

            font-weight: 800;

            box-shadow:
                0 4px 15px
                rgba(85, 50, 65, .06);
        }


        /* =====================================================
           商户主卡
        ====================================================== */

        .merchant-hero {
            margin:
                7px 16px 0;

            padding:
                21px 19px;

            border-radius: 26px;

            position: relative;

            overflow: hidden;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #f96193 0%,
                    #ff83aa 52%,
                    #ffa0bb 100%
                );

            box-shadow:
                0 13px 34px
                rgba(230, 83, 130, .23);
        }


        .merchant-hero::before {
            content: "";

            position: absolute;

            width: 160px;

            height: 160px;

            border-radius: 50%;

            right: -70px;

            top: -78px;

            background:
                rgba(255,255,255,.14);
        }


        .merchant-hero::after {
            content: "";

            position: absolute;

            width: 100px;

            height: 100px;

            border-radius: 50%;

            right: 35px;

            bottom: -68px;

            background:
                rgba(255,255,255,.09);
        }


        .hero-label {
            position: relative;

            z-index: 1;

            font-size: 12px;

            opacity: .88;
        }


        .hero-name {
            position: relative;

            z-index: 1;

            margin-top: 5px;

            font-size: 24px;

            line-height: 1.35;

            font-weight: 900;

            word-break: break-word;
        }


        .hero-meta {
            position: relative;

            z-index: 1;

            margin-top: 10px;

            display: flex;

            flex-wrap: wrap;

            gap: 7px;
        }


        .hero-tag {
            min-height: 29px;

            padding:
                5px 10px;

            border-radius: 10px;

            display: inline-flex;

            align-items: center;

            background:
                rgba(255,255,255,.17);

            font-size: 11px;

            font-weight: 800;
        }


        .hero-desc {
            position: relative;

            z-index: 1;

            margin-top: 14px;

            max-width: 90%;

            font-size: 11px;

            line-height: 1.7;

            opacity: .92;
        }


        /* =====================================================
           核销主按钮
        ====================================================== */

        .verify-wrap {
            margin:
                17px 16px 0;
        }


        .verify-main-btn {
            width: 100%;

            min-height: 72px;

            padding:
                12px 16px;

            border: none;

            border-radius: 23px;

            background: white;

            box-shadow:
                0 9px 29px
                rgba(93, 56, 72, .10);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;
        }


        .verify-main-left {
            display: flex;

            align-items: center;

            gap: 13px;

            min-width: 0;
        }


        .verify-main-icon {
            width: 49px;

            height: 49px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #ffedf4,
                    #ffe2ec
                );

            font-size: 25px;
        }


        .verify-main-text {
            text-align: left;
        }


        .verify-main-title {
            font-size: 18px;

            font-weight: 900;

            color: #583946;
        }


        .verify-main-desc {
            margin-top: 4px;

            font-size: 11px;

            line-height: 1.5;

            color: #9e7a88;
        }


        .verify-main-arrow {
            width: 36px;

            height: 36px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffedf4;

            color: #dd5b88;

            font-size: 21px;
        }


        /* =====================================================
           Section
        ====================================================== */

        .section {
            margin:
                22px 16px 0;
        }


        .section-head {
            margin-bottom: 11px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .section-title {
            font-size: 17px;

            font-weight: 900;

            color: #503640;
        }


        .section-link {
            min-height: 38px;

            padding:
                6px 3px;

            border: none;

            background: transparent;

            color: #d96188;

            font-size: 12px;

            font-weight: 800;
        }


        /* =====================================================
           统计
        ====================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;
        }


        .stat-card {
            min-height: 99px;

            padding:
                14px 5px 10px;

            border: none;

            border-radius: 18px;

            background: white;

            text-align: center;

            box-shadow:
                0 6px 20px
                rgba(90, 55, 70, .065);
        }


        .stat-icon {
            min-height: 24px;

            font-size: 20px;
        }


        .stat-value {
            margin-top: 7px;

            font-size: 21px;

            line-height: 1;

            font-weight: 900;

            color: #e35788;
        }


        .stat-label {
            margin-top: 7px;

            font-size: 10px;

            line-height: 1.3;

            color: #a17c89;

            font-weight: 700;
        }


        /* =====================================================
           快捷功能
        ====================================================== */

        .tools-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }


        .tool-card {
            min-height: 95px;

            padding:
                14px;

            border: none;

            border-radius: 20px;

            background: white;

            box-shadow:
                0 7px 23px
                rgba(90, 55, 70, .065);

            text-align: left;
        }


        .tool-icon {
            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background: #fff0f5;

            font-size: 20px;
        }


        .tool-title {
            margin-top: 10px;

            font-size: 14px;

            font-weight: 900;

            color: #583b46;
        }


        .tool-desc {
            margin-top: 4px;

            font-size: 10px;

            line-height: 1.5;

            color: #a17e8b;
        }


        /* =====================================================
           订单
        ====================================================== */

        .orders-list {
            display: flex;

            flex-direction: column;

            gap: 11px;
        }


        .order-card {
            padding:
                15px;

            border-radius: 21px;

            background: white;

            box-shadow:
                0 7px 23px
                rgba(86, 53, 66, .065);
        }


        .order-top {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 10px;
        }


        .order-main {
            min-width: 0;
        }


        .order-product {
            font-size: 15px;

            line-height: 1.4;

            font-weight: 900;

            color: #533743;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .order-no {
            margin-top: 4px;

            font-size: 10px;

            color: #ae8a97;

            word-break: break-all;
        }


        .badge {
            flex-shrink: 0;

            min-height: 27px;

            padding:
                5px 9px;

            border-radius: 999px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 10px;

            font-weight: 900;
        }


        .badge-wait {
            background: #eaf9f2;

            color: #27845d;
        }


        .badge-processing {
            background: #edf4ff;

            color: #4b75af;
        }


        .badge-completed {
            background: #fff0f6;

            color: #c05880;
        }


        .badge-unpaid {
            background: #fff4df;

            color: #bd7719;
        }


        .badge-cancelled {
            background: #f2f2f2;

            color: #858585;
        }


        .order-divider {
            height: 1px;

            margin:
                12px 0;

            background: #f5e9ee;
        }


        .order-row {
            margin-top: 7px;

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 12px;

            font-size: 11px;

            line-height: 1.5;
        }


        .order-label {
            flex-shrink: 0;

            color: #a17f8b;
        }


        .order-value {
            color: #624550;

            font-weight: 700;

            text-align: right;

            word-break: break-word;
        }


        .usage-box {
            margin-top: 12px;

            padding:
                11px 12px;

            border-radius: 14px;

            background: #fff7fa;
        }


        .usage-head {
            display: flex;

            justify-content: space-between;

            gap: 10px;

            font-size: 11px;
        }


        .usage-label {
            color: #775a65;

            font-weight: 700;
        }


        .usage-value {
            color: #e45788;

            font-weight: 900;
        }


        .progress {
            height: 7px;

            margin-top: 8px;

            overflow: hidden;

            border-radius: 99px;

            background: #f2dce5;
        }


        .progress-bar {
            height: 100%;

            width: 0;

            border-radius: 99px;

            background:
                linear-gradient(
                    90deg,
                    #ff719d,
                    #ff98b6
                );
        }


        .order-actions {
            margin-top: 13px;

            display: flex;

            gap: 8px;
        }


        .order-btn {
            min-height: 41px;

            padding:
                8px 11px;

            flex: 1;

            border: none;

            border-radius: 13px;

            font-size: 11px;

            font-weight: 900;
        }


        .order-btn-light {
            background: #fff0f5;

            color: #d95a85;
        }


        .order-btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #ff719d,
                    #f55f90
                );

            color: white;
        }


        /* =====================================================
           核销记录
        ====================================================== */

        .verification-list {
            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .verification-item {
            padding:
                13px 14px;

            border-radius: 17px;

            background: white;

            box-shadow:
                0 5px 18px
                rgba(85, 52, 65, .055);
        }


        .verification-top {
            display: flex;

            justify-content: space-between;

            gap: 10px;
        }


        .verification-order {
            font-size: 12px;

            font-weight: 900;

            color: #57404a;
        }


        .verification-success {
            flex-shrink: 0;

            color: #2c8a61;

            font-size: 10px;

            font-weight: 900;
        }


        .verification-bottom {
            margin-top: 7px;

            display: flex;

            justify-content: space-between;

            gap: 10px;

            color: #a07f8b;

            font-size: 10px;
        }


        /* =====================================================
           商户资料
        ====================================================== */

        .info-card {
            padding:
                16px;

            border-radius: 21px;

            background: white;

            box-shadow:
                0 7px 22px
                rgba(88, 54, 67, .06);
        }


        .info-row {
            min-height: 39px;

            padding:
                8px 0;

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

            border-bottom:
                1px solid #f6eaf0;
        }


        .info-row:last-child {
            border-bottom: none;
        }


        .info-label {
            flex-shrink: 0;

            font-size: 11px;

            color: #a17f8b;
        }


        .info-value {
            max-width: 68%;

            font-size: 11px;

            line-height: 1.55;

            text-align: right;

            color: #614650;

            font-weight: 700;

            word-break: break-word;
        }


        /* =====================================================
           暂未开放
        ====================================================== */

        .coming-card {
            padding:
                15px;

            border-radius: 18px;

            display: flex;

            gap: 11px;

            align-items: flex-start;

            background: #fff;

            box-shadow:
                0 6px 19px
                rgba(88,53,67,.05);
        }


        .coming-icon {
            width: 36px;

            height: 36px;

            flex-shrink: 0;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fff2f6;
        }


        .coming-title {
            font-size: 13px;

            font-weight: 900;

            color: #60414c;
        }


        .coming-text {
            margin-top: 4px;

            font-size: 10px;

            line-height: 1.6;

            color: #9e7c88;
        }


        /* =====================================================
           空状态
        ====================================================== */

        .empty {
            padding:
                25px 15px;

            border-radius: 20px;

            text-align: center;

            background: white;

            box-shadow:
                0 6px 20px
                rgba(84,51,64,.05);
        }


        .empty-icon {
            font-size: 35px;
        }


        .empty-title {
            margin-top: 8px;

            font-size: 14px;

            font-weight: 900;

            color: #644550;
        }


        .empty-text {
            margin-top: 5px;

            font-size: 10px;

            line-height: 1.6;

            color: #a1828e;
        }


        /* =====================================================
           底部导航
        ====================================================== */

        .bottom-nav {
            position: fixed;

            left: 50%;

            bottom: 0;

            z-index: 100;

            width: 100%;

            max-width: 560px;

            min-height: 72px;

            transform:
                translateX(-50%);

            padding:
                7px 14px
                calc(7px + env(safe-area-inset-bottom));

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            background:
                rgba(255,255,255,.97);

            border-top:
                1px solid #f2e1e8;

            backdrop-filter:
                blur(17px);
        }


        .nav-btn {
            min-height: 55px;

            border: none;

            background: transparent;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            color: #ab8996;

            font-size: 9px;

            font-weight: 800;
        }


        .nav-btn.active {
            color: #ed608d;
        }


        .nav-icon {
            font-size: 21px;

            line-height: 1;
        }


        /* =====================================================
           Modal
        ====================================================== */

        .modal-mask {
            position: fixed;

            inset: 0;

            z-index: 1000;

            padding:
                20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(52, 37, 44, .56);

            backdrop-filter:
                blur(6px);
        }


        .modal {
            width: 100%;

            max-width: 390px;

            max-height: 88vh;

            overflow-y: auto;

            padding:
                21px 18px;

            border-radius: 26px;

            background: white;

            box-shadow:
                0 20px 55px
                rgba(35,20,27,.24);
        }


        .modal-title {
            font-size: 18px;

            font-weight: 900;

            color: #543b45;

            text-align: center;
        }


        .modal-order {
            margin-top: 6px;

            text-align: center;

            font-size: 10px;

            color: #aa8895;
        }


        .modal-info {
            margin-top: 16px;
        }


        .modal-row {
            padding:
                9px 0;

            display: flex;

            justify-content: space-between;

            gap: 13px;

            border-bottom:
                1px solid #f5e9ee;

            font-size: 11px;
        }


        .modal-row:last-child {
            border-bottom: none;
        }


        .modal-label {
            color: #a17f8c;
        }


        .modal-value {
            max-width: 68%;

            text-align: right;

            color: #5f444f;

            font-weight: 800;

            word-break: break-word;
        }


        .modal-close {
            width: 100%;

            min-height: 47px;

            margin-top: 16px;

            border: none;

            border-radius: 14px;

            background: #ffedf4;

            color: #d85984;

            font-weight: 900;
        }


        /* =====================================================
           Toast
        ====================================================== */

        .toast {
            position: fixed;

            left: 50%;

            bottom:
                calc(95px + env(safe-area-inset-bottom));

            z-index: 9999;

            max-width:
                calc(100vw - 48px);

            padding:
                11px 15px;

            border-radius: 13px;

            background:
                rgba(62,48,54,.94);

            color: white;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;

            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, 18px);

            transition:
                .2s ease;
        }


        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* =====================================================
           Loading
        ====================================================== */

        .loading-mask {
            position: fixed;

            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fff7fa;
        }


        .loading-inner {
            text-align: center;
        }


        .loading-icon {
            font-size: 43px;

            animation:
                loadingPulse 1s
                infinite ease-in-out;
        }


        .loading-text {
            margin-top: 10px;

            font-size: 12px;

            color: #a17686;
        }


        @keyframes loadingPulse {

            0%,
            100% {
                transform:
                    scale(1);
            }

            50% {
                transform:
                    scale(1.12);
            }
        }


        @media (max-width: 390px) {

            .stats-grid {
                gap: 6px;
            }


            .stat-card {
                padding-left: 3px;

                padding-right: 3px;
            }


            .stat-value {
                font-size: 19px;
            }


            .stat-label {
                font-size: 9px;
            }
        }


        @media (min-width: 600px) {

            body {
                background: #f6f0f3;
            }


            .app {
                box-shadow:
                    0 0 36px
                    rgba(80, 45, 60, .08);
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     Loading
========================================================= -->

<div
    id="loadingMask"
    class="loading-mask"
>

    <div class="loading-inner">

        <div class="loading-icon">
            🌸
        </div>

        <div class="loading-text">
            正在进入商户工作台...
        </div>

    </div>

</div>



<div class="app">


    <div class="safe-top"></div>


    <!-- =====================================================
         顶部
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                ♡
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    孕乃馨
                </div>

                <div class="brand-subtitle">
                    商户工作台
                </div>

            </div>

        </div>


        <button
            class="logout-btn"
            type="button"
            onclick="logout()"
        >
            退出
        </button>

    </header>



    <!-- =====================================================
         商户信息
    ====================================================== -->

    <section class="merchant-hero">

        <div class="hero-label">
            当前登录商户
        </div>

        <div
            id="merchantName"
            class="hero-name"
        >
            商户
        </div>


        <div class="hero-meta">

            <div
                id="merchantNo"
                class="hero-tag"
            >
                商户编号：--
            </div>

            <div
                id="listingStatus"
                class="hero-tag"
            >
                状态：正常
            </div>

        </div>


        <div class="hero-desc">
            客户支付成功后，到店出示消费二维码。
            商户每核销一次，系统自动扣减一次服务次数。
        </div>

    </section>



    <!-- =====================================================
         扫码核销

<script>

    /* =========================================================
       Supabase
    ========================================================= */

    const SUPABASE_URL =
        "https://qbuqjwpkltbjhlfbyjyb.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";


    const sb =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =========================================================
       全局
    ========================================================= */

    let currentUser =
        null;


    let currentMerchant =
        null;


    let currentOrders =
        [];


    let currentOrderItems =
        [];


    let currentVerifications =
        [];


    let currentOrderFilter =
        "all";


    const IDLE_LIMIT =
        10 * 60 * 1000;


    let idleTimer =
        null;



    /* =========================================================
       初始化
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        init
    );


    async function init() {

        try {

            setupIdleLogout();


            /* ===============================================
               Session
            ================================================ */

            const {
                data: sessionData,
                error: sessionError
            } =
                await sb.auth.getSession();


            if (
                sessionError
                ||
                !sessionData?.session?.user
            ) {

                goLogin();

                return;
            }


            currentUser =
                sessionData.session.user;


            /* ===============================================
               商户身份
            ================================================ */

            const merchantOK =
                await loadMerchant();


            if (!merchantOK) {

                await rejectAccess();

                return;
            }


            renderMerchant();


            /* ===============================================
               数据
            ================================================ */

            await loadOrders();

            await loadVerifications();


            renderStats();

            renderOrders();

            renderVerifications();


            hideLoading();


        } catch (error) {

            console.error(
                "merchant platform init:",
                error
            );


            hideLoading();


            toast(
                error?.message
                ||
                "商户工作台加载失败"
            );
        }
    }



    /* =========================================================
       商户身份
    ========================================================= */

    async function loadMerchant() {

        /*
         * 商户实际登录关系：
         *
         * merchants.auth_user_id
         *      =
         * auth.uid()
         *
         * merchants.id
         * 是商户业务UUID，
         * 不能直接拿来和auth.uid比较。
         */

        const {
            data,
            error
        } =
            await sb
                .from("merchants")
                .select("*")
                .eq(
                    "auth_user_id",
                    currentUser.id
                )
                .eq(
                    "status",
                    "active"
                )
                .maybeSingle();


        if (error) {

            console.error(
                "load merchant:",
                error
            );

            return false;
        }


        if (!data) {

            return false;
        }


        currentMerchant =
            data;


        return true;
    }



    async function rejectAccess() {

        hideLoading();


        alert(
            "当前账号不是有效商户账号，无法进入商户工作台。"
        );


        try {

            await sb.auth.signOut();

        } catch (error) {

            console.error(error);
        }


        goLogin();
    }



    /* =========================================================
       显示商户
    ========================================================= */

    function renderMerchant() {

        const name =
            currentMerchant.merchant_name
            ||
            "商户";


        const no =
            firstNotEmpty(
                currentMerchant.record_no,
                currentMerchant.merchant_code,
                "--"
            );


        const status =
            merchantStatusText(
                currentMerchant.status
            );


        const listing =
            listingStatusText(
                currentMerchant.listing_status
            );


        setText(
            "merchantName",
            name
        );


        setText(
            "merchantNo",
            `商户编号：${no}`
        );


        setText(
            "listingStatus",
            `上线状态：${listing}`
        );


        setText(
            "profileMerchantName",
            name
        );


        setText(
            "profileMerchantNo",
            no
        );


        setText(
            "profileAddress",
            currentMerchant.address
            ||
            "暂未填写"
        );


        setText(
            "profileStatus",
            status
        );


        setText(
            "profileListingStatus",
            listing
        );
    }



    /* =========================================================
       订单
    ========================================================= */

    async function loadOrders() {

        const {
            data,
            error
        } =
            await sb
                .from("orders")
                .select("*")
                .eq(
                    "merchant_id",
                    currentMerchant.id
                )
                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                )
                .limit(
                    200
                );


        if (error) {

            console.error(
                "load merchant orders:",
                error
            );


            currentOrders =
                [];


            return;
        }


        currentOrders =
            data
            ||
            [];


        await loadOrderItems();
    }



    async function loadOrderItems() {

        const orderIds =
            currentOrders
                .map(
                    order =>
                        order.id
                )
                .filter(
                    value =>
                        value !== null
                        &&
                        value !== undefined
                );


        if (
            !orderIds.length
        ) {

            currentOrderItems =
                [];

            return;
        }


        const {
            data,
            error
        } =
            await sb
                .from("order_items")
                .select(`
                    id,
                    order_id,
                    product_id,
                    product_code_snapshot,
                    product_name_snapshot,
                    product_type,
                    quantity,
                    unit_price,
                    amount,
                    discounted_amount
                `)
                .in(
                    "order_id",
                    orderIds
                );


        if (error) {

            console.error(
                "load merchant order items:",
                error
            );


            currentOrderItems =
                [];

            return;
        }


        currentOrderItems =
            data
            ||
            [];
    }



    /* =========================================================
       核销记录
    ========================================================= */

    async function loadVerifications() {

        const {
            data,
            error
        } =
            await sb
                .from(
                    "order_verifications"
                )
                .select("*")
                .eq(
                    "merchant_id",
                    currentMerchant.id
                )
                .order(
                    "verified_at",
                    {
                        ascending:
                            false
                    }
                )
                .limit(
                    100
                );


        if (error) {

            console.error(
                "load verifications:",
                error
            );


            currentVerifications =
                [];

            return;
        }


        currentVerifications =
            data
            ||
            [];
    }



    /* =========================================================
       统计
    ========================================================= */

    function renderStats() {

        const today =
            new Date();


        const todayStart =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                today.getDate(),
                0,
                0,
                0,
                0
            );


        const todayVerificationCount =
            currentVerifications.filter(
                item => {

                    const date =
                        new Date(
                            item.verified_at
                        );


                    return (
                        !Number.isNaN(
                            date.getTime()
                        )
                        &&
                        date >=
                        todayStart
                        &&
                        (
                            !item.status
                            ||
                            item.status
                            ===
                            "success"
                        )
                    );
                }
            ).length;


        const waitingCount =
            currentOrders.filter(
                isWaitingOrder
            ).length;


        const processingCount =
            currentOrders.filter(
                isProcessingOrder
            ).length;


        const completedCount =
            currentOrders.filter(
                order =>
                    order.order_status
                    ===
                    "completed"
            ).length;


        setText(
            "todayVerificationCount",
            todayVerificationCount
        );


        setText(
            "waitingCount",
            waitingCount
        );


        setText(
            "processingCount",
            processingCount
        );


        setText(
            "completedCount",
            completedCount
        );
    }



    function isWaitingOrder(
        order
    ) {

        return (
            order.payment_status
            ===
            "paid"

            &&

            Number(
                order.remaining_uses
                ??
                0
            ) > 0

            &&

            ![
                "processing",
                "completed",
                "cancelled",
                "refunded"
            ].includes(
                order.order_status
            )
        );
    }



    function isProcessingOrder(
        order
    ) {

        return (
            order.payment_status
            ===
            "paid"

            &&

            Number(
                order.used_uses
                ??
                0
            ) > 0

            &&

            Number(
                order.remaining_uses
                ??
                0
            ) > 0

            &&

            order.order_status
            !==
            "completed"
        );
    }



    /* =========================================================
       订单筛选
    ========================================================= */

    function showOrderFilter(
        filter
    ) {

        currentOrderFilter =
            filter;


        const titleMap = {

            all:
                "全部服务订单",

            waiting:
                "待服务订单",

            processing:
                "服务中订单",

            completed:
                "已完成订单"

        };


        setText(
            "ordersSectionTitle",
            titleMap[filter]
            ||
            "服务订单"
        );


        renderOrders();


        activateNav(
            "orders"
        );


        document
            .getElementById(
                "ordersSection"
            )
            .scrollIntoView(
                {
                    behavior:
                        "smooth",

                    block:
                        "start"
                }
            );
    }



    function getFilteredOrders() {

        switch (
            currentOrderFilter
        ) {

            case "waiting":

                return currentOrders.filter(
                    isWaitingOrder
                );


            case "processing":

                return currentOrders.filter(
                    isProcessingOrder
                );


            case "completed":

                return currentOrders.filter(
                    order =>
                        order.order_status
                        ===
                        "completed"
                );


            case "all":
            default:

                return currentOrders;
        }
    }



    /* =========================================================
       渲染订单
    ========================================================= */

    function renderOrders() {

        const box =
            document.getElementById(
                "ordersList"
            );


        box.innerHTML =
            "";


        const list =
            getFilteredOrders()
                .slice(
                    0,
                    30
                );


        if (
            !list.length
        ) {

            box.innerHTML =
                `
                <div class="empty">

                    <div class="empty-icon">
                        🌷
                    </div>

                    <div class="empty-title">
                        暂无相关订单
                    </div>

                    <div class="empty-text">
                        客户完成付款后，
                        可服务订单会显示在这里。
                    </div>

                </div>
                `;

            return;
        }


        list.forEach(
            order => {

                box.appendChild(
                    createOrderCard(
                        order
                    )
                );
            }
        );
    }



    function createOrderCard(
        order
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "order-card";


        const item =
            getFirstOrderItem(
                order.id
            );


        const productName =
            item?.product_name_snapshot
            ||
            "服务项目";


        const total =
            Math.max(
                1,
                Number(
                    order.total_uses
                    ??
                    1
                )
            );


        const used =
            Math.max(
                0,
                Number(
                    order.used_uses
                    ??
                    0
                )
            );


        const remaining =
            Math.max(
                0,
                Number(
                    order.remaining_uses
                    ??
                    total - used
                )
            );


        const progress =
            Math.min(
                100,
                Math.max(
                    0,
                    used /
                    total *
                    100
                )
            );


        const state =
            orderStatusInfo(
                order
            );


        const created =
            formatDateTime(
                order.created_at
            );


        const recommendation =
            order.recommendation_source_name_snapshot
            ||
            "平台";


        let actionButton =
            "";


        if (
            order.payment_status
            ===
            "paid"

            &&

            remaining > 0
        ) {

            actionButton =
                `
                <button
                    class="order-btn order-btn-primary"
                    type="button"
                    onclick="goVerify()"
                >
                    扫码核销
                </button>
                `;
        }


        card.innerHTML =
            `

            <div class="order-top">

                <div class="order-main">

                    <div class="order-product">
                        ${escapeHtml(
                            productName
                        )}
                    </div>

                    <div class="order-no">
                        订单号：
                        ${escapeHtml(
                            order.order_no
                            ||
                            order.id
                        )}
                    </div>

                </div>


                <span
                    class="badge ${state.className}"
                >
                    ${escapeHtml(
                        state.text
                    )}
                </span>

            </div>


            <div class="order-divider"></div>


            <div class="order-row">

                <span class="order-label">
                    下单时间
                </span>

                <span class="order-value">
                    ${escapeHtml(
                        created
                    )}
                </span>

            </div>


            <div class="order-row">

                <span class="order-label">
                    支付状态
                </span>

                <span class="order-value">
                    ${escapeHtml(
                        paymentText(
                            order.payment_status
                        )
                    )}
                </span>

            </div>


            <div class="order-row">

                <span class="order-label">
                    推荐来源
                </span>

                <span class="order-value">
                    ${escapeHtml(
                        recommendation
                    )}
                </span>

            </div>


            <div class="order-row">

                <span class="order-label">
                    实付金额
                </span>

                <span class="order-value">
                    ${escapeHtml(
                        formatMoney(
                            firstNumber(
                                order.payment_amount,
                                order.payable_amount,
                                order.total_amount
                            )
                        )
                    )}
                </span>

            </div>


            <div class="usage-box">

                <div class="usage-head">

                    <span class="usage-label">
                        服务进度
                    </span>

                    <span class="usage-value">
                        已使用 ${used} 次 ·
                        剩余 ${remaining} 次
                    </span>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${progress}%"
                    ></div>

                </div>

            </div>


            <div class="order-actions">

                <button
                    class="order-btn order-btn-light"
                    type="button"
                    onclick="showOrderDetail('${safeId(order.id)}')"
                >
                    查看详情
                </button>

                ${actionButton}

            </div>
            `;


        return card;
    }



    /* =========================================================
       核销记录
    ========================================================= */

    function renderVerifications() {

        const box =
            document.getElementById(
                "verificationList"
            );


        box.innerHTML =
            "";


        const list =
            currentVerifications.slice(
                0,
                10
            );


        if (
            !list.length
        ) {

            box.innerHTML =
                `
                <div class="empty">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <div class="empty-title">
                        暂无核销记录
                    </div>

                    <div class="empty-text">
                        商户完成客户消费核销后，
                        记录会显示在这里。
                    </div>

                </div>
                `;

            return;
        }


        list.forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "verification-item";


                const order =
                    currentOrders.find(
                        order =>
                            String(
                                order.id
                            )
                            ===
                            String(
                                item.order_id
                            )
                    );


                const orderNo =
                    order?.order_no
                    ||
                    item.order_id
                    ||
                    "-";


                const sequence =
                    firstNotEmpty(
                        item.verification_no,
                        item.used_uses_after,
                        "-"
                    );


                div.innerHTML =
                    `

                    <div class="verification-top">

                        <div class="verification-order">
                            订单 ${escapeHtml(orderNo)}
                        </div>

                        <div class="verification-success">
                            核销成功
                        </div>

                    </div>


                    <div class="verification-bottom">

                        <span>
                            第 ${escapeHtml(sequence)} 次
                        </span>

                        <span>
                            ${escapeHtml(
                                formatDateTime(
                                    item.verified_at
                                )
                            )}
                        </span>

                    </div>

                    `;


                box.appendChild(
                    div
                );
            }
        );
    }



    /* =========================================================
       订单详情
    ========================================================= */

    function showOrderDetail(
        orderId
    ) {

        const order =
            currentOrders.find(
                item =>
                    String(
                        item.id
                    )
                    ===
                    String(
                        orderId
                    )
            );


        if (!order) {

            toast(
                "没有找到订单"
            );

            return;
        }


        const item =
            getFirstOrderItem(
                order.id
            );


        const info =
            document.getElementById(
                "modalInfo"
            );


        setText(
            "modalOrderNo",
            `订单号：${
                order.order_no
                ||
                order.id
            }`
        );


        info.innerHTML =
            createModalRow(
                "服务项目",
                item?.product_name_snapshot
                ||
                "-"
            )

            +

            createModalRow(
                "服务编号",
                item?.product_code_snapshot
                ||
                "-"
            )

            +

            createModalRow(
                "数量",
                item?.quantity
                ??
                "-"
            )

            +

            createModalRow(
                "支付状态",
                paymentText(
                    order.payment_status
                )
            )

            +

            createModalRow(
                "订单状态",
                orderStatusInfo(
                    order
                ).text
            )

            +

            createModalRow(
                "总服务次数",
                numberOrZero(
                    order.total_uses
                )
            )

            +

            createModalRow(
                "已使用",
                numberOrZero(
                    order.used_uses
                )
            )

            +

            createModalRow(
                "剩余次数",
                numberOrZero(
                    order.remaining_uses
                )
            )

            +

            createModalRow(
                "推荐来源",
                order.recommendation_source_name_snapshot
                ||
                "平台"
            )

            +

            createModalRow(
                "应付金额",
                formatMoney(
                    firstNumber(
                        order.payable_amount,
                        order.total_amount
                    )
                )
            )

            +

            createModalRow(
                "支付时间",
                formatDateTime(
                    order.paid_at
                    ||
                    order.payment_confirmed_at
                )
            )

            +

            createModalRow(
                "下单时间",
                formatDateTime(
                    order.created_at
                )
            );


        document
            .getElementById(
                "orderModalMask"
            )
            .classList
            .remove(
                "hidden"
            );


        document.body.style.overflow =
            "hidden";
    }



    function createModalRow(
        label,
        value
    ) {

        return `
            <div class="modal-row">

                <span class="modal-label">
                    ${escapeHtml(label)}
                </span>

                <span class="modal-value">
                    ${escapeHtml(
                        value
                        ??
                        "-"
                    )}
                </span>

            </div>
        `;
    }



    function closeOrderModal() {

        document
            .getElementById(
                "orderModalMask"
            )
            .classList
            .add(
                "hidden"
            );


        document.body.style.overflow =
            "";
    }



    function handleModalMask(
        event
    ) {

        if (
            event.target.id
            ===
            "orderModalMask"
        ) {

            closeOrderModal();
        }
    }



    /* =========================================================
       Order item
    ========================================================= */

    function getFirstOrderItem(
        orderId
    ) {

        return currentOrderItems.find(
            item =>
                String(
                    item.order_id
                )
                ===
                String(
                    orderId
                )
        )
        ||
        null;
    }



    /* =========================================================
       状态
    ========================================================= */

    function orderStatusInfo(
        order
    ) {

        if (
            order.order_status
            ===
            "completed"
        ) {

            return {

                text:
                    "已完成",

                className:
                    "badge-completed"
            };
        }


        if (
            order.payment_status
            !==
            "paid"
        ) {

            return {

                text:
                    "待付款",

                className:
                    "badge-unpaid"
            };
        }


        if (
            Number(
                order.used_uses
                ??
                0
            ) > 0

            &&

            Number(
                order.remaining_uses
                ??
                0
            ) > 0
        ) {

            return {

                text:
                    "服务中",

                className:
                    "badge-processing"
            };
        }


        if (
            order.order_status
            ===
            "cancelled"

            ||
            order.order_status
            ===
            "refunded"
        ) {

            return {

                text:
                    "已取消",

                className:
                    "badge-cancelled"
            };
        }


        return {

            text:
                "待服务",

            className:
                "badge-wait"
        };
    }



    function paymentText(
        status
    ) {

        const map = {

            unpaid:
                "未支付",

            paid:
                "已支付",

            partially_refunded:
                "部分退款",

            partial_refund:
                "部分退款",

            refunded:
                "已退款"

        };


        return (
            map[status]
            ||
            status
            ||
            "-"
        );
    }



    function merchantStatusText(
        status
    ) {

        if (
            status
            ===
            "active"
        ) {

            return "有效";
        }


        return (
            status
            ||
            "-"
        );
    }



    function listingStatusText(
        status
    ) {

        const map = {

            online:
                "正常上线",

            suspended:
                "暂停上线",

            offline:
                "未上线",

            inactive:
                "无效"

        };


        if (!status) {

            return "正常";
        }


        return (
            map[status]
            ||
            status
        );
    }



    /* =========================================================
       页面导航
    ========================================================= */

    function goVerify() {

        window.location.href =
            "./merchant_verify.html";
    }



    function goHomeSection() {

        currentOrderFilter =
            "all";


        renderOrders();


        activateNav(
            "home"
        );


        window.scrollTo(
            {
                top:
                    0,

                behavior:
                    "smooth"
            }
        );
    }



    function showOrdersSection() {

        currentOrderFilter =
            "all";


        setText(
            "ordersSectionTitle",
            "全部服务订单"
        );


        renderOrders();


        activateNav(
            "orders"
        );


        document
            .getElementById(
                "ordersSection"
            )
            .scrollIntoView(
                {
                    behavior:
                        "smooth",

                    block:
                        "start"
                }
            );
    }



    function showVerificationSection() {

        activateNav(
            "verify"
        );


        scrollToVerifications();
    }



    function scrollToVerifications() {

        document
            .getElementById(
                "verificationSection"
            )
            .scrollIntoView(
                {
                    behavior:
                        "smooth",

                    block:
                        "start"
                }
            );
    }



    function showMerchantSection() {

        activateNav(
            "merchant"
        );


        document
            .getElementById(
                "merchantSection"
            )
            .scrollIntoView(
                {
                    behavior:
                        "smooth",

                    block:
                        "start"
                }
            );
    }



    function activateNav(
        target
    ) {

        [
            "navHome",
            "navOrders",
            "navVerify",
            "navMerchant"
        ].forEach(
            id => {

                document
                    .getElementById(
                        id
                    )
                    .classList
                    .remove(
                        "active"
                    );
            }
        );


        const map = {

            home:
                "navHome",

            orders:
                "navOrders",

            verify:
                "navVerify",

            merchant:
                "navMerchant"

        };


        const id =
            map[target];


        if (
            id
        ) {

            document
                .getElementById(
                    id
                )
                .classList
                .add(
                    "active"
                );
        }
    }



    /* =========================================================
       10分钟无操作退出
    ========================================================= */

    function setupIdleLogout() {

        const events = [

            "click",
            "touchstart",
            "touchmove",
            "keydown",
            "scroll"

        ];


        events.forEach(
            eventName => {

                document.addEventListener(
                    eventName,
                    resetIdleTimer,
                    {
                        passive:
                            true
                    }
                );
            }
        );


        resetIdleTimer();
    }



    function resetIdleTimer() {

        if (
            idleTimer
        ) {

            clearTimeout(
                idleTimer
            );
        }


        idleTimer =
            setTimeout(
                logoutByIdle,
                IDLE_LIMIT
            );
    }



    async function logoutByIdle() {

        try {

            await sb.auth.signOut();

        } catch (error) {

            console.error(
                "自动退出失败：",
                error
            );

        } finally {

            window.location.href =
                "./login.html?reason=idle";
        }
    }



    /* =========================================================
       登出
    ========================================================= */

    async function logout() {

        try {

            await sb.auth.signOut();

        } catch (error) {

            console.error(
                error
            );
        }


        goLogin();
    }



    function goLogin() {

        window.location.replace(
            "./login.html"
        );
    }



    /* =========================================================
       工具
    ========================================================= */

    function setText(
        id,
        value
    ) {

        const el =
            document.getElementById(
                id
            );


        if (!el) {

            return;
        }


        el.textContent =
            (
                value === null
                ||
                value === undefined
                ||
                value === ""
            )
            ?
            "-"
            :
            String(
                value
            );
    }



    function firstNotEmpty(
        ...values
    ) {

        for (
            const value
            of values
        ) {

            if (
                value !== null
                &&
                value !== undefined
                &&
                value !== ""
            ) {

                return value;
            }
        }


        return null;
    }



    function firstNumber(
        ...values
    ) {

        for (
            const value
            of values
        ) {

            if (
                value === null
                ||
                value === undefined
                ||
                value === ""
            ) {

                continue;
            }


            const number =
                Number(
                    value
                );


            if (
                Number.isFinite(
                    number
                )
            ) {

                return number;
            }
        }


        return 0;
    }



    function numberOrZero(
        value
    ) {

        const number =
            Number(
                value
            );


        if (
            !Number.isFinite(
                number
            )
        ) {

            return 0;
        }


        return number;
    }



    function formatMoney(
        value
    ) {

        const number =
            Number(
                value
            );


        if (
            !Number.isFinite(
                number
            )
        ) {

            return "¥0.00";
        }


        return (
            "¥"
            +
            number.toFixed(
                2
            )
        );
    }



    function formatDateTime(
        value
    ) {

        if (!value) {

            return "-";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(
                value
            );
        }


        return date.toLocaleString(
            "zh-CN",
            {
                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false
            }
        );
    }



    function safeId(
        value
    ) {

        return String(
            value
            ??
            ""
        )
        .replace(
            /'/g,
            ""
        );
    }



    function escapeHtml(
        value
    ) {

        return String(
            value
            ??
            ""
        )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
    }



    function toast(
        message
    ) {

        const el =
            document.getElementById(
                "toast"
            );


        el.textContent =
            message;


        el.classList.add(
            "show"
        );


        clearTimeout(
            toast.timer
        );


        toast.timer =
            setTimeout(
                () => {

                    el.classList.remove(
                        "show"
                    );

                },
                2200
            );
    }



    function hideLoading() {

        const mask =
            document.getElementById(
                "loadingMask"
            );


        if (!mask) {

            return;
        }


        mask.style.opacity =
            "0";


        mask.style.transition =
            "opacity .20s ease";


        setTimeout(
            () => {

                mask.style.display =
                    "none";

            },
            220
        );
    }

</script>
