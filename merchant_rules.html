<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商户分账规则 - 孕乃馨平台管理中心</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--pink:#e64f7c;--pink2:#fff0f5;--text:#382a30;--muted:#9b8990;--border:#eee3e7;--bg:#fffafb;--green:#2e9d68;--red:#dc4c64;--orange:#b87920;--shadow:0 8px 28px rgba(111,63,78,.06)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
header{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#ff91ad,#ff668d);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800}
.brand h1{font-size:18px;margin:0;color:#8c3d58}.brand small{display:block;margin-top:3px;color:#aaa;font-size:11px}
.header-actions{display:flex;gap:10px}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 17px;color:#67575d}
.btn-primary{background:var(--pink);border-color:var(--pink);color:#fff}.btn-small{padding:7px 12px;border-radius:8px;font-size:12px}
.btn-disabled{background:#efedef;border-color:#e3dfe1;color:#9d9498;cursor:not-allowed}
main{max-width:1240px;margin:24px auto 70px;padding:0 20px}
.hero{background:linear-gradient(110deg,#fff0f5,#ffdce8);border:1px solid #ffd7e3;border-radius:20px;padding:28px 30px;margin-bottom:18px}
.hero-tag{display:inline-block;background:#fff;color:var(--pink);font-weight:800;font-size:11px;border-radius:20px;padding:6px 10px;margin-bottom:9px}
.hero h2{margin:0 0 10px;font-size:24px;color:#75354c}.hero p{margin:0;color:#9b6578;font-size:13px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:#aaa;margin-bottom:8px}.stat-value{font-size:22px;font-weight:800;color:#713148}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel-head{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:15px}
.panel-title{font-size:15px;font-weight:800;color:#653146}.panel-sub{font-size:11px;color:#aaa;margin-top:4px}
.city-filterbar{padding:14px 14px 0}.city-filter-label{font-size:11px;color:#96868c;margin:0 0 7px 3px}
.filterbar{padding:10px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.control{width:100%;height:43px;border:1px solid var(--border);border-radius:10px;padding:0 13px;background:#fff;color:#4d4045;outline:none}
.control:focus{border-color:#f39bb4;box-shadow:0 0 0 3px rgba(230,79,124,.08)}
.merchant-section{border-bottom:1px solid var(--border)}.merchant-section:last-child{border-bottom:0}
.merchant-head{padding:17px 20px;background:#fffafb;display:flex;align-items:center;justify-content:space-between;gap:15px}
.merchant-name{font-size:15px;font-weight:800;color:#653146}.merchant-meta{margin-top:5px;font-size:11px;color:#a39198}
.merchant-count{white-space:nowrap;background:#fff0f5;color:#b74669;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:700}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}
th{padding:12px 14px;text-align:left;background:#fff;color:#9d8a91;font-size:11px;font-weight:600;border-bottom:1px solid var(--border)}
td{padding:14px;border-bottom:1px solid #f3eaed;font-size:12px;vertical-align:middle}tr:last-child td{border-bottom:0}
.rule-active-row{background:#f6f5f5}.rule-active-row td{color:#71696c}
.product-name{font-weight:700;color:#4a363e;margin-bottom:4px}.product-code{font-size:10px;color:#aaa}
.category-badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#f6f0ff;color:#72559a;font-size:10px;font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge-green{background:#eaf8f1;color:var(--green)}.badge-orange{background:#fff3df;color:var(--orange)}
.ratio-line{display:flex;flex-wrap:wrap;gap:5px 10px;line-height:1.7}.ratio-item{white-space:nowrap}
.ratio-item b{color:#704054}.rule-active-row .ratio-item b{color:#655b5f}
.empty{padding:50px 20px;text-align:center;color:#aaa;font-size:13px}.empty-icon{font-size:35px;margin-bottom:10px}
.toast{position:fixed;right:22px;bottom:22px;max-width:380px;background:#41353a;color:#fff;padding:13px 17px;border-radius:10px;font-size:12px;z-index:300;box-shadow:0 10px 35px rgba(0,0,0,.18);display:none}
.toast.show{display:block}.toast.error{background:#b94057}
.loading-overlay{position:fixed;inset:0;background:rgba(255,250,251,.88);z-index:500;display:flex;align-items:center;justify-content:center;color:#a45470;font-size:14px}
.mobile-list{display:none}
@media(max-width:800px){
header{height:64px;padding:0 14px}.brand h1{font-size:15px}.brand small{display:none}.header-actions .btn{padding:8px 10px;font-size:11px}
main{padding:0 12px;margin-top:14px}.hero{padding:20px}.hero h2{font-size:21px}.stats{grid-template-columns:1fr 1fr}.filterbar{grid-template-columns:1fr}
.desktop-table{display:none}.mobile-list{display:block;padding:10px}
.mobile-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:9px}.mobile-card.locked{background:#f6f5f5}
.mobile-card-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.mobile-meta{font-size:11px;color:#888;line-height:1.8;margin:10px 0}
}
</style>
</head>
<body>
<div id="loading" class="loading-overlay">正在读取已开通城市、商户、服务项目及服务项目类型...</div>
<header>
<div class="brand"><div class="logo">♡</div><div><h1>商户分账规则</h1><small>孕乃馨平台管理中心</small></div></div>
<div class="header-actions"><button class="btn" onclick="goBack()">返回工作台</button><button class="btn btn-primary" onclick="logout()">退出</button></div>
</header>
<main>
<section class="hero">
<div class="hero-tag">MERCHANT SPLIT RULES</div>
<h2>商户分账规则</h2>
<p>系统读取全部有效商户和平台全部有效服务项目，并按照商户逐一陈列。每个服务项目同时显示管理员定义的服务项目类型。已经定义并生效的分账规则以灰色显示并锁定；尚未定义分账规则的服务项目保留“设置分账”入口。</p>
</section>
<section class="stats">
<div class="stat"><div class="stat-label">有效商户</div><div class="stat-value" id="statMerchants">0</div></div>
<div class="stat"><div class="stat-label">服务项目</div><div class="stat-value" id="statProducts">0</div></div>
<div class="stat"><div class="stat-label">已生效分账规则</div><div class="stat-value" id="statRules">0</div></div>
<div class="stat"><div class="stat-label">未定义组合</div><div class="stat-value" id="statUndefined">0</div></div>
</section>
<section class="panel">
<div class="panel-head"><div><div class="panel-title">商户及服务项目列表</div><div class="panel-sub">先选择已开通服务城市，再选择该城市商户</div></div></div>
<div class="city-filterbar"><div class="city-filter-label">选择已开通服务城市</div><select id="cityFilter" class="control"><option value="">全部已开通服务城市</option></select></div>
<div class="filterbar"><select id="merchantFilter" class="control"><option value="">全部商户</option></select><input id="searchInput" class="control" placeholder="搜索商户名称、服务项目类型、服务项目名称或编号"></div>
<div id="merchantContainer"></div>
<div id="emptyBox" class="empty" style="display:none"><div class="empty-icon">♡</div>没有找到符合条件的商户或服务项目</div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://qbuqjwpkltbjhlfbyjyb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const LOGIN_PAGE="./login.html",HOME_PAGE="./wholemanagement.html",IDLE_LIMIT=10*60*1000;
let currentUser=null,currentProfile=null,merchants=[],products=[],categories=[],rules=[],serviceAreas=[],cities=[],provinces=[],idleTimer=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function hideLoading(){const el=$("loading");if(el)el.style.display="none"}
function showToast(message,type=""){const el=$("toast");el.textContent=message;el.className="toast show "+type;clearTimeout(el._timer);el._timer=setTimeout(()=>{el.className="toast"},3000)}
function goBack(){window.location.href=HOME_PAGE}
async function logout(){try{await supabaseClient.auth.signOut()}finally{window.location.href=LOGIN_PAGE}}
function resetIdleTimer(){clearTimeout(idleTimer);idleTimer=setTimeout(autoLogout,IDLE_LIMIT)}
async function autoLogout(){try{await supabaseClient.auth.signOut()}catch(error){console.error("自动退出失败：",error)}alert("由于10分钟未操作，系统已自动退出。");window.location.href=LOGIN_PAGE}
["mousemove","mousedown","keydown","touchstart","scroll","click"].forEach(eventName=>{document.addEventListener(eventName,resetIdleTimer,{passive:true})});
function merchantName(m){return m?.merchant_name||m?.name||m?.full_name||m?.company_name||"未命名商户"}
function merchantCode(m){return m?.merchant_code||m?.code||m?.merchant_no||""}
function merchantCityId(m){return m?.city_id??m?.service_city_id??m?.registered_city_id??null}
function productName(p){return p?.product_name||p?.name||p?.service_name||"未命名服务项目"}
function productCode(p){return p?.product_code||p?.code||p?.product_no||""}
function getCategoryById(categoryId){if(categoryId===null||categoryId===undefined||categoryId==="")return null;return categories.find(item=>String(item.id)===String(categoryId))||null}
function productCategory(product){if(!product)return"未分类";const category=getCategoryById(product.category_id);if(category&&category.category_name)return category.category_name;return"未分类"}
function cityById(id){return cities.find(x=>String(x.id)===String(id))}
function provinceById(id){return provinces.find(x=>String(x.id)===String(id))}
function findActiveRule(merchantId,productId){return rules.find(r=>String(r.merchant_id)===String(merchantId)&&String(r.product_id)===String(productId)&&r.status==="active")}
function ratioValue(v){const n=Number(v);if(!Number.isFinite(n))return"0";return n.toLocaleString("zh-CN",{maximumFractionDigits:4})}
function ratioHtml(rule){
if(!rule)return"—";
return `<div class="ratio-line">
<span class="ratio-item">平台 <b>${esc(ratioValue(rule.platform_ratio))}%</b></span>
<span class="ratio-item">城市负责人 <b>${esc(ratioValue(rule.city_manager_ratio))}%</b></span>
<span class="ratio-item">商户 <b>${esc(ratioValue(rule.store_ratio))}%</b></span>
<span class="ratio-item">服务人员 <b>${esc(ratioValue(rule.operator_ratio))}%</b></span>
<span class="ratio-item">健康顾问 <b>${esc(ratioValue(rule.order_source_ratio))}%</b></span>
<span class="ratio-item">软件服务 <b>${esc(ratioValue(rule.software_service_ratio))}%</b></span>
</div>`}
async function initialize(){
resetIdleTimer();
try{
const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
if(sessionError)throw sessionError;
if(!session){location.replace(LOGIN_PAGE);return}
currentUser=session.user;
const {data:profile,error:profileError}=await supabaseClient.from("profiles").select(`id,full_name,role,status`).eq("id",currentUser.id).single();
if(profileError||!profile)throw new Error("无法读取当前账号权限。");
if(profile.status!=="active")throw new Error("当前账号已经停用。");
if(!["founder","platform_admin"].includes(profile.role)){alert("您没有商户分账规则管理权限。");location.replace(HOME_PAGE);return}
currentProfile=profile;
await loadData();
hideLoading();
}catch(error){console.error("页面初始化失败：",error);hideLoading();alert(error.message||"页面初始化失败。")}
}
async function loadData(){
const [merchantRes,productRes,categoryRes,ruleRes,areaRes,cityRes,provinceRes]=await Promise.all([
supabaseClient.from("merchants").select("*").eq("status","active").order("id",{ascending:true}),
supabaseClient.from("products").select("*").eq("status","active").order("id",{ascending:true}),
supabaseClient.from("service_categories").select(`id,category_name,description,status,created_at,updated_at`).order("id",{ascending:true}),
supabaseClient.from("merchant_product_rules").select("*").eq("status","active").order("created_at",{ascending:false}),
supabaseClient.from("service_areas").select(`id,area_no,province_id,city_id,district_id,status`).eq("status","active").is("district_id",null).order("area_no",{ascending:true}),
supabaseClient.from("cities").select(`id,province_id,city_code,city_name,status`).eq("status","active").order("city_code",{ascending:true}),
supabaseClient.from("provinces").select(`id,province_code,province_name,status`).eq("status","active").order("province_code",{ascending:true})
]);
if(merchantRes.error)throw new Error("商户读取失败："+merchantRes.error.message);
if(productRes.error)throw new Error("服务项目读取失败："+productRes.error.message);
if(categoryRes.error)throw new Error("服务项目类型读取失败："+categoryRes.error.message);
if(ruleRes.error)throw new Error("分账规则读取失败："+ruleRes.error.message);
if(areaRes.error)throw new Error("已开通服务城市读取失败："+areaRes.error.message);
if(cityRes.error)throw new Error("城市读取失败："+cityRes.error.message);
if(provinceRes.error)throw new Error("省份读取失败："+provinceRes.error.message);
merchants=merchantRes.data||[];products=productRes.data||[];categories=categoryRes.data||[];rules=ruleRes.data||[];serviceAreas=areaRes.data||[];cities=cityRes.data||[];provinces=provinceRes.data||[];
renderCityFilter();renderMerchantFilter();renderStats();renderMerchantList();
}
function getOpenedCities(){
const unique=new Map();
serviceAreas.forEach(area=>{if(!area.city_id)return;const key=String(area.city_id);if(!unique.has(key))unique.set(key,area)});
return [...unique.values()];
}
function renderCityFilter(){
const select=$("cityFilter"),oldValue=select.value,openedCities=getOpenedCities();
select.innerHTML='<option value="">全部已开通服务城市</option>'+openedCities.map(area=>{
const city=cityById(area.city_id),province=provinceById(area.province_id||city?.province_id);
const areaNo=area.area_no?String(area.area_no).padStart(3,"0"):"";
const provinceName=province?.province_name||"",cityName=city?.city_name||("城市 "+area.city_id);
return `<option value="${esc(area.city_id)}">${areaNo?esc(areaNo)+" | ":""}${provinceName?esc(provinceName)+" · ":""}${esc(cityName)}</option>`;
}).join("");
if(oldValue&&openedCities.some(area=>String(area.city_id)===String(oldValue)))select.value=oldValue;
}
function merchantsForSelectedCity(){
const selectedCity=$("cityFilter").value;
if(!selectedCity)return merchants;
return merchants.filter(m=>String(merchantCityId(m))===String(selectedCity));
}
function renderMerchantFilter(){
const select=$("merchantFilter"),oldValue=select.value,list=merchantsForSelectedCity();
select.innerHTML='<option value="">全部商户</option>'+list.map(m=>{const code=merchantCode(m);return `<option value="${esc(m.id)}">${code?esc(code)+" | ":""}${esc(merchantName(m))}</option>`}).join("");
if(oldValue&&list.some(m=>String(m.id)===String(oldValue)))select.value=oldValue;else select.value="";
}
function renderStats(){
const cityMerchants=merchantsForSelectedCity(),totalCombinations=cityMerchants.length*products.length;
let activeCount=0;
cityMerchants.forEach(m=>{products.forEach(p=>{if(findActiveRule(m.id,p.id))activeCount++})});
$("statMerchants").textContent=cityMerchants.length;
$("statProducts").textContent=products.length;
$("statRules").textContent=activeCount;
$("statUndefined").textContent=Math.max(0,totalCombinations-activeCount);
}
function filteredMerchants(){
const selectedMerchant=$("merchantFilter").value,list=merchantsForSelectedCity();
if(!selectedMerchant)return list;
return list.filter(m=>String(m.id)===String(selectedMerchant));
}
function filteredProductsForMerchant(merchant){
const keyword=$("searchInput").value.trim().toLowerCase();
if(!keyword)return products;
const merchantText=[merchantName(merchant),merchantCode(merchant)].join(" ").toLowerCase();
if(merchantText.includes(keyword))return products;
return products.filter(p=>[productName(p),productCode(p),productCategory(p)].join(" ").toLowerCase().includes(keyword));
}
function renderMerchantList(){
const container=$("merchantContainer"),empty=$("emptyBox"),merchantList=filteredMerchants(),blocks=[];
merchantList.forEach(merchant=>{
const productList=filteredProductsForMerchant(merchant);
if(!productList.length)return;
const code=merchantCode(merchant);
const activeRules=productList.filter(p=>findActiveRule(merchant.id,p.id)).length;
const desktopRows=productList.map(product=>{
const rule=findActiveRule(merchant.id,product.id),categoryName=productCategory(product);
if(rule)return `<tr class="rule-active-row">
<td><div class="product-name">${esc(productName(product))}</div><div class="product-code">${esc(productCode(product)||"—")}</div></td>
<td><span class="category-badge">${esc(categoryName)}</span></td>
<td><span class="badge badge-green">已定义并生效</span></td>
<td>${ratioHtml(rule)}</td>
<td><button class="btn btn-small btn-disabled" disabled>已锁定</button></td>
</tr>`;
return `<tr>
<td><div class="product-name">${esc(productName(product))}</div><div class="product-code">${esc(productCode(product)||"—")}</div></td>
<td><span class="category-badge">${esc(categoryName)}</span></td>
<td><span class="badge badge-orange">未定义</span></td>
<td>—</td>
<td><button class="btn btn-primary btn-small" onclick="openRule(${JSON.stringify(String(merchant.id))},${JSON.stringify(String(product.id))})">设置分账</button></td>
</tr>`;
}).join("");
const mobileRows=productList.map(product=>{
const rule=findActiveRule(merchant.id,product.id),categoryName=productCategory(product);
return `<div class="mobile-card ${rule?"locked":""}">
<div class="mobile-card-top"><div><div class="product-name">${esc(productName(product))}</div><div class="product-code">${esc(productCode(product)||"—")}</div></div>${rule?`<span class="badge badge-green">已定义</span>`:`<span class="badge badge-orange">未定义</span>`}</div>
<div class="mobile-meta">服务项目类型：<span class="category-badge">${esc(categoryName)}</span></div>
${rule?`${ratioHtml(rule)}<div style="margin-top:12px"><button class="btn btn-small btn-disabled" disabled>已锁定</button></div>`:`<div style="margin-top:12px"><button class="btn btn-primary btn-small" onclick="openRule(${JSON.stringify(String(merchant.id))},${JSON.stringify(String(product.id))})">设置分账</button></div>`}
</div>`;
}).join("");
blocks.push(`<section class="merchant-section">
<div class="merchant-head"><div><div class="merchant-name">${esc(merchantName(merchant))}</div><div class="merchant-meta">${code?"商户编号："+esc(code)+" · ":""}共 ${productList.length} 个服务项目 · ${activeRules} 个已定义分账规则</div></div><div class="merchant-count">${activeRules} / ${productList.length} 已定义</div></div>
<div class="desktop-table table-wrap"><table><thead><tr><th>服务项目</th><th>服务项目类型</th><th>分账状态</th><th>当前分账比例</th><th>操作</th></tr></thead><tbody>${desktopRows}</tbody></table></div>
<div class="mobile-list">${mobileRows}</div>
</section>`);
});
if(!blocks.length){container.innerHTML="";empty.style.display="block"}else{empty.style.display="none";container.innerHTML=blocks.join("")}
}
function openRule(merchantId,productId){
const merchant=merchants.find(m=>String(m.id)===String(merchantId));
const product=products.find(p=>String(p.id)===String(productId));
const existing=findActiveRule(merchantId,productId);
if(existing){showToast("该商户的这个服务项目已经存在有效分账规则。","error");return}
showToast("准备设置："+merchantName(merchant)+" · "+productCategory(product)+" · "+productName(product));
}
$("cityFilter").addEventListener("change",()=>{$("merchantFilter").value="";renderMerchantFilter();renderStats();renderMerchantList()});
$("merchantFilter").addEventListener("change",renderMerchantList);
$("searchInput").addEventListener("input",renderMerchantList);
initialize();
</script>
</body>
</html>
