
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的订单 - 孕乃馨</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #ff6f9f;
      --pink-dark: #f05286;
      --pink-light: #fff0f5;
      --pink-soft: #fff7fa;
      --text: #49363e;
      --text-light: #9b7f89;
      --border: #f4e3e9;
      --white: #ffffff;
      --green: #31a875;
      --orange: #e79b2f;
      --red: #e75b70;
      --blue: #5788c7;
      --shadow: 0 8px 24px rgba(210, 120, 150, 0.09);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #fff8fb;
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--pink-soft);
      position: relative;
      padding-bottom: 92px;
      box-shadow: 0 0 30px rgba(0,0,0,0.03);
    }

    /* =========================
       顶部
    ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      padding:
        max(8px, env(safe-area-inset-top))
        14px
        8px;

      background: rgba(255, 247, 250, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);

      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
    }

    .back-btn,
    .refresh-btn {
      width: 44px;
      height: 44px;
      border: 0;
      background: white;
      border-radius: 14px;
      color: var(--pink-dark);
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(210, 120, 150, 0.08);
    }

    .header-title {
      text-align: center;
    }

    .header-title h1 {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
    }

    .header-title p {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-light);
    }

    /* =========================
       统计区域
    ========================= */

    .summary {
      margin: 14px;
      padding: 18px;
      border-radius: 22px;

      background:
        radial-gradient(
          circle at 92% 10%,
          rgba(255,255,255,.26) 0,
          rgba(255,255,255,.26) 45px,
          transparent 46px
        ),
        linear-gradient(135deg, #ff79a6, #ff96b8);

      color: white;
      box-shadow: var(--shadow);
    }

    .summary-title {
      font-size: 13px;
      opacity: 0.9;
    }

    .summary-number {
      font-size: 30px;
      font-weight: 900;
      margin-top: 5px;
    }

    .summary-number span {
      font-size: 14px;
      font-weight: 600;
      margin-left: 4px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .summary-item {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      padding: 10px 5px;
      text-align: center;
    }

    .summary-item strong {
      display: block;
      font-size: 17px;
      margin-bottom: 3px;
    }

    .summary-item span {
      font-size: 11px;
      opacity: .92;
    }

    /* =========================
       筛选
    ========================= */

    .filters {
      padding: 0 14px 8px;
    }

    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 3px;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      min-width: 72px;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
      color: var(--text-light);
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .filter-btn.active {
      background: var(--pink);
      border-color: var(--pink);
      color: white;
      box-shadow: 0 5px 14px rgba(255,111,159,.22);
    }

    /* =========================
       内容
    ========================= */

    .content {
      padding: 5px 14px 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 2px 12px;
    }

    .section-title h2 {
      font-size: 16px;
      font-weight: 800;
    }

    .section-title span {
      font-size: 12px;
      color: var(--text-light);
    }

    /* =========================
       订单卡片
    ========================= */

    .order-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f8edf1;
    }

    .merchant {
      min-width: 0;
      flex: 1;
    }

    .merchant-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.45;
    }

    .order-no {
      margin-top: 4px;
      color: var(--text-light);
      font-size: 11px;
      word-break: break-all;
    }

    .status-badge {
      flex-shrink: 0;
      min-width: 58px;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    .status-unpaid {
      color: #b87514;
      background: #fff5dc;
    }

    .status-paid {
      color: #247d59;
      background: #e8f8f0;
    }

    .status-completed {
      color: #55718e;
      background: #edf4fb;
    }

    .status-cancelled {
      color: #8d7e84;
      background: #f2eef0;
    }

    .status-default {
      color: var(--pink-dark);
      background: var(--pink-light);
    }

    .product-area {
      padding: 13px 0 5px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      font-size: 12px;
    }

    .meta-label {
      color: var(--text-light);
      flex-shrink: 0;
    }

    .meta-value {
      color: var(--text);
      text-align: right;
      font-weight: 600;
      word-break: break-word;
    }

    .amount-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid #f8edf1;
    }

    .time {
      font-size: 11px;
      color: var(--text-light);
    }

    .amount {
      text-align: right;
    }

    .amount small {
      color: var(--text-light);
      font-size: 11px;
    }

    .amount strong {
      margin-left: 4px;
      font-size: 19px;
      color: var(--pink-dark);
    }

    .usage-box {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 14px;
      background: #fff7fa;
    }

    .usage-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .usage-top span:first-child {
      color: var(--text-light);
    }

    .usage-top span:last-child {
      color: var(--pink-dark);
      font-weight: 700;
    }

    .progress {
      height: 6px;
      margin-top: 8px;
      border-radius: 999px;
      background: #f4dfe7;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff77a5, #ff9bbb);
      border-radius: 999px;
    }

    .card-actions {
      margin-top: 13px;
    }

    .detail-btn {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      background: #fff0f5;
      color: var(--pink-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .detail-btn:active {
      transform: scale(.99);
    }

    /* =========================
       空状态 / 加载
    ========================= */

    .state-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 38px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .state-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .state-title {
      font-size: 16px;
      font-weight: 800;
    }

    .state-text {
      margin-top: 8px;
      color: var(--text-light);
      font-size: 12px;
      line-height: 1.7;
    }

    .state-btn {
      min-width: 150px;
      min-height: 46px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      background: var(--pink);
      color: white;
      font-weight: 800;
    }

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-light);
      font-size: 13px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid #f4dfe7;
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       底部导航
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);

      width: 100%;
      max-width: 480px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--border);

      padding:
        7px
        8px
        max(7px, env(safe-area-inset-bottom));

      z-index: 30;
    }

    .nav-btn {
      min-height: 58px;
      border: 0;
      background: transparent;
      color: var(--text-light);
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-btn.active {
      color: var(--pink-dark);
      background: #fff5f8;
    }

    /* =========================
       Toast
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);

      max-width: calc(100% - 40px);
      padding: 11px 16px;
      border-radius: 12px;

      background: rgba(60,48,53,.94);
      color: white;

      font-size: 12px;
      line-height: 1.5;
      text-align: center;

      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 481px) {
      body {
        background: #fff4f8;
      }

      .app {
        border-left: 1px solid #f5e5eb;
        border-right: 1px solid #f5e5eb;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <header class="header">

    <button
      class="back-btn"
      type="button"
      onclick="goHome()"
      aria-label="返回"
    >
      ‹
    </button>

    <div class="header-title">
      <h1>我的订单</h1>
      <p>全国消费订单统一管理</p>
    </div>

    <button
      class="refresh-btn"
      type="button"
      onclick="loadPage()"
      aria-label="刷新"
    >
      ↻
    </button>

  </header>


  <!-- 统计 -->
  <section class="summary">

    <div class="summary-title">
      我的全部订单
    </div>

    <div class="summary-number">
      <span id="totalOrderNumber" style="font-size:30px;margin-left:0;">0</span>
      <span>笔</span>
    </div>

    <div class="summary-grid">

      <div class="summary-item">
        <strong id="unpaidNumber">0</strong>
        <span>待付款</span>
      </div>

      <div class="summary-item">
        <strong id="usingNumber">0</strong>
        <span>服务中</span>
      </div>

      <div class="summary-item">
        <strong id="reviewNumber">0</strong>
        <span>待评价</span>
      </div>

    </div>

  </section>


  <!-- 筛选 -->
  <section class="filters">

    <div class="filter-scroll">

      <button
        class="filter-btn active"
        data-filter="all"
        onclick="setFilter('all', this)"
      >
        全部
      </button>

      <button
        class="filter-btn"
        data-filter="unpaid"
        onclick="setFilter('unpaid', this)"
      >
        待付款
      </button>

      <button
        class="filter-btn"
        data-filter="using"
        onclick="setFilter('using', this)"
      >
        服务中
      </button>

      <button
        class="filter-btn"
        data-filter="review"
        onclick="setFilter('review', this)"
      >
        待评价
      </button>

      <button
        class="filter-btn"
        data-filter="completed"
        onclick="setFilter('completed', this)"
      >
        已完成
      </button>

    </div>

  </section>


  <!-- 订单列表 -->
  <main class="content">

    <div class="section-title">
      <h2 id="listTitle">全部订单</h2>
      <span id="listCount">0 笔</span>
    </div>

    <div id="orderList">

      <div class="loading">
        <div class="spinner"></div>
        正在读取订单...
      </div>

    </div>

  </main>


  <!-- 底部导航 -->
  <nav class="bottom-nav">

    <button
      class="nav-btn"
      type="button"
      onclick="goHome()"
    >
      <span class="nav-icon">🏠</span>
      首页
    </button>

    <button
      class="nav-btn active"
      type="button"
    >
      <span class="nav-icon">🧾</span>
      订单
    </button>

    <button
      class="nav-btn"
      type="button"
      onclick="goHome()"
    >
      <span class="nav-icon">👤</span>
      我的
    </button>

  </nav>

</div>


<div id="toast" class="toast"></div>


<script>
/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://qbuqjwpkltbjhlfbyjyb.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   页面状态
========================================================= */

let currentUser = null;
let currentCustomer = null;

let allOrders = [];
let currentFilter = "all";


/* =========================================================
   基础函数
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function money(value) {

  const n = Number(value || 0);

  return "¥" + n.toFixed(2).replace(/\.00$/, "");
}


function formatDate(value) {

  if (!value) return "-";

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return "-";
  }

  const month =
    String(d.getMonth() + 1).padStart(2, "0");

  const day =
    String(d.getDate()).padStart(2, "0");

  const hour =
    String(d.getHours()).padStart(2, "0");

  const minute =
    String(d.getMinutes()).padStart(2, "0");

  return `${month}/${day} ${hour}:${minute}`;
}


function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2600);
}


function goHome() {

  window.location.href = "./customer.html";
}


function openOrder(orderId) {

  if (!orderId) return;

  window.location.href =
    "./customer_order_detail.html?id="
    + encodeURIComponent(orderId);
}


/* =========================================================
   登录检查
========================================================= */

async function requireCustomerLogin() {

  const {
    data: { session },
    error
  } = await sb.auth.getSession();

  if (
    error ||
    !session ||
    !session.user
  ) {

    window.location.replace("./login.html");
    return false;
  }

  currentUser = session.user;

  return true;
}


/* =========================================================
   查找客户
   customers.id 与 auth.users.id 对应
========================================================= */

async function loadCustomer() {

  const {
    data,
    error
  } = await sb
    .from("customers")
    .select(`
      id,
      customer_no,
      phone,
      nickname,
      status,
      created_at
    `)
    .eq("id", currentUser.id)
    .maybeSingle();


  if (error) {
    throw error;
  }


  if (!data) {

    throw new Error(
      "当前登录账号还没有建立客户资料，请重新登录。"
    );
  }


  if (
    data.status &&
    data.status !== "active"
  ) {

    throw new Error(
      "当前客户账号已停止使用。"
    );
  }


  currentCustomer = data;
}


/* =========================================================
   读取订单
   重要：
   不按省、市、区过滤。
   客户可以跨城市消费。
========================================================= */

async function loadOrders() {

  const {
    data,
    error
  } = await sb
    .from("orders")
    .select(`
      id,
      order_no,
      customer_id,
      merchant_id,
      province_id,
      city_id,
      district_id,

      total_amount,
      subtotal_amount,
      discount_rate,
      discount_amount,
      payable_amount,

      order_status,
      payment_status,
      invoice_status,
      review_status,

      total_uses,
      used_uses,
      remaining_uses,

      recommendation_source_type,
      recommendation_source_no,
      recommendation_source_entity_id,
      recommendation_source_name_snapshot,

      merchant_no_snapshot,
      merchant_name_snapshot,
      merchant_address_snapshot,

      created_at,
      updated_at,
      paid_at,
      completed_at
    `)
    .eq("customer_id", currentCustomer.id)
    .order("created_at", {
      ascending: false
    });


  if (error) {
    throw error;
  }


  allOrders = data || [];


  /*
    单独读取订单明细。

    不依赖 PostgREST relation 自动识别，
    避免因为 FK / relation 名称变化导致整个订单列表失败。
  */

  if (allOrders.length > 0) {

    const orderIds =
      allOrders.map(item => item.id);


    const {
      data: itemRows,
      error: itemError
    } = await sb
      .from("order_items")
      .select(`
        id,
        order_id,
        product_id,
        product_code_snapshot,
        product_name_snapshot,
        product_type,
        quantity,
        unit_price,
        tax_rate,
        amount,
        city_price_id,
        original_amount,
        discounted_amount
      `)
      .in("order_id", orderIds)
      .order("id", {
        ascending: true
      });


    if (itemError) {
      throw itemError;
    }


    const itemMap = {};


    (itemRows || []).forEach(item => {

      const key =
        String(item.order_id);

      if (!itemMap[key]) {
        itemMap[key] = [];
      }

      itemMap[key].push(item);
    });


    allOrders =
      allOrders.map(order => ({
        ...order,
        items:
          itemMap[String(order.id)] || []
      }));
  }


  updateSummary();
  renderOrders();
}


/* =========================================================
   统计
========================================================= */

function isUnpaid(order) {

  return order.payment_status === "unpaid";
}


function isUsing(order) {

  if (isUnpaid(order)) {
    return false;
  }

  const remaining =
    Number(order.remaining_uses || 0);

  return (
    remaining > 0 &&
    order.order_status !== "completed" &&
    order.order_status !== "cancelled"
  );
}


function isReview(order) {

  return (
    order.review_status === "pending" &&
    (
      order.order_status === "completed" ||
      Number(order.remaining_uses || 0) === 0
    )
  );
}


function isCompleted(order) {

  return (
    order.order_status === "completed" ||
    (
      Number(order.remaining_uses || 0) === 0 &&
      !isUnpaid(order)
    )
  );
}


function updateSummary() {

  const total =
    allOrders.length;

  const unpaid =
    allOrders.filter(isUnpaid).length;

  const using =
    allOrders.filter(isUsing).length;

  const review =
    allOrders.filter(isReview).length;


  document.getElementById(
    "totalOrderNumber"
  ).textContent = total;


  document.getElementById(
    "unpaidNumber"
  ).textContent = unpaid;


  document.getElementById(
    "usingNumber"
  ).textContent = using;


  document.getElementById(
    "reviewNumber"
  ).textContent = review;
}


/* =========================================================
   筛选
========================================================= */

function setFilter(filter, button) {

  currentFilter = filter;


  document
    .querySelectorAll(".filter-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });


  if (button) {
    button.classList.add("active");
  }


  renderOrders();
}


function filteredOrders() {

  switch (currentFilter) {

    case "unpaid":
      return allOrders.filter(isUnpaid);

    case "using":
      return allOrders.filter(isUsing);

    case "review":
      return allOrders.filter(isReview);

    case "completed":
      return allOrders.filter(isCompleted);

    default:
      return allOrders;
  }
}


function filterTitle() {

  switch (currentFilter) {

    case "unpaid":
      return "待付款订单";

    case "using":
      return "服务中订单";

    case "review":
      return "待评价订单";

    case "completed":
      return "已完成订单";

    default:
      return "全部订单";
  }
}


/* =========================================================
   状态显示
========================================================= */

function getStatus(order) {

  if (
    order.order_status === "cancelled"
  ) {

    return {
      text: "已取消",
      cls: "status-cancelled"
    };
  }


  if (
    order.payment_status === "unpaid"
  ) {

    return {
      text: "待付款",
      cls: "status-unpaid"
    };
  }


  if (
    order.order_status === "completed"
  ) {

    if (
      order.review_status === "pending"
    ) {

      return {
        text: "待评价",
        cls: "status-default"
      };
    }

    return {
      text: "已完成",
      cls: "status-completed"
    };
  }


  if (
    Number(order.remaining_uses || 0) > 0
  ) {

    return {
      text: "服务中",
      cls: "status-paid"
    };
  }


  return {
    text: "处理中",
    cls: "status-default"
  };
}


/* =========================================================
   推荐来源
========================================================= */

function recommendationText(order) {

  if (
    order.recommendation_source_name_snapshot
  ) {

    return order
      .recommendation_source_name_snapshot;
  }


  switch (
    order.recommendation_source_type
  ) {

    case "merchant":
      return "商户推荐";

    case "health_consultant":

      if (order.recommendation_source_no) {

        return (
          "健康顾问 #" +
          order.recommendation_source_no
        );
      }

      return "健康顾问";

    case "platform":
    default:
      return "平台";
  }
}


/* =========================================================
   项目名称
========================================================= */

function getProductName(order) {

  const items =
    Array.isArray(order.items)
      ? order.items
      : [];


  if (items.length === 0) {

    return "服务订单";
  }


  if (items.length === 1) {

    return (
      items[0].product_name_snapshot ||
      "服务项目"
    );
  }


  const firstName =
    items[0].product_name_snapshot ||
    "服务项目";


  return (
    firstName +
    " 等 " +
    items.length +
    " 项"
  );
}


/* =========================================================
   商户名称
========================================================= */

function getMerchantName(order) {

  if (order.merchant_name_snapshot) {
    return order.merchant_name_snapshot;
  }


  if (order.merchant_no_snapshot) {

    return (
      "服务商户 #" +
      order.merchant_no_snapshot
    );
  }


  return "服务商户";
}


/* =========================================================
   金额
========================================================= */

function getPayableAmount(order) {

  const payable =
    Number(order.payable_amount);


  if (
    Number.isFinite(payable) &&
    payable >= 0
  ) {

    return payable;
  }


  return Number(order.total_amount || 0);
}


/* =========================================================
   消费进度
========================================================= */

function usagePercent(order) {

  const total =
    Number(order.total_uses || 1);

  const used =
    Number(order.used_uses || 0);


  if (total <= 0) {
    return 0;
  }


  return Math.max(
    0,
    Math.min(
      100,
      (used / total) * 100
    )
  );
}


/* =========================================================
   渲染
========================================================= */

function renderOrders() {

  const list =
    document.getElementById("orderList");

  const orders =
    filteredOrders();


  document.getElementById(
    "listTitle"
  ).textContent = filterTitle();


  document.getElementById(
    "listCount"
  ).textContent =
    orders.length + " 笔";


  if (orders.length === 0) {

    list.innerHTML = `
      <div class="state-box">

        <div class="state-icon">
          🧾
        </div>

        <div class="state-title">
          暂无订单
        </div>

        <div class="state-text">
          当前分类还没有订单。<br>
          您可以返回首页选择服务项目下单。
        </div>

        <button
          class="state-btn"
          type="button"
          onclick="goOrderPage()"
        >
          去下单
        </button>

      </div>
    `;

    return;
  }


  list.innerHTML =
    orders.map(order => {

      const status =
        getStatus(order);


      const totalUses =
        Number(order.total_uses || 1);


      const usedUses =
        Number(order.used_uses || 0);


      const remainingUses =
        Number(
          order.remaining_uses ??
          Math.max(
            0,
            totalUses - usedUses
          )
        );


      const percent =
        usagePercent(order);


      return `
        <article class="order-card">

          <div class="order-top">

            <div class="merchant">

              <div class="merchant-name">
                ${escapeHtml(
                  getMerchantName(order)
                )}
              </div>

              <div class="order-no">
                订单号：
                ${escapeHtml(
                  order.order_no ||
                  String(order.id)
                )}
              </div>

            </div>

            <span
              class="
                status-badge
                ${status.cls}
              "
            >
              ${escapeHtml(status.text)}
            </span>

          </div>


          <div class="product-area">

            <div class="product-name">
              ${escapeHtml(
                getProductName(order)
              )}
            </div>


            <div class="meta-row">

              <span class="meta-label">
                推荐来源
              </span>

              <span class="meta-value">
                ${escapeHtml(
                  recommendationText(order)
                )}
              </span>

            </div>


            <div class="meta-row">

              <span class="meta-label">
                支付状态
              </span>

              <span class="meta-value">
                ${
                  order.payment_status === "paid"
                    ? "已支付"
                    : order.payment_status === "unpaid"
                    ? "未支付"
                    : escapeHtml(
                        order.payment_status ||
                        "-"
                      )
                }
              </span>

            </div>


            <div class="meta-row">

              <span class="meta-label">
                可消费次数
              </span>

              <span class="meta-value">
                ${totalUses} 次
              </span>

            </div>

          </div>


          <div class="usage-box">

            <div class="usage-top">

              <span>
                消费进度
              </span>

              <span>
                已消费 ${usedUses} 次 ·
                剩余 ${remainingUses} 次
              </span>

            </div>

            <div class="progress">

              <div
                class="progress-bar"
                style="width:${percent}%"
              ></div>

            </div>

          </div>


          <div class="amount-row">

            <div class="time">
              ${escapeHtml(
                formatDate(order.created_at)
              )}
            </div>

            <div class="amount">

              <small>
                应付金额
              </small>

              <strong>
                ${escapeHtml(
                  money(
                    getPayableAmount(order)
                  )
                )}
              </strong>

            </div>

          </div>


          <div class="card-actions">

            <button
              class="detail-btn"
              type="button"
              onclick="openOrder(${Number(order.id)})"
            >
              查看订单
            </button>

          </div>

        </article>
      `;

    }).join("");
}


/* =========================================================
   去下单
========================================================= */

function goOrderPage() {

  window.location.href =
    "./customer_order.html";
}


/* =========================================================
   错误页面
========================================================= */

function showError(error) {

  console.error(error);


  const message =
    error?.message ||
    String(error) ||
    "页面加载失败";


  document.getElementById(
    "orderList"
  ).innerHTML = `
    <div class="state-box">

      <div class="state-icon">
        ⚠️
      </div>

      <div class="state-title">
        订单读取失败
      </div>

      <div class="state-text">
        ${escapeHtml(message)}
      </div>

      <button
        class="state-btn"
        type="button"
        onclick="loadPage()"
      >
        重新加载
      </button>

    </div>
  `;
}


/* =========================================================
   主加载
========================================================= */

async function loadPage() {

  try {

    document.getElementById(
      "orderList"
    ).innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        正在读取订单...
      </div>
    `;


    const loggedIn =
      await requireCustomerLogin();


    if (!loggedIn) {
      return;
    }


    await loadCustomer();

    await loadOrders();

  } catch (error) {

    showError(error);
  }
}


/* =========================================================
   Auth 状态变化
========================================================= */

sb.auth.onAuthStateChange(
  (event, session) => {

    if (
      event === "SIGNED_OUT" ||
      !session
    ) {

      window.location.replace(
        "./login.html"
      );
    }
  }
);


/* =========================================================
   启动
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  loadPage
);
</script>

</body>
</html>
