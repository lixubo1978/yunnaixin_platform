<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>商户分成规则管理 - 孕乃馨平台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#fffafb;
color:#382a30;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"PingFang SC",
"Microsoft YaHei",
sans-serif;
}


header{

height:72px;
background:#fff;
border-bottom:1px solid #eee3e7;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 30px;

}


.logo{

width:38px;
height:38px;

border-radius:50%;

background:linear-gradient(
145deg,
#ff91ad,
#ff668d
);

color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:20px;

}


.brand{

display:flex;
gap:12px;
align-items:center;

}


.brand h1{

font-size:18px;
margin:0;
color:#8c3d58;

}


.brand small{

font-size:11px;
color:#aaa;

}


.btn{

border:1px solid #eee3e7;

background:white;

border-radius:10px;

padding:10px 16px;

cursor:pointer;

}


.btn-primary{

background:#e64f7c;
color:white;
border-color:#e64f7c;

}


.btn-danger{

background:#fff3f5;
color:#dc4c64;

}


main{

max-width:1250px;

margin:25px auto;

padding:0 20px;

}



.hero{

background:
linear-gradient(
110deg,
#fff0f5,
#ffdce8
);

border-radius:20px;

padding:28px;

margin-bottom:18px;

}


.hero h2{

margin:0 0 10px;

color:#75354c;

}


.hero p{

color:#986879;

font-size:13px;

line-height:1.8;

}



.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:12px;

margin-bottom:18px;

}



.stat{

background:white;

border:1px solid #eee3e7;

border-radius:15px;

padding:18px;

}



.stat-label{

font-size:12px;

color:#aaa;

}



.stat-value{

font-size:24px;

font-weight:800;

color:#713148;

margin-top:8px;

}



.panel{

background:white;

border:1px solid #eee3e7;

border-radius:16px;

margin-bottom:18px;

}



.panel-head{

padding:18px 20px;

border-bottom:1px solid #eee3e7;

font-weight:800;

color:#653146;

}



.filter{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:12px;

padding:20px;

}



select,
input{

height:42px;

border:1px solid #eee3e7;

border-radius:10px;

padding:0 12px;

width:100%;

}



.create-box{

padding:20px;

background:#fff8fa;

border-top:1px solid #eee3e7;

}



.rule-grid{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:10px;

}


.rule-grid label{

font-size:11px;

color:#999;

}


.percent{

position:relative;

}


.percent span{

position:absolute;

right:12px;

top:12px;

color:#999;

}



table{

width:100%;

border-collapse:collapse;

min-width:1100px;

}


th{

background:#fffafb;

color:#98878e;

font-size:12px;

padding:13px;

text-align:left;

}


td{

padding:14px;

border-bottom:1px solid #f2eaed;

font-size:13px;

}


.badge{

padding:5px 10px;

border-radius:20px;

font-size:11px;

}


.active{

background:#eaf8f1;

color:#2e9d68;

}


.history{

background:#f3f1f2;

color:#888;

}


.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

align-items:center;

justify-content:center;

z-index:100;

}


.modal.show{

display:flex;

}


.modal-box{

background:white;

width:520px;

border-radius:18px;

padding:25px;

}



.modal-title{

font-size:18px;

font-weight:bold;

margin-bottom:20px;

color:#70354a;

}



.row{

margin-bottom:15px;

}



.row label{

font-size:12px;

color:#888;

display:block;

margin-bottom:6px;

}



.actions{

display:flex;

gap:8px;

}


@media(max-width:800px){

.stats{

grid-template-columns:1fr 1fr;

}


.filter{

grid-template-columns:1fr;

}


.rule-grid{

grid-template-columns:1fr 1fr;

}

}

</style>

</head>


<body>


<header>


<div class="brand">

<div class="logo">♡</div>

<div>

<h1>商户分成规则管理</h1>

<small>孕乃馨平台</small>

</div>

</div>


<div>

<button class="btn" onclick="goBack()">
返回工作台
</button>

<button class="btn btn-primary" onclick="logout()">
退出
</button>

</div>


</header>



<main>


<section class="hero">

<h2>
商户经营分成规则
</h2>

<p>
只保存真实经营项目。
管理员选择城市、商户和服务项目后，人工定义分成比例。
系统不会自动生成占位规则。
</p>

</section>



<section class="stats">


<div class="stat">
<div class="stat-label">
有效规则
</div>

<div class="stat-value" id="activeCount">
0
</div>

</div>


<div class="stat">
<div class="stat-label">
历史规则
</div>

<div class="stat-value" id="historyCount">
0
</div>

</div>


<div class="stat">
<div class="stat-label">
商户数量
</div>

<div class="stat-value" id="merchantCount">
0
</div>

</div>


<div class="stat">
<div class="stat-label">
服务项目
</div>

<div class="stat-value" id="productCount">
0
</div>

</div>


</section>


<section class="panel">

<div class="panel-head">

查询规则

</div>


<div class="filter">


<select id="cityFilter">

<option value="">
选择城市
</option>

</select>



<select id="merchantFilter">

<option value="">
选择商户
</option>

</select>



<select id="productFilter">

<option value="">
选择服务项目
</option>

</select>


</div>


</section>



<section class="panel">


<div class="panel-head">

创建新的分成规则

</div>


<div class="create-box">


<div class="filter">


<select id="createCity">

<option>
选择城市
</option>

</select>


<select id="createMerchant">

<option>
选择商户
</option>

</select>


<select id="createProduct">

<option>
选择服务项目
</option>

</select>


</div>


<div class="rule-grid">


<div>
<label>
城市负责人
</label>
<div class="percent">
<input id="cityRatio" type="number">
<span>%</span>
</div>
</div>


<div>
<label>
平台
</label>
<div class="percent">
<input id="platformRatio" type="number">
<span>%</span>
</div>
</div>


<div>
<label>
商户
</label>
<div class="percent">
<input id="storeRatio" type="number">
<span>%</span>
</div>
</div>


<div>
<label>
运营
</label>
<div class="percent">
<input id="operatorRatio" type="number">
<span>%</span>
</div>
</div>


<div>
<label>
订单来源
</label>
<div class="percent">
<input id="sourceRatio" type="number">
<span>%</span>
</div>
</div>


</div>


<br>


<button class="btn btn-primary" onclick="createRule()">
保存分成规则
</button>


</div>


</section>



<section class="panel">

<div class="panel-head">
规则列表
</div>


<div style="overflow:auto">


<table>

<thead>

<tr>

<th>城市</th>
<th>商户</th>
<th>服务项目</th>
<th>城市负责人</th>
<th>平台</th>
<th>商户</th>
<th>运营</th>
<th>来源</th>
<th>版本</th>
<th>状态</th>
<th>操作</th>

</tr>

</thead>


<tbody id="ruleList">

</tbody>


</table>


</div>


</section>


</main>
<div id="toast"
style="
position:fixed;
right:20px;
bottom:20px;
background:#41353a;
color:white;
padding:12px 18px;
border-radius:10px;
display:none;
z-index:200;
">
</div>


<script>


const SUPABASE_URL=
"你的SUPABASE_URL";


const SUPABASE_ANON_KEY=
"你的SUPABASE_ANON_KEY";


const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);



const LOGIN_PAGE="login.html";

const HOME_PAGE="wholemanagement.html";



let currentUser=null;

let currentProfile=null;


let cities=[];

let merchants=[];

let products=[];

let rules=[];



const $=id=>document.getElementById(id);



function toast(msg,type=""){

const t=$("toast");

t.innerHTML=msg;

t.style.display="block";

t.style.background=
type==="error"
?
"#b94057"
:
"#41353a";


setTimeout(()=>{

t.style.display="none";

},3000);

}





function goBack(){

location.href=HOME_PAGE;

}



async function logout(){

await supabaseClient.auth.signOut();

location.href=LOGIN_PAGE;

}





async function init(){



const {

data:{
session

}

}=await supabaseClient.auth.getSession();



if(!session){

location.href=LOGIN_PAGE;

return;

}



currentUser=session.user;



const {

data:profile

}=await supabaseClient

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();



if(!profile){

alert("没有权限");

location.href=HOME_PAGE;

return;

}



currentProfile=profile;



if(
!
[
"founder",
"platform_admin",
"province_manager",
"city_manager"
]
.includes(profile.role)

){

alert("没有访问权限");

location.href=HOME_PAGE;

return;

}



await loadData();



}





async function loadData(){



/*
读取权限范围内城市
*/

const {
data:scope,
error:scopeError
}=await supabaseClient
.rpc(
"get_user_city_scope"
);



if(scopeError){

toast(scopeError.message,"error");

return;

}



const cityIds=
(scope||[]).map(
x=>x.city_id
);



let cityQuery=
supabaseClient
.from("cities")
.select("*")
.eq("status","active");



if(
!
[
"founder",
"platform_admin"
]
.includes(currentProfile.role)

){

cityQuery=
cityQuery.in(
"id",
cityIds
);

}



const {
data:cityData
}=await cityQuery;


cities=cityData||[];




const {
data:merchantData
}=await supabaseClient

.from("merchants")

.select("*")

.eq("status","active");



merchants=
merchantData||[];





const {
data:productData
}=await supabaseClient

.from("products")

.select("*")

.eq("status","active")

.order("id");



products=
productData||[];





await loadRules();



renderAll();


}





async function loadRules(){


const {
data,
error
}=await supabaseClient

.from("merchant_product_rules")

.select(`
*,
cities(
city_name
),
merchants(
merchant_name
),
products(
product_name,
product_code
)
`)

.order(
"created_at",
{
ascending:false
}
);



if(error){

toast(error.message,"error");

return;

}



rules=data||[];



}





function renderAll(){


renderCities();

renderCreateCities();

renderMerchants();

renderProducts();

renderRules();

updateStats();


}






function renderCities(){


let html=
`
<option value="">
选择城市
</option>
`;



cities.forEach(c=>{

html+=
`
<option value="${c.id}">
${c.city_name}
</option>
`;

});



$("cityFilter").innerHTML=html;

$("createCity").innerHTML=html;


}





function renderCreateCities(){



$("createCity").innerHTML=
$("cityFilter").innerHTML;



}





function renderMerchants(){



let html=
`
<option value="">
选择商户
</option>
`;



merchants.forEach(m=>{


html+=
`
<option value="${m.id}">
${m.merchant_name}
</option>
`;


});



$("merchantFilter").innerHTML=html;

$("createMerchant").innerHTML=html;


}





function renderProducts(){



let html=
`
<option value="">
选择服务项目
</option>
`;



products.forEach(p=>{


html+=
`
<option value="${p.id}">
${p.product_name}
</option>
`;


});



$("productFilter").innerHTML=html;

$("createProduct").innerHTML=html;



}





function updateStats(){


$("activeCount").innerText=

rules.filter(
r=>r.status==="active"
).length;



$("historyCount").innerText=

rules.filter(
r=>r.status==="inactive"
).length;



$("merchantCount").innerText=

new Set(
rules.map(
r=>r.merchant_id
)
).size;



$("productCount").innerText=

new Set(
rules.map(
r=>r.product_id
)
).size;



}





function renderRules(){



let list=$("ruleList");



if(!rules.length){

list.innerHTML=
`
<tr>
<td colspan="11">
暂无分成规则
</td>
</tr>
`;

return;

}



list.innerHTML=
rules.map(r=>{


return `

<tr>

<td>
${r.cities?.city_name||""}
</td>


<td>
${r.merchants?.merchant_name||""}
</td>


<td>
${r.products?.product_name||""}
</td>


<td>
${r.city_manager_ratio||0}%
</td>


<td>
${r.platform_ratio||0}%
</td>


<td>
${r.store_ratio||0}%
</td>


<td>
${r.operator_ratio||0}%
</td>


<td>
${r.order_source_ratio||0}%
</td>


<td>
V${r.version_no||1}
</td>


<td>

<span class="badge ${
r.status==="active"
?
"active"
:
"history"
}">

${r.status==="active"
?
"有效"
:
"历史"
}

</span>

</td>


<td>


${
r.status==="active"

?

`

<button
class="btn btn-danger"
onclick="stopRule(${r.id})">

停止

</button>

`

:

""

}


</td>


</tr>


`;



}).join("");



}






async function createRule(){



const city=
Number(
$("createCity").value
);


const merchant=
Number(
$("createMerchant").value
);


const product=
Number(
$("createProduct").value
);



const cityRatio=
Number(
$("cityRatio").value||0
);


const platformRatio=
Number(
$("platformRatio").value||0
);


const storeRatio=
Number(
$("storeRatio").value||0
);


const operatorRatio=
Number(
$("operatorRatio").value||0
);


const sourceRatio=
Number(
$("sourceRatio").value||0
);




if(
!city||
!merchant||
!product
){

toast(
"请选择完整信息",
"error"
);

return;

}




const total=
cityRatio+
platformRatio+
storeRatio+
operatorRatio+
sourceRatio;



if(total!==98){

toast(
"经营分成比例必须合计98%",
"error"
);

return;

}




const {
data,
error
}=await supabaseClient

.rpc(
"create_merchant_rule",
{

p_city_id:city,

p_merchant_id:merchant,

p_product_id:product,

p_city_manager_ratio:cityRatio,

p_platform_ratio:platformRatio,

p_store_ratio:storeRatio,

p_operator_ratio:operatorRatio,

p_order_source_ratio:sourceRatio

}

);



if(error){

toast(error.message,"error");

return;

}



if(!data.success){

toast(data.error,"error");

return;

}



toast(
"创建成功"
);



await loadRules();

renderRules();


}





async function stopRule(id){



if(
!confirm(
"确认停止该规则？"
)

)return;



const {
data,
error
}=await supabaseClient

.rpc(
"stop_merchant_rule",
{
p_rule_id:id
}
);



if(error){

toast(error.message,"error");

return;

}



if(!data.success){

toast(data.error,"error");

return;

}



toast(
"规则已停止"
);



await loadRules();

renderRules();


}







init();


</script>


</body>

</html>
