/* =========================================================
   工具
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return '未定义';
    }


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return '未定义';
    }


    return '¥'
        +
        number.toLocaleString(
            'zh-CN',
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );
}


function formatRatio(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return '未定义';
    }


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return '未定义';
    }


    return number
        .toLocaleString(
            'zh-CN',
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        )
        +
        '%';
}


function formatNo(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return '-';
    }


    return String(value)
        .padStart(
            3,
            '0'
        );
}

/* =========================================================
   登录验证
========================================================= */

async function verifyLogin() {

    const {
        data:sessionData,
        error:sessionError
    } =
    await supabaseClient.auth
        .getSession();


    if (
        sessionError ||
        !sessionData?.session
    ) {

        window.location.replace(
            LOGIN_PAGE
        );

        return false;
    }


    const {
        data:userData,
        error:userError
    } =
    await supabaseClient.auth
        .getUser();


    if (
        userError ||
        !userData?.user
    ) {

        await forceLogout();

        return false;
    }


    currentUser =
        userData.user;


    const {
        data:profile,
        error:profileError
    } =
    await supabaseClient

        .from('profiles')

        .select(`
            id,
            full_name,
            role,
            status,
            login_email,
            account_no
        `)

        .eq(
            'id',
            currentUser.id
        )

        .maybeSingle();


    if (
        profileError ||
        !profile
    ) {

        await forceLogout();

        return false;
    }


    if (
        profile.status !==
        'active'
    ) {

        await forceLogout();

        return false;
    }


    /*
    当前页面仅允许：
    1. 健康顾问
    2. 创始人
    */

    const allowedRoles = [
        'health_consultant',
        'founder'
    ];


    if (
        !allowedRoles.includes(
            profile.role
        )
    ) {

        await forceLogout();

        return false;
    }


    currentProfile =
        profile;


    isFounderMode =
        profile.role ===
        'founder';


    return true;
}

/* =========================================================
   服务区域
========================================================= */

async function loadServiceArea() {

    if (
        !currentConsultant
            ?.service_area_id
    ) {

        currentServiceArea =
            null;

        return;
    }


    const {
        data:area,
        error:areaError
    } =
    await supabaseClient

        .from(
            'service_areas'
        )

        .select(`
            id,
            area_no,
            province_id,
            city_id,
            district_id,
            status
        `)

        .eq(
            'id',
            currentConsultant
                .service_area_id
        )

        .maybeSingle();


    if (areaError) {
        throw areaError;
    }


    if (!area) {

        currentServiceArea =
            null;

        return;
    }


    let provinceName =
        '';

    let cityName =
        '';

    let districtName =
        '';


    if (
        area.province_id
    ) {

        const {
            data
        } =
        await supabaseClient

            .from(
                'provinces'
            )

            .select(
                'province_name'
            )

            .eq(
                'id',
                area.province_id
            )

            .maybeSingle();


        provinceName =
            data?.province_name ||
            '';
    }


    if (
        area.city_id
    ) {

        const {
            data
        } =
        await supabaseClient

            .from(
                'cities'
            )

            .select(
                'city_name'
            )

            .eq(
                'id',
                area.city_id
            )

            .maybeSingle();


        cityName =
            data?.city_name ||
            '';
    }


    if (
        area.district_id
    ) {

        const {
            data
        } =
        await supabaseClient

            .from(
                'districts'
            )

            .select(
                'district_name'
            )

            .eq(
                'id',
                area.district_id
            )

            .maybeSingle();


        districtName =
            data?.district_name ||
            '';
    }


    currentServiceArea = {

        ...area,

        province_name:
            provinceName,

        city_name:
            cityName,

        district_name:
            districtName

    };
}

function getAreaText() {

    if (!currentServiceArea) {

    const parts =
        [];


    if (

            .province_name

    if (

    if (

    return (

/* =========================================================
   加载项目规则
========================================================= */

async function loadProjectRules() {

    if (
        !currentConsultant
            ?.id
    ) {

        renderProjects([]);

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient

        .from(
            'merchant_product_rules'
        )

        .select(`
            id,
            merchant_id,
            product_id,
            rule_type,
            health_consultant_id,
            health_consultant_ratio,
            status,
            version_no
        `)

        .eq(
            'health_consultant_id',
            currentConsultant.id
        )

        .eq(
            'rule_type',
            'health_consultant'
        )

        .eq(
            'status',
            'active'
        )

        .order(
            'id',
            {
                ascending:false
            }
        );


    if (error) {
        throw error;
    }


    projectRules =
        data || [];


    if (
        projectRules.length ===
        0
    ) {

        renderProjects([]);

        return;
    }


    const productIds =
        [
            ...new Set(
                projectRules
                    .map(
                        item =>
                            item.product_id
                    )
                    .filter(Boolean)
            )
        ];


    const merchantIds =
        [
            ...new Set(
                projectRules
                    .map(
                        item =>
                            item.merchant_id
                    )
                    .filter(Boolean)
            )
        ];


    let products =
        [];


    if (
        productIds.length >
        0
    ) {

        const {
            data,
            error
        } =
        await supabaseClient

            .from(
                'products'
            )

            .select(`
                id,
                product_code,
                product_name,
                status
            `)

            .in(
                'id',
                productIds
            );


        if (error) {
            throw error;
        }


        products =
            data || [];
    }


    let merchants =
        [];


    if (
        merchantIds.length >
        0
    ) {

        const {
            data,
            error
        } =
        await supabaseClient

            .from(
                'merchants'
            )

            .select(`
                id,
                merchant_name,
                service_area_id,
                status
            `)

            .in(
                'id',
                merchantIds
            );


        if (error) {
            throw error;
        }


        merchants =
            data || [];
    }


    const productMap =
        new Map(
            products.map(
                item => [
                    item.id,
                    item
                ]
            )
        );


    const merchantMap =
        new Map(
            merchants.map(
                item => [
                    item.id,
                    item
                ]
            )
        );


    const validRules =
        projectRules.filter(
            rule => {

                const product =
                    productMap.get(
                        rule.product_id
                    );

                const merchant =
                    merchantMap.get(
                        rule.merchant_id
                    );


                return (
                    product
                    &&
                    merchant
                    &&
                    product.status ===
                    'active'
                    &&
                    merchant.status ===
                    'active'
                );
            }
        );


    const serviceAreaIds =
        [
            ...new Set(
                validRules
                    .map(
                        rule =>
                            merchantMap
                                .get(
                                    rule.merchant_id
                                )
                                ?.service_area_id
                    )
                    .filter(Boolean)
            )
        ];


    let areaMap =
        new Map();


    let rawAreas =
        [];


    if (
        serviceAreaIds.length >
        0
    ) {

        const {
            data:areas,
            error:areaError
        } =
        await supabaseClient

            .from(
                'service_areas'
            )

            .select(`
                id,
                province_id,
                city_id,
                district_id
            `)

            .in(
                'id',
                serviceAreaIds
            );


        if (areaError) {
            throw areaError;
        }


        rawAreas =
            areas || [];


        const provinceIds =
            [
                ...new Set(
                    rawAreas
                        .map(
                            item =>
                                item.province_id
                        )
                        .filter(Boolean)
                )
            ];


        const cityIds =
            [
                ...new Set(
                    rawAreas
                        .map(
                            item =>
                                item.city_id
                        )
                        .filter(Boolean)
                )
            ];


        const districtIds =
            [
                ...new Set(
                    rawAreas
                        .map(
                            item =>
                                item.district_id
                        )
                        .filter(Boolean)
                )
            ];


        let provinces =
            [];

        let cities =
            [];

        let districts =
            [];


        if (
            provinceIds.length >
            0
        ) {

            const {
                data
            } =
            await supabaseClient

                .from(
                    'provinces'
                )

                .select(`
                    id,
                    province_name
                `)

                .in(
                    'id',
                    provinceIds
                );


            provinces =
                data || [];
        }


        if (
            cityIds.length >
            0
        ) {

            const {
                data
            } =
            await supabaseClient

                .from(
                    'cities'
                )

                .select(`
                    id,
                    city_name
                `)

                .in(
                    'id',
                    cityIds
                );


            cities =
                data || [];
        }


        if (
            districtIds.length >
            0
        ) {

            const {
                data
            } =
            await supabaseClient

                .from(
                    'districts'
                )

                .select(`
                    id,
                    district_name
                `)

                .in(
                    'id',
                    districtIds
                );


            districts =
                data || [];
        }


        const provinceMap =
            new Map(
                provinces.map(
                    item => [
                        item.id,
                        item.province_name
                    ]
                )
            );


        const cityMap =
            new Map(
                cities.map(
                    item => [
                        item.id,
                        item.city_name
                    ]
                )
            );


        const districtMap =
            new Map(
                districts.map(
                    item => [
                        item.id,
                        item.district_name
                    ]
                )
            );


        areaMap =
            new Map(
                rawAreas.map(
                    area => {

                        const parts =
                            [];


                        if (
                            provinceMap.get(
                                area.province_id
                            )
                        ) {

                            parts.push(
                                provinceMap.get(
                                    area.province_id
                                )
                            );
                        }


                        if (
                            cityMap.get(
                                area.city_id
                            )
                        ) {

                            parts.push(
                                cityMap.get(
                                    area.city_id
                                )
                            );
                        }


                        if (
                            districtMap.get(
                                area.district_id
                            )
                        ) {

                            parts.push(
                                districtMap.get(
                                    area.district_id
                                )
                            );
                        }


                        return [
                            area.id,
                            parts.join(
                                ' · '
                            )
                            ||
                            '未设置'
                        ];
                    }
                )
            );
    }


    const rawAreaMap =
        new Map(
            rawAreas.map(
                item => [
                    item.id,
                    item
                ]
            )
        );


    const finalRows =
        [];


    for (
        const rule
        of validRules
    ) {

        const product =
            productMap.get(
                rule.product_id
            );


        const merchant =
            merchantMap.get(
                rule.merchant_id
            );


        const area =
            rawAreaMap.get(
                merchant
                    ?.service_area_id
            );


        let price =
            null;


        if (
            area?.city_id
        ) {

            const {
                data:priceData,
                error:priceError
            } =
            await supabaseClient

                .from(
                    'city_prices'
                )

                .select(`
                    price
                `)

                .eq(
                    'city_id',
                    area.city_id
                )

                .eq(
                    'product_id',
                    rule.product_id
                )

                .eq(
                    'status',
                    'active'
                )

                .maybeSingle();


            if (
                priceError
            ) {

                console.error(
                    '读取城市价格失败：',
                    priceError
                );
            }


            price =
                priceData?.price
                ??
                null;
        }


        finalRows.push({

            rule_id:
                rule.id,

            product_id:
                rule.product_id,

            product_code:
                product
                    ?.product_code
                ||
                '',

            product_name:
                product
                    ?.product_name
                ||
                '未命名项目',

            merchant_id:
                rule.merchant_id,

            merchant_name:
                merchant
                    ?.merchant_name
                ||
                '未命名商户',

            service_area:
                areaMap.get(
                    merchant
                        ?.service_area_id
                )
                ||
                '未设置',

            price:
                price,

            health_consultant_ratio:
                rule
                    .health_consultant_ratio,

            version_no:
                rule.version_no

        });
    }


    renderProjects(
        finalRows
    );
}

/* =========================================================
   10分钟无操作退出
========================================================= */

const IDLE_LIMIT =
    10 * 60 * 1000;


let idleTimer =
    null;


function resetIdleTimer() {

    if (
        idleTimer
    ) {

        clearTimeout(
            idleTimer
        );
    }


    idleTimer =
        setTimeout(

            async function() {

                await forceLogout();

            },

            IDLE_LIMIT

        );
}


[
    'click',
    'touchstart',
    'keydown',
    'scroll',
    'mousemove'
]
.forEach(
    eventName => {

        document.addEventListener(
            eventName,
            resetIdleTimer,
            {
                passive:true
            }
        );
    }
);


resetIdleTimer();

            event,
            session
        ) => {

            if (
                event ===
                'SIGNED_OUT'
            ) {

                window.location.replace(
                    LOGIN_PAGE
                );
            }
        }

    );


/* =========================================================
   启动
========================================================= */

initialize();

</script>
