<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>投诉处理 - 孕乃馨</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #fff9fb;
    color: #44383d;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

button {
    font: inherit;
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* ============================================================
   页面
============================================================ */

.page {
    min-height: 100vh;
}

.container {
    width: calc(100% - 32px);
    max-width: 1000px;
    margin: 0 auto;
}


/* ============================================================
   顶栏
============================================================ */

.topbar {
    height: 74px;

    position: sticky;
    top: 0;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,.96);

    border-bottom: 1px solid #f3e3e8;

    backdrop-filter: blur(14px);
}

.top-title {
    text-align: center;
}

.top-title-main {
    font-size: 18px;
    font-weight: 900;
    color: #4d3d43;
}

.top-title-sub {
    margin-top: 4px;
    font-size: 10px;
    color: #ad949d;
}

.top-btn {
    width: 44px;
    height: 44px;

    position: absolute;
    top: 15px;

    border: none;
    border-radius: 15px;

    background: #fff2f6;
    color: #db5b83;

    font-size: 22px;
    font-weight: 900;
}

.back-btn {
    left: 16px;
}

.refresh-btn {
    right: 16px;
}


/* ============================================================
   主区域
============================================================ */

.main {
    padding: 20px 0 60px;
}


/* ============================================================
   红色报警总卡
============================================================ */

.alert-card {
    position: relative;
    overflow: hidden;

    min-height: 116px;
    padding: 22px;

    border-radius: 21px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #df1838,
            #f33852
        );

    box-shadow:
        0 12px 32px
        rgba(211, 30, 60, .20);
}

.alert-card::after {
    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    right: -40px;
    top: -55px;

    border-radius: 50%;

    background: rgba(255,255,255,.13);
}

.alert-title {
    position: relative;
    z-index: 2;

    font-size: 13px;
    font-weight: 900;
}

.alert-number-row {
    position: relative;
    z-index: 2;

    margin-top: 8px;

    display: flex;
    align-items: baseline;
    gap: 8px;
}

.alert-number {
    font-size: 31px;
    line-height: 1;
    font-weight: 900;
}

.alert-unit {
    font-size: 12px;
    font-weight: 900;
}

.alert-desc {
    position: relative;
    z-index: 2;

    margin-top: 10px;

    font-size: 11px;
    line-height: 1.5;
    font-weight: 700;
}


/* ============================================================
   统计
============================================================ */

.stats {
    margin-top: 13px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 11px;
}

.stat-card {
    min-height: 70px;
    padding: 13px 15px;

    border: 1px solid #f3e4e9;
    border-radius: 16px;

    background: white;

    box-shadow:
        0 5px 17px
        rgba(75, 50, 60, .04);
}

.stat-label {
    font-size: 10px;
    color: #aa949c;
}

.stat-value {
    margin-top: 7px;

    font-size: 20px;
    line-height: 1;

    font-weight: 900;
}

.stat-platform {
    color: #e02a49;
}

.stat-merchant {
    color: #e88a12;
}

.stat-done {
    color: #1e9568;
}


/* ============================================================
   投诉记录标题
============================================================ */

.section-head {
    margin-top: 26px;
    margin-bottom: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.section-title {
    font-size: 17px;
    font-weight: 900;
    color: #45373d;
}


/* ============================================================
   筛选
============================================================ */

.filters {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.filter-btn {
    min-height: 38px;
    padding: 7px 15px;

    border: 1px solid #eee0e5;
    border-radius: 12px;

    background: white;
    color: #69585f;

    font-size: 11px;
    font-weight: 800;
}

.filter-btn.active {
    border-color: #ec5b88;
    background: #eb5a88;
    color: white;
}


/* ============================================================
   投诉列表
============================================================ */

.complaint-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}


/* ============================================================
   投诉卡
============================================================ */

.complaint-card {
    padding: 16px;

    border: 1px solid #ffb8c3;
    border-radius: 20px;

    background: white;

    box-shadow:
        0 7px 23px
        rgba(110, 55, 70, .055);
}

.complaint-card.resolved {
    border-color: #dcebe5;
}

.card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;

    padding-bottom: 13px;

    border-bottom: 1px solid #f5e7ec;
}

.merchant-name {
    font-size: 17px;
    line-height: 1.4;
    font-weight: 900;
    color: #49383f;
}

.order-no {
    margin-top: 4px;

    font-size: 10px;
    color: #ad969e;

    word-break: break-all;
}

.status-badge {
    flex-shrink: 0;

    min-height: 29px;
    padding: 6px 11px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 999px;

    font-size: 10px;
    font-weight: 900;
}

.status-platform {
    background: #fff0f3;
    color: #e32e4e;
}

.status-merchant {
    background: #fff6e8;
    color: #d78313;
}

.status-resolved {
    background: #eaf8f2;
    color: #27805d;
}


/* ============================================================
   地区突出栏
============================================================ */

.region-bar {
    margin-top: 12px;
    padding: 10px 12px;

    border-radius: 13px;

    display: flex;
    align-items: center;
    gap: 8px;

    background:
        linear-gradient(
            135deg,
            #fff0f5,
            #fff7f9
        );

    color: #bd4f73;

    font-size: 11px;
    font-weight: 900;
}

.region-icon {
    font-size: 16px;
}


/* ============================================================
   信息网格
============================================================ */

.info-grid {
    margin-top: 11px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 8px;
}

.info-box {
    min-height: 55px;
    padding: 9px 11px;

    border-radius: 12px;

    background: #fffafb;
}

.info-label {
    font-size: 9px;
    color: #ad969e;
}

.info-value {
    margin-top: 5px;

    font-size: 11px;
    line-height: 1.45;

    font-weight: 900;
    color: #55434a;

    word-break: break-word;
}


/* ============================================================
   投诉人 / 商户联系人
============================================================ */

.people-grid {
    margin-top: 8px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.person-card {
    padding: 12px;

    border-radius: 13px;
}

.customer-card {
    background: #fff6f8;
}

.merchant-card {
    background: #fff9f2;
}

.person-title {
    font-size: 10px;
    font-weight: 900;
}

.customer-card .person-title {
    color: #d65076;
}

.merchant-card .person-title {
    color: #c97a18;
}

.person-name {
    margin-top: 7px;

    font-size: 13px;
    font-weight: 900;
    color: #4f3d44;
}

.person-phone {
    margin-top: 5px;

    font-size: 11px;
    font-weight: 800;
    color: #6d565f;

    word-break: break-all;
}


/* ============================================================
   投诉内容
============================================================ */

.content-box {
    margin-top: 11px;
    padding: 13px;

    min-height: 90px;

    border: 1px solid #f7d8df;
    border-radius: 14px;

    background: #fff7f9;
}

.content-title {
    font-size: 10px;
    font-weight: 900;
    color: #c95470;
}

.content-text {
    margin-top: 16px;
    padding-left: 44px;

    font-size: 12px;
    line-height: 1.7;

    color: #564148;

    white-space: pre-wrap;
    word-break: break-word;
}


/* ============================================================
   双方确认状态
============================================================ */

.confirm-grid {
    margin-top: 10px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.confirm-box {
    min-height: 36px;
    padding: 9px 11px;

    display: flex;
    align-items: center;

    border-radius: 11px;

    font-size: 10px;
    font-weight: 800;
}

.confirm-no {
    background: #fff0f2;
    color: #d6314d;
}

.confirm-yes {
    background: #eaf8f2;
    color: #24805c;
}


/* ============================================================
   操作
============================================================ */

.actions {
    margin-top: 11px;

    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.action-btn {
    min-height: 42px;
    padding: 8px 15px;

    border-radius: 12px;

    font-size: 11px;
    font-weight: 900;
}

.image-btn {
    border: 1px solid #f0d5dd;

    background: white;
    color: #cf5579;
}

.confirm-btn {
    border: none;

    background:
        linear-gradient(
            135deg,
            #dc1d3e,
            #c91434
        );

    color: white;
}

.confirm-btn:disabled {
    opacity: .45;
}


/* ============================================================
   空
============================================================ */

.empty {
    padding: 45px 20px;

    border: 1px solid #f1e4e8;
    border-radius: 20px;

    background: white;

    text-align: center;
}

.empty-icon {
    font-size: 38px;
}

.empty-title {
    margin-top: 10px;

    font-size: 15px;
    font-weight: 900;
}

.empty-text {
    margin-top: 6px;

    font-size: 11px;
    color: #a88f98;
}


/* ============================================================
   图片弹窗
============================================================ */

.modal-mask {
    position: fixed;
    inset: 0;

    z-index: 1000;

    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(47, 35, 40, .60);

    backdrop-filter: blur(5px);
}

.modal {
    width: 100%;
    max-width: 620px;
    max-height: 88vh;

    overflow-y: auto;

    padding: 20px;

    border-radius: 22px;

    background: white;
}

.modal-title {
    font-size: 18px;
    font-weight: 900;
    color: #49383f;
}

.modal-sub {
    margin-top: 5px;

    font-size: 10px;
    color: #aa929b;
}

.images-grid {
    margin-top: 16px;

    display: grid;
    grid-template-columns: repeat(2, 1fr);

    gap: 10px;
}

.image-item {
    overflow: hidden;

    aspect-ratio: 1 / 1;

    border-radius: 14px;

    background: #f6f1f3;
}

.image-item img {
    width: 100%;
    height: 100%;

    display: block;
    object-fit: cover;
}

.no-images {
    grid-column: 1 / -1;

    padding: 30px 10px;

    text-align: center;

    color: #a58b94;
    font-size: 11px;
}

.close-btn {
    width: 100%;
    min-height: 45px;

    margin-top: 16px;

    border: none;
    border-radius: 13px;

    background: #fff0f5;
    color: #d6537c;

    font-weight: 900;
}


/* ============================================================
   Loading
============================================================ */

.loading-mask {
    position: fixed;
    inset: 0;

    z-index: 5000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff9fb;
}

.loading-inner {
    text-align: center;
}

.loading-icon {
    font-size: 40px;
}

.loading-text {
    margin-top: 9px;

    color: #a88e97;
    font-size: 11px;
}


/* ============================================================
   Toast
============================================================ */

.toast {
    position: fixed;

    left: 50%;
    bottom: 35px;

    z-index: 9999;

    max-width: calc(100vw - 40px);

    padding: 11px 16px;

    border-radius: 12px;

    background: rgba(57,45,50,.95);
    color: white;

    font-size: 11px;

    opacity: 0;
    pointer-events: none;

    transform: translate(-50%, 15px);

    transition: .2s;
}

.toast.show {
    opacity: 1;

    transform: translate(-50%, 0);
}


/* ============================================================
   手机
============================================================ */

@media (max-width: 700px) {

    .container {
        width: calc(100% - 22px);
    }

    .main {
        padding-top: 12px;
    }

    .stats {
        gap: 6px;
    }

    .stat-card {
        padding: 11px 9px;
    }

    .section-head {
        display: block;
    }

    .filters {
        margin-top: 10px;
        justify-content: flex-start;
    }

    .info-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .people-grid {
        grid-template-columns: 1fr;
    }

    .content-text {
        padding-left: 0;
        margin-top: 10px;
    }
}

</style>

</head>


<body>

<div
    id="loadingMask"
    class="loading-mask"
>

    <div class="loading-inner">

        <div class="loading-icon">
            🌸
        </div>

        <div class="loading-text">
            正在读取投诉信息...
        </div>

    </div>

</div>



<div class="page">

<header class="topbar">

    <button
        class="top-btn back-btn"
        type="button"
        onclick="goBack()"
    >
        ‹
    </button>


    <div class="top-title">

        <div class="top-title-main">
            投诉处理
        </div>

        <div class="top-title-sub">
            平台客户投诉管理中心
        </div>

    </div>


    <button
        class="top-btn refresh-btn"
        type="button"
        onclick="refreshPage()"
    >
        ↻
    </button>

</header>



<main class="main">

<div class="container">


    <!-- ======================================================
         报警总览
    ======================================================= -->

    <section class="alert-card">

        <div class="alert-title">
            平台待确认投诉
        </div>


        <div class="alert-number-row">

            <div
                id="alertCount"
                class="alert-number"
            >
                0
            </div>

            <div class="alert-unit">
                条
            </div>

        </div>


        <div class="alert-desc">
            平台确认和对应商户确认全部完成后，投诉报警自动结束。
        </div>

    </section>



    <!-- ======================================================
         统计
    ======================================================= -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                平台待确认
            </div>

            <div
                id="platformCount"
                class="stat-value stat-platform"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                等待商户
            </div>

            <div
                id="merchantCount"
                class="stat-value stat-merchant"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                已处理完成
            </div>

            <div
                id="resolvedCount"
                class="stat-value stat-done"
            >
                0
            </div>

        </div>

    </section>



    <!-- ======================================================
         投诉记录
    ======================================================= -->

    <section>

        <div class="section-head">

            <div class="section-title">
                投诉记录
            </div>


            <div class="filters">

                <button
                    id="filterPlatform"
                    class="filter-btn active"
                    type="button"
                    onclick="setFilter('platform')"
                >
                    待我确认
                </button>


                <button
                    id="filterMerchant"
                    class="filter-btn"
                    type="button"
                    onclick="setFilter('merchant')"
                >
                    等待商户
                </button>


                <button
                    id="filterResolved"
                    class="filter-btn"
                    type="button"
                    onclick="setFilter('resolved')"
                >
                    已完成
                </button>


                <button
                    id="filterAll"
                    class="filter-btn"
                    type="button"
                    onclick="setFilter('all')"
                >
                    全部
                </button>

            </div>

        </div>


        <div
            id="complaintList"
            class="complaint-list"
        ></div>

    </section>

</div>

</main>

</div>



<!-- ==========================================================
     投诉图片弹窗
=========================================================== -->

<div
    id="imageModal"
    class="modal-mask hidden"
    onclick="handleModalMask(event)"
>

    <div
        class="modal"
        onclick="event.stopPropagation()"
    >

        <div class="modal-title">
            投诉图片
        </div>

        <div
            id="modalOrderNo"
            class="modal-sub"
        >
            -
        </div>


        <div
            id="imagesGrid"
            class="images-grid"
        ></div>


        <button
            class="close-btn"
            type="button"
            onclick="closeImageModal()"
        >
            关闭
        </button>

    </div>

</div>



<div
    id="toast"
    class="toast"
></div>



<script>

/* ============================================================
   Supabase
============================================================ */

const SUPABASE_URL =
    "https://qbuqjwpkltbjhlfbyjyb.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";


const sb =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const COMPLAINT_BUCKET =
    "customer-complaints";


/* ============================================================
   全局
============================================================ */

let currentUser =
    null;


let complaints =
    [];


let currentFilter =
    "platform";


const IDLE_LIMIT =
    10 * 60 * 1000;


let idleTimer =
    null;


/* ============================================================
   初始化
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init() {

    try {

        setupIdleLogout();


        const {
            data,
            error
        } =
        await sb.auth.getSession();


        if (
            error
            ||
            !data?.session?.user
        ) {

            goLogin();

            return;
        }


        currentUser =
            data.session.user;


        await verifyPlatformAccess();


        await loadComplaints();


        hideLoading();


    } catch (error) {

        console.error(
            error
        );


        hideLoading();


        alert(
            error?.message
            ||
            "投诉处理页面加载失败"
        );
    }
}


/* ============================================================
   权限
============================================================ */

async function verifyPlatformAccess() {

    const {
        data,
        error
    } =
    await sb
        .from("profiles")
        .select(`
            id,
            role,
            status
        `)
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if (
        error
        ||
        !data
    ) {

        throw new Error(
            "无法确认平台账号权限"
        );
    }


    if (
        data.status
        !==
        "active"
    ) {

        throw new Error(
            "当前平台账号已失效"
        );
    }


    if (
        ![
            "founder",
            "platform_admin"
        ].includes(
            data.role
        )
    ) {

        alert(
            "当前账号没有投诉处理权限"
        );


        window.location.replace(
            "./wholemanagement.html"
        );


        throw new Error(
            "无投诉处理权限"
        );
    }
}


/* ============================================================
   读取投诉
============================================================ */

async function loadComplaints() {

    const {
        data,
        error
    } =
    await sb.rpc(
        "get_platform_complaints"
    );


    if (error) {

        console.error(
            "get_platform_complaints:",
            error
        );


        throw error;
    }


    complaints =
        Array.isArray(data)
        ?
        data
        :
        [];


    renderStats();

    renderComplaints();
}


/* ============================================================
   统计
============================================================ */

function renderStats() {

    const platformPending =
        complaints.filter(
            item =>
                item.complaint_status
                !==
                "resolved"

                &&

                item.platform_confirmed
                !==
                true
        ).length;


    const merchantPending =
        complaints.filter(
            item =>
                item.complaint_status
                !==
                "resolved"

                &&

                item.platform_confirmed
                ===
                true

                &&

                item.merchant_confirmed
                !==
                true
        ).length;


    const resolved =
        complaints.filter(
            item =>
                item.complaint_status
                ===
                "resolved"
        ).length;


    setText(
        "alertCount",
        platformPending
    );


    setText(
        "platformCount",
        platformPending
    );


    setText(
        "merchantCount",
        merchantPending
    );


    setText(
        "resolvedCount",
        resolved
    );
}


/* ============================================================
   筛选
============================================================ */

function setFilter(
    filter
) {

    currentFilter =
        filter;


    [
        "filterPlatform",
        "filterMerchant",
        "filterResolved",
        "filterAll"
    ]
    .forEach(
        id => {

            document
                .getElementById(id)
                .classList
                .remove(
                    "active"
                );
        }
    );


    const map = {

        platform:
            "filterPlatform",

        merchant:
            "filterMerchant",

        resolved:
            "filterResolved",

        all:
            "filterAll"

    };


    document
        .getElementById(
            map[filter]
        )
        .classList
        .add(
            "active"
        );


    renderComplaints();
}


function getFilteredComplaints() {

    switch (
        currentFilter
    ) {

        case "platform":

            return complaints.filter(
                item =>
                    item.complaint_status
                    !==
                    "resolved"

                    &&

                    item.platform_confirmed
                    !==
                    true
            );


        case "merchant":

            return complaints.filter(
                item =>
                    item.complaint_status
                    !==
                    "resolved"

                    &&

                    item.platform_confirmed
                    ===
                    true

                    &&

                    item.merchant_confirmed
                    !==
                    true
            );


        case "resolved":

            return complaints.filter(
                item =>
                    item.complaint_status
                    ===
                    "resolved"
            );


        default:

            return complaints;
    }
}


/* ============================================================
   投诉状态
============================================================ */

function getComplaintStatus(
    complaint
) {

    if (
        complaint.complaint_status
        ===
        "resolved"
    ) {

        return {
            text:
                "已处理完成",

            className:
                "status-resolved"
        };
    }


    if (
        complaint.platform_confirmed
        !==
        true
    ) {

        return {
            text:
                "平台待确认",

            className:
                "status-platform"
        };
    }


    if (
        complaint.merchant_confirmed
        !==
        true
    ) {

        return {
            text:
                "等待商户",

            className:
                "status-merchant"
        };
    }


    return {
        text:
            "处理中",

        className:
            "status-platform"
    };
}


/* ============================================================
   渲染投诉
============================================================ */

function renderComplaints() {

    const box =
        document.getElementById(
            "complaintList"
        );


    box.innerHTML =
        "";


    const list =
        getFilteredComplaints();


    if (!list.length) {

        box.innerHTML =
            `
            <div class="empty">

                <div class="empty-icon">
                    🌷
                </div>

                <div class="empty-title">
                    当前没有相关投诉
                </div>

                <div class="empty-text">
                    暂时没有符合当前筛选条件的投诉记录。
                </div>

            </div>
            `;

        return;
    }


    list.forEach(
        complaint => {

            box.appendChild(
                createComplaintCard(
                    complaint
                )
            );
        }
    );
}

/* ============================================================
   平台确认
============================================================ */

async function confirmPlatformComplaint(
    complaintId
) {

    const complaint =
        complaints.find(
            item =>
                Number(
                    item.complaint_id
                )
                ===
                Number(
                    complaintId
                )
        );


    if (!complaint) {

        toast(
            "没有找到投诉记录"
        );

        return;
    }


    if (
        complaint.platform_confirmed
    ) {

        toast(
            "平台已经确认过该投诉"
        );

        return;
    }


    let message =
        "确认平台已经收到并处理该客户投诉吗？";


    if (
        complaint.merchant_confirmed
    ) {

        message +=
            "\n\n商户已经确认。本次平台确认后，双方确认完成，该投诉报警将自动结束。";

    } else {

        message +=
            "\n\n商户尚未确认。平台确认后，该投诉仍会保留在“等待商户”中。";
    }


    const yes =
        window.confirm(
            message
        );


    if (!yes) {
        return;
    }


    try {

        const {
            data,
            error
        } =
        await sb.rpc(
            "confirm_complaint_by_platform",
            {
                p_complaint_id:
                    Number(
                        complaintId
                    )
            }
        );


        if (error) {
            throw error;
        }


        if (
            !data
            ||
            data.success
            !==
            true
        ) {

            throw new Error(
                data?.message
                ||
                "平台确认失败"
            );
        }


        alert(
            data.message
            ||
            "平台确认成功"
        );


        await loadComplaints();


    } catch (error) {

        console.error(
            "platform complaint confirm:",
            error
        );


        alert(
            "平台确认失败：\n\n"
            +
            (
                error?.message
                ||
                "未知错误"
            )
        );
    }
}

async function showComplaintImages(
    complaintId
) {

    const complaint =
        complaints.find(
            item =>
                Number(
                    item.complaint_id
                )
                ===
                Number(
                    complaintId
                )
        );


    if (!complaint) {

        toast(
            "没有找到投诉记录"
        );

        return;
    }


    setText(
        "modalOrderNo",
        `订单号：${
            complaint.order_no
            ||
            complaint.order_id
            ||
            "-"
        }`
    );


    const box =
        document.getElementById(
            "imagesGrid"
        );


    box.innerHTML =
        `
        <div class="no-images">
            正在读取投诉图片...
        </div>
        `;


    document
        .getElementById(
            "imageModal"
        )
        .classList
        .remove(
            "hidden"
        );


    document.body.style.overflow =
        "hidden";


    try {

        const rows =
            await getComplaintImageRows(
                complaintId
            );


        if (!rows.length) {

            box.innerHTML =
                `
                <div class="no-images">
                    客户没有上传投诉图片
                </div>
                `;

            return;
        }


        const urls =
            [];


        for (
            const row
            of rows
        ) {

            const {
                data,
                error
            } =
            await sb.storage
                .from(
                    COMPLAINT_BUCKET
                )
                .createSignedUrl(
                    row.storage_path,
                    600
                );


            if (
                !error
                &&
                data?.signedUrl
            ) {

                urls.push(
                    data.signedUrl
                );
            }
        }


        if (!urls.length) {

            box.innerHTML =
                `
                <div class="no-images">
                    暂时无法读取投诉图片
                </div>
                `;

            return;
        }


        box.innerHTML =
            urls
            .map(
                url =>
                    `
                    <div class="image-item">

                        <img
                            src="${escapeHtml(url)}"
                            alt="投诉图片"
                            onclick="openImage('${escapeJsString(url)}')"
                        >

                    </div>
                    `
            )
            .join("");


    } catch (error) {

        console.error(
            "complaint images:",
            error
        );


        box.innerHTML =
            `
            <div class="no-images">
                图片读取失败：
                ${escapeHtml(
                    error?.message
                    ||
                    "未知错误"
                )}
            </div>
            `;
    }
}


/* ============================================================
   获取图片记录

   优先调用平台专用RPC。
   如果此前complains页面使用的是其他同名读取函数，
   下面也做了兼容。
============================================================ */

async function getComplaintImageRows(
    complaintId
) {

    const rpcNames = [
        "get_platform_complaint_images",
        "get_complaint_images"
    ];


    let lastError =
        null;


    for (
        const rpcName
        of rpcNames
    ) {

        const {
            data,
            error
        } =
        await sb.rpc(
            rpcName,
            {
                p_complaint_id:
                    Number(
                        complaintId
                    )
            }
        );


        if (!error) {

            return Array.isArray(data)
                ?
                data
                :
                [];
        }


        lastError =
            error;


        const message =
            String(
                error.message
                ||
                ""
            );


        if (
            !message.includes(
                "Could not find the function"
            )

            &&

            !message.includes(
                "does not exist"
            )
        ) {

            throw error;
        }
    }


    /*
       最后的兼容方案：
       如果数据库已有允许平台读取
       customer_complaint_images 的 RLS，
       则直接读取。
    */

    const {
        data,
        error
    } =
    await sb
        .from(
            "customer_complaint_images"
        )
        .select(`
            id,
            complaint_id,
            storage_path,
            created_at
        `)
        .eq(
            "complaint_id",
            Number(
                complaintId
            )
        )
        .order(
            "id",
            {
                ascending:
                    true
            }
        );


    if (error) {

        throw (
            lastError
            ||
            error
        );
    }


    return data
        ||
        [];
}

/* ============================================================
   10分钟无操作退出
============================================================ */

function setupIdleLogout() {

    const events = [
        "click",
        "touchstart",
        "touchmove",
        "keydown",
        "scroll"
    ];


    events.forEach(
        eventName => {

            document.addEventListener(
                eventName,
                resetIdleTimer,
                {
                    passive:
                        true
                }
            );
        }
    );


    resetIdleTimer();
}


function resetIdleTimer() {

    if (
        idleTimer
    ) {

        clearTimeout(
            idleTimer
        );
    }


    idleTimer =
        setTimeout(
            logoutByIdle,
            IDLE_LIMIT
        );
}


async function logoutByIdle() {

    try {

        await sb.auth.signOut();

    } catch (error) {

        console.error(
            error
        );

    } finally {

        window.location.replace(
            "./login.html?reason=idle"
        );
    }
}

/* ============================================================
   工具
============================================================ */

function setText(
    id,
    value
) {

    const el =
        document.getElementById(
            id
        );


    if (!el) {
        return;
    }


    el.textContent =
        (
            value === null
            ||
            value === undefined
            ||
            value === ""
        )
        ?
        "-"
        :
        String(value);
}


function formatDateTime(
    value
) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            value
        );
    }


    return date.toLocaleString(
        "zh-CN",
        {
            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false
        }
    );
}


function escapeHtml(
    value
) {

    return String(
        value
        ??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


function escapeJsString(
    value
) {

    return String(
        value
        ??
        ""
    )
    .replaceAll(
        "\\",
        "\\\\"
    )
    .replaceAll(
        "'",
        "\\'"
    )
    .replaceAll(
        "\n",
        ""
    )
    .replaceAll(
        "\r",
        ""
    );
}


function toast(
    message
) {

    const el =
        document.getElementById(
            "toast"
        );


    el.textContent =
        message;


    el.classList.add(
        "show"
    );


    clearTimeout(
        toast.timer
    );


    toast.timer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            2200
        );
}


function hideLoading() {

    const mask =
        document.getElementById(
            "loadingMask"
        );


    if (!mask) {
        return;
    }


    mask.style.opacity =
        "0";


    mask.style.transition =
        "opacity .2s";


    setTimeout(
        () => {

            mask.style.display =
                "none";

        },
        220
    );
}
