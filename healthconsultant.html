<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff6f9">
<title>健康顾问工作台 - 孕乃馨</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink-50:#fff6f9;--pink-100:#ffe8f0;--pink-200:#fbd2e0;--pink-500:#e85d8f;--pink-600:#d94d7d;--pink-700:#b93667;--purple:#8b49bc;--green:#278f67;--orange:#d9821b;--red:#dc304b;--text:#302830;--sub:#746a71;--light:#a49aa1;--border:#eee2e7;--shadow:0 10px 32px rgba(120,47,78,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scroll-behavior:smooth}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(180deg,#fff9fb,#faf8f9 50%,#f7f7f9);color:var(--text);font-size:15px;line-height:1.6}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
.loading-mask{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8fb}.spinner{width:42px;height:42px;border:4px solid var(--pink-100);border-top-color:var(--pink-500);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:13px;color:var(--sub)}
.topbar{min-height:72px;position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-bottom:1px solid rgba(232,93,143,.1)}
.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand-logo{width:44px;height:44px;flex:0 0 44px;border-radius:13px;object-fit:contain;background:#fff;box-shadow:0 6px 18px rgba(186,63,110,.12)}.brand-title{font-size:19px;font-weight:800;letter-spacing:1px}.brand-subtitle{font-size:11px;color:var(--light);margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px}.top-identity{text-align:right;margin-right:5px}.top-name{font-size:14px;font-weight:750}.top-number{font-size:11px;color:var(--pink-600)}.outline-btn,.logout-btn{min-height:44px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:700}.outline-btn{border:1px solid var(--pink-200);background:#fff;color:var(--pink-700)}.logout-btn{border:0;background:linear-gradient(135deg,var(--pink-500),var(--pink-600));color:#fff}
.page{width:100%;max-width:1380px;margin:0 auto;padding:28px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 30px;margin-bottom:20px;border-radius:24px;background:linear-gradient(135deg,#fff0f5,#ffe2ec 55%,#ffd5e5);box-shadow:var(--shadow)}.hero::after{content:"";position:absolute;width:190px;height:190px;right:-45px;top:-70px;border-radius:50%;background:rgba(255,255,255,.35)}.hero-content{position:relative;z-index:1}.hero-tag{display:inline-flex;padding:4px 11px;margin-bottom:10px;border-radius:999px;background:rgba(255,255,255,.75);color:var(--pink-700);font-size:11px;font-weight:800}.hero h1{font-size:27px;color:#65314a;margin-bottom:7px}.hero p{font-size:13px;color:#8b5269}.hero-id{position:relative;z-index:1;min-width:180px;padding:15px 18px;border-radius:17px;background:rgba(255,255,255,.72);text-align:center}.hero-id-label{font-size:11px;color:#987b87}.hero-id-value{margin-top:4px;font-size:25px;font-weight:900;letter-spacing:2px;color:var(--pink-700)}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.summary-card{min-height:112px;padding:19px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 5px 18px rgba(80,43,59,.03)}.summary-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;border-radius:11px;background:var(--pink-50);font-size:18px}.summary-label{font-size:11px;color:var(--light)}.summary-value{margin-top:3px;font-size:21px;font-weight:850;color:#5d3548}.summary-value.small{font-size:14px;word-break:break-all}
.panel{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 22px;border-bottom:1px solid var(--border)}.panel-title{font-size:18px;font-weight:800}.panel-hint{font-size:12px;color:var(--light)}
.filters{display:grid;grid-template-columns:minmax(220px,1fr) 190px 120px;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);background:#fffafb}.control{width:100%;height:46px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:0 13px;color:var(--text);outline:none}.control:focus{border-color:var(--pink-300);box-shadow:0 0 0 3px rgba(232,93,143,.09)}.refresh-btn{height:46px;border:0;border-radius:12px;background:var(--pink-100);color:var(--pink-700);font-weight:750}
.order-list{padding:18px}.empty{padding:60px 20px;text-align:center;color:var(--light)}.empty-icon{font-size:38px;margin-bottom:8px}
.order-card{margin-bottom:14px;border:1px solid var(--border);border-radius:17px;overflow:hidden;background:#fff}.order-card:last-child{margin-bottom:0}.order-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 17px;background:#fffafb;border-bottom:1px solid #f3e9ed}.order-number{font-size:14px;font-weight:800;color:#65364b}.order-date{margin-top:2px;font-size:11px;color:var(--light)}.status{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}.status-green{background:#eaf8f2;color:#247b5a}.status-orange{background:#fff3df;color:#a9620c}.status-red{background:#fff0f2;color:#bd2940}.status-gray{background:#f2eff1;color:#71666d}.status-purple{background:#f4eafb;color:#813eac}
.order-body{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;padding:17px}.items{min-width:0}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;padding:11px 0;border-bottom:1px dashed #eee3e8}.item:first-child{padding-top:0}.item:last-child{border-bottom:0;padding-bottom:0}.item-name{font-size:13px;font-weight:700}.item-meta{margin-top:3px;font-size:11px;color:var(--light)}.item-amount{text-align:right;font-size:13px;font-weight:750;white-space:nowrap}
.split-box{padding:15px;border-radius:14px;background:linear-gradient(135deg,#fff4f8,#fffafb);border:1px solid #f3dbe4}.split-title{font-size:12px;color:#987381;margin-bottom:10px}.split-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;font-size:12px}.split-row strong{color:#60404e}.split-amount{margin-top:12px;padding-top:11px;border-top:1px solid #efdde4;display:flex;align-items:flex-end;justify-content:space-between}.split-amount span{font-size:11px;color:#9b7b88}.split-amount strong{font-size:22px;color:var(--pink-700)}
.password-mask{display:none;position:fixed;inset:0;z-index:7000;padding:18px;background:rgba(31,21,27,.65);align-items:center;justify-content:center}.password-mask.show{display:flex}.password-modal{width:min(500px,100%);max-height:94vh;overflow:auto;padding:25px;background:#fff;border-radius:20px;box-shadow:0 25px 80px rgba(0,0,0,.3)}.password-icon{width:54px;height:54px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pink-100);font-size:25px}.password-title{text-align:center;font-size:20px;font-weight:850;color:#69344d}.password-desc{text-align:center;margin:7px 0 20px;font-size:13px;color:var(--sub);line-height:1.7}.password-warning{margin-bottom:16px;padding:12px 14px;border-radius:11px;background:#fff3e2;color:#a25c0b;font-size:12px}.form-group{margin-bottom:15px}.form-label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#6c515d}.password-wrap{position:relative}.password-input{width:100%;height:51px;padding:0 72px 0 14px;border:1px solid #e9d9df;border-radius:12px;outline:none}.password-input:focus{border-color:var(--pink-500);box-shadow:0 0 0 3px rgba(232,93,143,.1)}.show-password{position:absolute;right:8px;top:6px;height:39px;padding:0 10px;border:0;background:transparent;color:var(--pink-700)}.password-rule{margin-top:5px;font-size:11px;color:var(--light)}.password-error{display:none;margin-bottom:13px;padding:10px 12px;border-radius:10px;background:#fff0f2;color:#bd2940;font-size:12px}.password-error.show{display:block}.password-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.password-actions.force{grid-template-columns:1fr}.cancel-password,.save-password{height:47px;border:0;border-radius:12px;font-weight:800}.cancel-password{background:#f3eef1;color:#73636a}.save-password{background:linear-gradient(135deg,var(--pink-500),var(--pink-600));color:#fff}.save-password:disabled{opacity:.55}
.toast{position:fixed;left:50%;bottom:28px;z-index:9000;transform:translate(-50%,30px);max-width:min(440px,calc(100% - 30px));padding:12px 18px;border-radius:12px;background:#3e3036;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.order-body{grid-template-columns:1fr}.split-box{margin-top:2px}}
@media(max-width:700px){body{padding-bottom:10px}.topbar{min-height:64px;padding:5px 12px}.brand-logo{width:39px;height:39px;flex-basis:39px}.brand-title{font-size:16px}.brand-subtitle,.top-identity,.outline-btn{display:none}.logout-btn{min-height:43px;padding:0 14px}.page{padding:14px 12px}.hero{display:block;padding:22px 19px;border-radius:19px}.hero h1{font-size:21px}.hero-id{margin-top:15px;min-width:0;text-align:left}.hero-id-value{font-size:21px}.summary-grid{gap:9px}.summary-card{padding:14px;min-height:105px}.summary-value{font-size:17px}.panel-head{padding:16px}.panel-hint{display:none}.filters{grid-template-columns:1fr;padding:12px}.order-list{padding:11px}.order-head{align-items:flex-start}.order-body{padding:14px}.password-modal{padding:20px}.password-actions{grid-template-columns:1fr}.password-actions.force{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loadingMask" class="loading-mask"><div class="spinner"></div><div class="loading-text">正在验证健康顾问账户...</div></div>

<header class="topbar">
<div class="brand">
<img src="./logo.jpeg" class="brand-logo" alt="孕乃馨 Logo">
<div><div class="brand-title">孕乃馨健康顾问</div><div class="brand-subtitle">HEALTH CONSULTANT CENTER</div></div>
</div>
<div class="top-actions">
<div class="top-identity"><div id="topName" class="top-name">-</div><div id="topNumber" class="top-number">系统ID：-</div></div>
<button class="outline-btn" type="button" onclick="openPasswordModal(false)">修改密码</button>
<button class="logout-btn" type="button" onclick="logout()">退出登录</button>
</div>
</header>

<main class="page">
<section class="hero">
<div class="hero-content"><div class="hero-tag">HEALTH CONSULTANT</div><h1 id="welcomeTitle">欢迎进入健康顾问工作台</h1><p>查看与您相关的订单及本人分账信息。</p></div>
<div class="hero-id"><div class="hero-id-label">永久健康顾问系统ID</div><div id="heroNumber" class="hero-id-value">-</div></div>
</section>

<section class="summary-grid">
<div class="summary-card"><div class="summary-icon">🧾</div><div class="summary-label">相关订单总数</div><div id="totalOrders" class="summary-value">0</div></div>
<div class="summary-card"><div class="summary-icon">💰</div><div class="summary-label">本人分账金额合计</div><div id="totalAmount" class="summary-value">¥0.00</div></div>
<div class="summary-card"><div class="summary-icon">⏳</div><div class="summary-label">待完成分账</div><div id="pendingCount" class="summary-value">0</div></div>
<div class="summary-card"><div class="summary-icon">📱</div><div class="summary-label">绑定手机号</div><div id="consultantPhone" class="summary-value small">-</div></div>
</section>

<section class="panel">
<div class="panel-head"><div class="panel-title">我的相关订单</div><div class="panel-hint">仅显示您本人作为分账方参与的订单</div></div>
<div class="filters">
<input id="searchInput" class="control" type="search" placeholder="搜索订单号或项目名称">
<select id="statusFilter" class="control">
<option value="">全部分账状态</option>
<option value="pending">待处理</option>
<option value="processing">处理中</option>
<option value="completed">已完成</option>
<option value="success">成功</option>
<option value="failed">失败</option>
</select>
<button class="refresh-btn" type="button" onclick="loadDashboard(true)">刷新数据</button>
</div>
<div id="orderList" class="order-list"><div class="empty"><div class="empty-icon">🧾</div>正在读取订单...</div></div>
</section>
</main>

<div id="passwordMask" class="password-mask">
<div class="password-modal">
<div class="password-icon">🔐</div>
<div id="passwordTitle" class="password-title">修改登录密码</div>
<div id="passwordDesc" class="password-desc">请设置新的健康顾问登录密码。</div>
<div id="firstLoginWarning" class="password-warning hidden">您正在使用系统初始密码。首次登录必须设置新密码，修改完成前不能进入工作台。</div>
<div class="form-group">
<label class="form-label" for="newPassword">新密码</label>
<div class="password-wrap">
<input id="newPassword" class="password-input" type="password" autocomplete="new-password" maxlength="72" placeholder="请输入新密码">
<button class="show-password" type="button" onclick="togglePassword('newPassword',this)">显示</button>
</div>
<div class="password-rule">至少8位，必须同时包含字母和数字，不能继续使用12345678。</div>
</div>
<div class="form-group">
<label class="form-label" for="confirmPassword">再次输入新密码</label>
<div class="password-wrap">
<input id="confirmPassword" class="password-input" type="password" autocomplete="new-password" maxlength="72" placeholder="请再次输入新密码">
<button class="show-password" type="button" onclick="togglePassword('confirmPassword',this)">显示</button>
</div>
</div>
<div id="passwordError" class="password-error"></div>
<div id="passwordActions" class="password-actions">
<button id="cancelPasswordButton" class="cancel-password" type="button" onclick="closePasswordModal()">取消</button>
<button id="savePasswordButton" class="save-password" type="button" onclick="saveNewPassword()">确认修改密码</button>
</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://qbuqjwpkltbjhlfbyjyb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";
const LOGIN_PAGE="./login.html";
const IDLE_LIMIT=10*60*1000;
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let idleTimer=null;
let dashboardData=null;
let allOrders=[];
let passwordForced=false;
let toastTimer=null;

function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function money(value){return new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",minimumFractionDigits:2}).format(Number(value)||0)}
function dateTime(value){if(!value)return"—";const date=new Date(value);return Number.isNaN(date.getTime())?"—":date.toLocaleString("zh-CN",{hour12:false})}
function resetIdleTimer(){clearTimeout(idleTimer);idleTimer=setTimeout(autoLogout,IDLE_LIMIT)}
async function autoLogout(){try{await supabaseClient.auth.signOut()}catch(error){console.error(error)}alert("由于10分钟未操作，系统已自动退出。");window.location.replace(LOGIN_PAGE)}
["mousemove","mousedown","keydown","touchstart","scroll","click"].forEach(name=>document.addEventListener(name,resetIdleTimer,{passive:true}));

function showToast(message){
const toast=document.getElementById("toast");
clearTimeout(toastTimer);
toast.textContent=message;
toast.classList.add("show");
toastTimer=setTimeout(()=>toast.classList.remove("show"),2600);
}
function statusInfo(status){
const value=String(status||"").toLowerCase();
if(["completed","success","executed","paid"].includes(value))return{text:"已完成",className:"status-green"};
if(["pending","created","waiting","unpaid"].includes(value))return{text:"待处理",className:"status-orange"};
if(["processing","splitting","in_progress"].includes(value))return{text:"处理中",className:"status-purple"};
if(["failed","rejected","cancelled","canceled"].includes(value))return{text:"失败/取消",className:"status-red"};
return{text:status||"未定义",className:"status-gray"};
}

async function initialize(){
resetIdleTimer();
try{
const{data:{session},error}=await supabaseClient.auth.getSession();
if(error||!session){window.location.replace(LOGIN_PAGE);return}
await loadDashboard(false);
document.getElementById("loadingMask").style.display="none";
}catch(error){
console.error("健康顾问工作台初始化失败：",error);
try{await supabaseClient.auth.signOut()}catch(e){console.error(e)}
alert(error.message||"当前账号没有健康顾问工作台访问权限。");
window.location.replace(LOGIN_PAGE);
}
}

async function loadDashboard(showSuccess){
const{data,error}=await supabaseClient.rpc("get_my_health_consultant_dashboard");
if(error)throw error;
if(!data?.success)throw new Error(data?.message||"健康顾问数据读取失败");
dashboardData=data;
allOrders=Array.isArray(data.orders)?data.orders:[];
renderProfile(data);
renderOrders();
if(data.consultant?.must_change_password===true){
openPasswordModal(true);
}else if(showSuccess){
showToast("数据已刷新");
}
}

function renderProfile(data){
const consultant=data.consultant||{};
const summary=data.summary||{};
document.getElementById("topName").textContent=consultant.consultant_name||"健康顾问";
document.getElementById("topNumber").textContent=`系统ID：${consultant.consultant_no||"-"}`;
document.getElementById("welcomeTitle").textContent=`欢迎回来，${consultant.consultant_name||"健康顾问"}`;
document.getElementById("heroNumber").textContent=consultant.consultant_no||"-";
document.getElementById("totalOrders").textContent=Number(summary.total_orders)||0;
document.getElementById("totalAmount").textContent=money(summary.total_split_amount);
document.getElementById("pendingCount").textContent=Number(summary.pending_split_count)||0;
document.getElementById("consultantPhone").textContent=consultant.phone||"未登记";
}

function renderOrders(){
const keyword=document.getElementById("searchInput").value.trim().toLowerCase();
const statusFilter=document.getElementById("statusFilter").value.toLowerCase();
const orders=allOrders.filter(order=>{
const itemNames=(order.items||[]).map(item=>item.product_name||"").join(" ");
const searchable=`${order.order_no||""} ${itemNames}`.toLowerCase();
const matchesKeyword=!keyword||searchable.includes(keyword);
const actualStatus=String(order.split_status||"").toLowerCase();
const matchesStatus=!statusFilter||actualStatus===statusFilter||(statusFilter==="completed"&&["success","executed","paid"].includes(actualStatus));
return matchesKeyword&&matchesStatus;
});
const box=document.getElementById("orderList");
if(!orders.length){
box.innerHTML=`<div class="empty"><div class="empty-icon">🧾</div>${allOrders.length?"没有符合筛选条件的订单":"当前没有与您相关的订单"}</div>`;
return;
}
box.innerHTML=orders.map(order=>{
const splitStatus=statusInfo(order.split_status);
const orderStatus=statusInfo(order.order_status);
const items=Array.isArray(order.items)?order.items:[];
const itemHtml=items.length?items.map(item=>`
<div class="item">
<div><div class="item-name">${esc(item.product_name||"未命名项目")}</div><div class="item-meta">${esc(item.product_code||"")}　${esc(item.product_type||"")}　数量：${esc(item.quantity??0)}</div></div>
<div class="item-amount"><div>${money(item.amount)}</div><div class="item-meta">单价 ${money(item.unit_price)}</div></div>
</div>`).join(""):'<div class="item"><div class="item-name">暂无订单明细</div></div>';
return `<article class="order-card">
<div class="order-head">
<div><div class="order-number">订单号：${esc(order.order_no||order.order_id)}</div><div class="order-date">${esc(dateTime(order.order_created_at))}</div></div>
<span class="status ${orderStatus.className}">${esc(orderStatus.text)}</span>
</div>
<div class="order-body">
<div class="items">${itemHtml}</div>
<div class="split-box">
<div class="split-title">我的分账信息</div>
<div class="split-row"><span>顾问编号</span><strong>${esc(order.participant_no||dashboardData?.consultant?.consultant_no||"—")}</strong></div>
<div class="split-row"><span>分账比例</span><strong>${formatRatio(order.split_ratio)}</strong></div>
<div class="split-row"><span>分账状态</span><span class="status ${splitStatus.className}">${esc(splitStatus.text)}</span></div>
<div class="split-row"><span>完成时间</span><strong>${esc(dateTime(order.executed_at))}</strong></div>
<div class="split-amount"><span>本人分账金额</span><strong>${money(order.split_amount)}</strong></div>
</div>
</div>
</article>`;
}).join("");
}

function formatRatio(value){
const number=Number(value);
if(!Number.isFinite(number))return"—";
return `${number<=1?number*100:number}%`;
}

function openPasswordModal(force){
passwordForced=Boolean(force);
document.getElementById("newPassword").value="";
document.getElementById("confirmPassword").value="";
hidePasswordError();
document.getElementById("passwordMask").classList.add("show");
document.body.style.overflow="hidden";
document.getElementById("passwordTitle").textContent=passwordForced?"首次登录必须修改密码":"修改登录密码";
document.getElementById("passwordDesc").textContent=passwordForced?"为了保护账户安全，请先设置只有您本人知道的新密码。":"设置新的健康顾问登录密码。";
document.getElementById("firstLoginWarning").classList.toggle("hidden",!passwordForced);
document.getElementById("cancelPasswordButton").classList.toggle("hidden",passwordForced);
document.getElementById("passwordActions").classList.toggle("force",passwordForced);
setTimeout(()=>document.getElementById("newPassword").focus(),80);
}

function closePasswordModal(){
if(passwordForced)return;
document.getElementById("passwordMask").classList.remove("show");
document.body.style.overflow="";
}

function togglePassword(inputId,button){
const input=document.getElementById(inputId);
const hidden=input.type==="password";
input.type=hidden?"text":"password";
button.textContent=hidden?"隐藏":"显示";
}

function showPasswordError(message){
const box=document.getElementById("passwordError");
box.textContent=message;
box.classList.add("show");
}
function hidePasswordError(){
const box=document.getElementById("passwordError");
box.textContent="";
box.classList.remove("show");
}

async function saveNewPassword(){
hidePasswordError();
const password=document.getElementById("newPassword").value;
const confirmPassword=document.getElementById("confirmPassword").value;
if(password.length<8){showPasswordError("新密码至少需要8位。");return}
if(!/[A-Za-z]/.test(password)||!/\d/.test(password)){showPasswordError("新密码必须同时包含字母和数字。");return}
if(password==="12345678"){showPasswordError("不能继续使用系统初始密码12345678。");return}
if(password!==confirmPassword){showPasswordError("两次输入的新密码不一致。");return}
const button=document.getElementById("savePasswordButton");
button.disabled=true;
button.textContent="正在修改...";
try{
const{data:{user}}=await supabaseClient.auth.getUser();
const oldData=user?.user_metadata||{};
const{error:updateError}=await supabaseClient.auth.updateUser({
password,
data:{...oldData,must_change_password:false}
});
if(updateError)throw updateError;
const{data,error}=await supabaseClient.rpc("complete_health_consultant_password_change");
if(error)throw new Error(`密码已经修改，但状态同步失败：${error.message}`);
if(!data?.success)throw new Error(data?.message||"密码状态更新失败");
passwordForced=false;
document.getElementById("passwordMask").classList.remove("show");
document.body.style.overflow="";
if(dashboardData?.consultant)dashboardData.consultant.must_change_password=false;
showToast("密码修改成功，请妥善保管新密码");
}catch(error){
console.error("修改密码失败：",error);
showPasswordError(error.message||"密码修改失败，请稍后重试。");
}finally{
button.disabled=false;
button.textContent="确认修改密码";
}
}

async function logout(){
if(!confirm("确定退出健康顾问工作台吗？"))return;
try{await supabaseClient.auth.signOut()}catch(error){console.error(error)}
window.location.replace(LOGIN_PAGE);
}

document.getElementById("searchInput").addEventListener("input",renderOrders);
document.getElementById("statusFilter").addEventListener("change",renderOrders);
document.getElementById("confirmPassword").addEventListener("keydown",event=>{if(event.key==="Enter")saveNewPassword()});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!passwordForced)closePasswordModal()});
supabaseClient.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")window.location.replace(LOGIN_PAGE)});
document.addEventListener("DOMContentLoaded",initialize);
</script>
</body>
</html>
