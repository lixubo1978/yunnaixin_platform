<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        viewport-fit=cover
    "
>

<meta
    name="theme-color"
    content="#fff7fa"
>

<title>孕乃馨 - 人员与商户授权</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root {

    --pink-50:#fff7fa;
    --pink-100:#ffeef4;
    --pink-200:#ffd9e7;
    --pink-300:#f8bdd2;
    --pink-400:#f28aae;
    --pink-500:#e85d8f;
    --pink-600:#d94d7d;
    --pink-700:#b93667;

    --text:#282329;
    --text2:#716a72;
    --text3:#a49ba1;

    --border:#eee4e9;

    --white:#ffffff;

    --bg:#faf8f9;

    --danger:#c83355;

    --green:#14845d;

    --shadow:
        0 10px 30px
        rgba(123,50,79,.07);

}


* {

    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    margin:0;

    min-height:100%;

}


body {

    min-height:
        100vh;

    min-height:
        100dvh;

    background:
        linear-gradient(
            180deg,
            #fff9fb,
            #faf8f9
        );

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

}


button,
input,
select {

    font:inherit;

}


button {

    cursor:pointer;

    touch-action:
        manipulation;

}


.hidden {

    display:none !important;

}



/* =========================================================
   顶部
========================================================= */

.topbar {

    min-height:68px;

    padding:
        8px
        24px;

    position:sticky;

    top:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    gap:15px;

    background:
        rgba(
            255,
            255,
            255,
            .95
        );

    backdrop-filter:
        blur(16px);

    border-bottom:
        1px solid
        var(--border);

}


.brand {

    display:flex;

    align-items:center;

    gap:11px;

}


.brand img {

    width:42px;

    height:42px;

    border-radius:12px;

    object-fit:contain;

}


.brand-title {

    font-size:18px;

    font-weight:750;

    letter-spacing:1px;

}


.brand-sub {

    margin-top:2px;

    font-size:11px;

    color:
        var(--text3);

}


.top-actions {

    display:flex;

    align-items:center;

    gap:9px;

}


.back-button,
.logout-button {

    min-height:44px;

    padding:
        0
        15px;

    border-radius:12px;

    font-size:13px;

    font-weight:650;

}


.back-button {

    border:
        1px solid
        var(--border);

    background:
        #ffffff;

    color:
        var(--text2);

}


.logout-button {

    border:0;

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-600)
        );

}



/* =========================================================
   主区域
========================================================= */

.main {

    width:100%;

    max-width:1450px;

    margin:0 auto;

    padding:
        28px;

}


.heading {

    display:flex;

    justify-content:
        space-between;

    align-items:flex-end;

    gap:20px;

    margin-bottom:20px;

}


.heading h1 {

    margin:0;

    font-size:27px;

    line-height:1.3;

}


.heading p {

    margin:
        7px
        0
        0;

    color:
        var(--text2);

    font-size:13px;

    line-height:1.7;

}



/* =========================================================
   TAB
========================================================= */

.tabs {

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:6px;

    max-width:520px;

    padding:5px;

    margin-bottom:20px;

    border-radius:16px;

    background:
        #f1ecef;

}


.tab {

    min-height:50px;

    border:0;

    border-radius:12px;

    background:transparent;

    color:
        #7b7077;

    font-weight:650;

}


.tab.active {

    background:#ffffff;

    color:
        var(--pink-700);

    box-shadow:
        0 4px 14px
        rgba(
            100,
            40,
            65,
            .08
        );

}



/* =========================================================
   统计
========================================================= */

.stats {

    display:grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:13px;

    margin-bottom:18px;

}


.stat {

    min-height:102px;

    padding:17px;

    border:
        1px solid
        var(--border);

    border-radius:17px;

    background:#ffffff;

}


.stat-title {

    font-size:11px;

    color:
        var(--text3);

}


.stat-number {

    margin-top:9px;

    font-size:24px;

    font-weight:750;

}


.stat-note {

    margin-top:4px;

    color:
        var(--text2);

    font-size:11px;

}



/* =========================================================
   面板
========================================================= */

.panel {

    background:#ffffff;

    border:
        1px solid
        var(--border);

    border-radius:19px;

    overflow:hidden;

    box-shadow:
        0 5px 18px
        rgba(
            100,
            40,
            65,
            .035
        );

}


.panel-toolbar {

    padding:14px;

    display:grid;

    grid-template-columns:
        minmax(
            220px,
            1fr
        )
        180px
        auto;

    gap:10px;

    border-bottom:
        1px solid
        var(--border);

}


.input,
.select {

    width:100%;

    min-height:46px;

    padding:
        0
        13px;

    border:
        1px solid
        #e3dce0;

    border-radius:11px;

    outline:none;

    background:#ffffff;

}


.input:focus,
.select:focus {

    border-color:
        var(--pink-300);

    box-shadow:
        0 0 0 3px
        var(--pink-50);

}


.primary-button {

    min-height:46px;

    padding:
        0
        18px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-600)
        );

    color:#ffffff;

    font-size:13px;

    font-weight:700;

}



/* =========================================================
   表格
========================================================= */

.table-scroll {

    overflow-x:auto;

}


table {

    width:100%;

    min-width:900px;

    border-collapse:
        collapse;

}


th {

    padding:
        13px
        15px;

    background:
        #fcfafb;

    color:
        #837980;

    text-align:left;

    font-size:11px;

    white-space:nowrap;

}


td {

    padding:
        15px;

    border-top:
        1px solid
        #f1eaee;

    font-size:13px;

}


.person-name {

    font-weight:700;

}


.person-email {

    margin-top:4px;

    color:
        var(--text3);

    font-size:11px;

}


.badge {

    display:inline-flex;

    align-items:center;

    min-height:26px;

    padding:
        4px
        9px;

    border-radius:999px;

    font-size:11px;

    font-weight:650;

}


.badge-founder {

    color:#a42e60;

    background:#ffe9f1;

}


.badge-admin {

    color:#8a4062;

    background:#fff3f7;

}


.badge-province {

    color:#6552a4;

    background:#f2efff;

}


.badge-city {

    color:#2b7c73;

    background:#edfaf8;

}


.badge-merchant {

    color:#a16428;

    background:#fff6e9;

}


.status-active {

    color:#157758;

    background:#edfaf4;

}


.status-other {

    color:#7d7379;

    background:#f2f0f1;

}


.action {

    min-height:40px;

    padding:
        0
        13px;

    border:
        1px solid
        var(--border);

    border-radius:10px;

    background:#ffffff;

    color:
        var(--text2);

}


.empty {

    padding:55px 20px;

    text-align:center;

    color:
        var(--text3);

}



/* =========================================================
   手机卡片
========================================================= */

.mobile-list {

    display:none;

}


.mobile-card {

    padding:16px;

    margin-bottom:10px;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:#ffffff;

}


.mobile-card-head {

    display:flex;

    align-items:flex-start;

    justify-content:
        space-between;

    gap:10px;

}


.mobile-card-name {

    font-size:15px;

    font-weight:700;

}


.mobile-card-email {

    margin-top:3px;

    font-size:11px;

    color:
        var(--text3);

}


.mobile-card-info {

    margin-top:13px;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:9px;

}


.mobile-info {

    padding:10px;

    border-radius:11px;

    background:
        var(--pink-50);

}


.mobile-info-label {

    font-size:10px;

    color:
        var(--text3);

}


.mobile-info-value {

    margin-top:3px;

    font-size:12px;

    font-weight:650;

}


.mobile-card .action {

    width:100%;

    min-height:46px;

    margin-top:12px;

}



/* =========================================================
   Modal
========================================================= */

.modal-mask {

    display:none;

    position:fixed;

    inset:0;

    z-index:5000;

    padding:16px;

    align-items:center;

    justify-content:center;

    background:
        rgba(
            35,
            25,
            31,
            .45
        );

}


.modal-mask.show {

    display:flex;

}


.modal {

    width:100%;

    max-width:590px;

    max-height:
        92vh;

    overflow:auto;

    border-radius:20px;

    background:#ffffff;

    box-shadow:
        0 25px 70px
        rgba(
            50,
            20,
            32,
            .2
        );

}


.modal-head {

    position:sticky;

    top:0;

    z-index:2;

    padding:
        18px
        20px;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    background:#ffffff;

    border-bottom:
        1px solid
        var(--border);

}


.modal-title {

    font-size:18px;

    font-weight:750;

}


.modal-close {

    width:42px;

    height:42px;

    border:0;

    border-radius:11px;

    background:
        var(--pink-50);

    color:
        var(--pink-700);

    font-size:20px;

}


.modal-body {

    padding:
        20px;

}


.form-group {

    margin-bottom:16px;

}


.form-label {

    display:block;

    margin-bottom:7px;

    font-size:12px;

    font-weight:650;

    color:
        var(--text2);

}


.required {

    color:
        var(--pink-600);

}


.form-control {

    width:100%;

    min-height:50px;

    padding:
        0
        13px;

    border:
        1px solid
        #e3dce0;

    border-radius:12px;

    background:#ffffff;

    outline:none;

}


.form-control:focus {

    border-color:
        var(--pink-400);

    box-shadow:
        0 0 0 3px
        var(--pink-50);

}


.form-hint {

    margin-top:6px;

    color:
        var(--text3);

    font-size:10px;

    line-height:1.6;

}


.modal-footer {

    position:sticky;

    bottom:0;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:9px;

    padding:
        15px
        20px
        20px;

    background:#ffffff;

    border-top:
        1px solid
        var(--border);

}


.cancel-button,
.save-button {

    min-height:50px;

    border-radius:12px;

    font-weight:700;

}


.cancel-button {

    border:
        1px solid
        var(--border);

    background:#ffffff;

}


.save-button {

    border:0;

    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-600)
        );

    color:#ffffff;

}


.save-button:disabled {

    opacity:.5;

}



/* =========================================================
   Toast
========================================================= */

.toast {

    display:none;

    position:fixed;

    z-index:9000;

    right:18px;

    bottom:18px;

    max-width:400px;

    padding:
        13px
        16px;

    border-radius:12px;

    font-size:13px;

    box-shadow:
        var(--shadow);

}


.toast.show {

    display:block;

}


.toast.success {

    color:#17664c;

    background:#effaf5;

}


.toast.error {

    color:#af294b;

    background:#fff0f4;

}


.toast.info {

    color:#665c62;

    background:#f8f5f7;

}



/* =========================================================
   Loading
========================================================= */

.loading {

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;

    background:
        #fffafd;

}


.spinner {

    width:38px;

    height:38px;

    border:
        4px solid
        var(--pink-100);

    border-top-color:
        var(--pink-500);

    border-radius:50%;

    animation:
        spin .8s
        linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}



/* =========================================================
   手机
========================================================= */

@media
(max-width:760px) {

    .topbar {

        padding:
            7px
            11px;

    }


    .brand-sub {

        display:none;

    }


    .brand img {

        width:38px;

        height:38px;

    }


    .brand-title {

        font-size:16px;

    }


    .back-button {

        display:none;

    }


    .logout-button {

        min-height:42px;

        padding:
            0
            13px;

        font-size:11px;

    }


    .main {

        padding:
            17px
            11px
            30px;

    }


    .heading {

        display:block;

    }


    .heading h1 {

        font-size:22px;

    }


    .tabs {

        max-width:none;

        width:100%;

    }


    .tab {

        min-height:52px;

    }


    .stats {

        grid-template-columns:
            1fr
            1fr;

        gap:8px;

    }


    .stat {

        min-height:92px;

        padding:14px;

    }


    .stat-number {

        font-size:21px;

    }


    .panel {

        padding:0;

        background:transparent;

        border:0;

        box-shadow:none;

    }


    .panel-toolbar {

        padding:0;

        margin-bottom:12px;

        grid-template-columns:
            1fr;

        border:0;

    }


    .panel-toolbar .primary-button {

        min-height:52px;

        font-size:14px;

    }


    .table-scroll {

        display:none;

    }


    .mobile-list {

        display:block;

    }


    .empty {

        padding:
            35px
            15px;

        background:#ffffff;

        border-radius:16px;

    }


    .modal-mask {

        align-items:
            flex-end;

        padding:0;

    }


    .modal {

        max-width:none;

        max-height:
            92dvh;

        border-radius:
            22px
            22px
            0
            0;

    }


    .modal-footer {

        padding-bottom:
            max(
                18px,
                env(
                    safe-area-inset-bottom
                )
            );

    }


    .toast {

        left:10px;

        right:10px;

        bottom:
            max(
                12px,
                env(
                    safe-area-inset-bottom
                )
            );

    }

}

</style>

</head>



<body>



<!-- =========================================================
     Loading
========================================================= -->

<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div style="
        color:#756a71;
        font-size:13px;
    ">
        正在验证管理权限...
    </div>

</div>



<!-- =========================================================
     Top
========================================================= -->

<header class="topbar">


    <div class="brand">


        <img
            src="./logo.jpeg"
            alt="孕乃馨"
        >


        <div>


            <div class="brand-title">
                孕乃馨
            </div>


            <div class="brand-sub">
                人员与商户授权中心
            </div>


        </div>


    </div>



    <div class="top-actions">


        <button
            class="back-button"
            onclick="goHome()"
        >
            返回工作台
        </button>


        <button
            class="logout-button"
            onclick="logout()"
        >
            退出
        </button>


    </div>


</header>



<!-- =========================================================
     Main
========================================================= -->

<main class="main">


    <section class="heading">


        <div>


            <h1>
                人员与商户授权
            </h1>


            <p>

                公司管理人员和商户账号均由平台统一创建。

                <br>

                客户账号仍通过手机短信验证码自动注册。

            </p>


        </div>


    </section>



    <!-- =====================================================
         Tabs
    ====================================================== -->

    <div class="tabs">


        <button
            id="staffTab"
            class="tab active"
            onclick="openStaffTab()"
        >
            公司人员
        </button>


        <button
            id="merchantTab"
            class="tab"
            onclick="openMerchantTab()"
        >
            商户授权
        </button>


    </div>



    <!-- =====================================================
         公司人员
    ====================================================== -->

    <section
        id="staffSection"
    >


        <div class="stats">


            <div class="stat">


                <div class="stat-title">
                    创始人
                </div>


                <div
                    id="founderCount"
                    class="stat-number"
                >
                    0 / 2
                </div>


                <div
                    id="founderNote"
                    class="stat-note"
                >
                    最多2人
                </div>


            </div>



            <div class="stat">


                <div class="stat-title">
                    平台管理
                </div>


                <div
                    id="platformCount"
                    class="stat-number"
                >
                    0
                </div>


            </div>



            <div class="stat">


                <div class="stat-title">
                    省级管理员
                </div>


                <div
                    id="provinceCount"
                    class="stat-number"
                >
                    0
                </div>


            </div>



            <div class="stat">


                <div class="stat-title">
                    市级管理员
                </div>


                <div
                    id="cityCount"
                    class="stat-number"
                >
                    0
                </div>


            </div>


        </div>



        <div class="panel">


            <div class="panel-toolbar">


                <input
                    id="staffSearch"
                    class="input"
                    type="search"
                    placeholder="搜索姓名或邮箱"
                    oninput="renderStaff()"
                >


                <select
                    id="staffRoleFilter"
                    class="select"
                    onchange="renderStaff()"
                >

                    <option value="">
                        全部角色
                    </option>

                    <option value="founder">
                        创始人
                    </option>

                    <option value="platform_admin">
                        平台管理员
                    </option>

                    <option value="platform_staff">
                        平台员工
                    </option>

                    <option value="province_admin">
                        省管理员
                    </option>

                    <option value="city_admin">
                        市管理员
                    </option>

                </select>


                <button
                    id="createStaffButton"
                    class="primary-button"
                    onclick="openStaffModal()"
                >
                    ＋ 创建公司人员
                </button>


            </div>



            <div class="table-scroll">


                <table>


                    <thead>

                    <tr>

                        <th>
                            人员
                        </th>

                        <th>
                            身份
                        </th>

                        <th>
                            省份
                        </th>

                        <th>
                            城市
                        </th>

                        <th>
                            状态
                        </th>

                    </tr>

                    </thead>


                    <tbody
                        id="staffTable"
                    >
                    </tbody>


                </table>


            </div>


            <div
                id="staffMobileList"
                class="mobile-list"
            >
            </div>


            <div
                id="staffEmpty"
                class="empty hidden"
            >
                暂无公司人员。
            </div>


        </div>


    </section>



    <!-- =====================================================
         商户
    ====================================================== -->

    <section
        id="merchantSection"
        class="hidden"
    >


        <div class="stats">


            <div class="stat">


                <div class="stat-title">
                    商户总数
                </div>


                <div
                    id="merchantTotal"
                    class="stat-number"
                >
                    0
                </div>


            </div>



            <div class="stat">


                <div class="stat-title">
                    机构商户
                </div>


                <div
                    id="organizationTotal"
                    class="stat-number"
                >
                    0
                </div>


            </div>



            <div class="stat">


                <div class="stat-title">
                    个人商户
                </div>


                <div
                    id="individualTotal"
                    class="stat-number"
                >
                    0
                </div>


            </div>



            <div class="stat">


                <div class="stat-title">
                    正常使用
                </div>


                <div
                    id="merchantActive"
                    class="stat-number"
                >
                    0
                </div>


            </div>


        </div>



        <div class="panel">


            <div class="panel-toolbar">


                <input
                    id="merchantSearch"
                    class="input"
                    type="search"
                    placeholder="搜索商户名称、代码或联系人"
                    oninput="renderMerchants()"
                >


                <select
                    id="merchantTypeFilter"
                    class="select"
                    onchange="renderMerchants()"
                >

                    <option value="">
                        全部商户
                    </option>

                    <option value="organization">
                        机构
                    </option>

                    <option value="individual">
                        个人
                    </option>

                </select>

<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    "https://qbuqjwpkltbjhlfbyjyb.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY,

        {

            auth: {

                persistSession:true,

                autoRefreshToken:true

            }

        }

    );



const LOGIN_PAGE =
    "./login.html";


const HOME_PAGE =
    "./wholemanagement.html";



let currentUser = null;

let currentProfile = null;


let founderCount = 0;

let canCreateFounder = false;


let staffList = [];

let merchantList = [];

let assignmentList = [];


let provinces = [];

let cities = [];

let districts = [];



const STAFF_ROLES = [

    "founder",

    "platform_admin",

    "platform_staff",

    "province_admin",

    "city_admin"

];



/* =========================================================
   初始化
========================================================= */

async function initialize() {


    try {


        const {
            data:{
                session
            }
        } =
        await supabaseClient.auth
            .getSession();



        if (!session) {


            location.replace(
                LOGIN_PAGE
            );


            return;

        }



        currentUser =
            session.user;



        const {
            data:profile,
            error
        } =
        await supabaseClient

            .from("profiles")

            .select(`
                id,
                full_name,
                login_email,
                role,
                status
            `)

            .eq(
                "id",
                currentUser.id
            )

            .single();



        if (
            error
            ||
            !profile
        ) {


            throw new Error(
                "无法读取当前管理人员资料。"
            );

        }



        currentProfile =
            profile;



        /*
        这个页面：

        founder
        platform_admin

        可以进入。

        但只有Founder可以创建公司人员。
        */


        if (
            ![
                "founder",
                "platform_admin"
            ]
            .includes(
                profile.role
            )
        ) {


            alert(
                "您没有人员授权页面访问权限。"
            );


            location.replace(
                HOME_PAGE
            );


            return;

        }



        await Promise.all([

            loadRegions(),

            loadFounderState(),

            loadStaff(),

            loadMerchants()

        ]);



        /*
        平台管理员：

        可以创建商户

        不能创建公司人员
        */


        if (
            currentProfile.role !==
            "founder"
        ) {


            document.getElementById(
                "createStaffButton"
            )
            .classList.add(
                "hidden"
            );

        }



        document.getElementById(
            "loading"
        ).style.display =
            "none";


    }

    catch(error) {


        console.error(error);


        alert(
            error.message
            ||
            "系统初始化失败。"
        );

    }

}



/* =========================================================
   Founder状态
========================================================= */

async function loadFounderState() {


    const {
        data,
        error
    } =
    await supabaseClient
        .rpc(
            "get_founder_creation_state"
        );


    if (error) {
        throw error;
    }


    const row =
        Array.isArray(data)
        ?
        data[0]
        :
        data;


    founderCount =
        Number(
            row?.founder_count || 0
        );


    canCreateFounder =
        Boolean(
            row?.can_create_founder
        );


    document.getElementById(
        "founderCount"
    ).textContent =
        `${founderCount} / 2`;



    document.getElementById(
        "founderNote"
    ).textContent =

        founderCount >= 2

        ?

        "已达到最大数量"

        :

        "仍可创建1位创始人";


    const option =
        document.getElementById(
            "founderOption"
        );


    if (
        !canCreateFounder
    ) {


        option.disabled =
            true;


        option.textContent =
            "创始人（已达到上限）";


    }

    else {


        option.disabled =
            false;


        option.textContent =
            "创始人";

    }

}



/* =========================================================
   地区
========================================================= */

async function loadRegions() {


    const provinceResult =
        await supabaseClient

            .from("provinces")

            .select(`
                id,
                province_name
            `)

            .eq(
                "status",
                "active"
            )

            .order(
                "province_name"
            );


    if (
        provinceResult.error
    ) {

        throw provinceResult.error;

    }


    provinces =
        provinceResult.data || [];



    const cityResult =
        await supabaseClient

            .from("cities")

            .select(`
                id,
                province_id,
                city_name
            `)

            .eq(
                "status",
                "active"
            )

            .order(
                "city_name"
            );


    if (
        cityResult.error
    ) {

        throw cityResult.error;

    }


    cities =
        cityResult.data || [];



    const districtResult =
        await supabaseClient

            .from("districts")

            .select(`
                id,
                city_id,
                district_name
            `)

            .eq(
                "status",
                "active"
            )

            .order(
                "district_name"
            );


    if (
        districtResult.error
    ) {

        throw districtResult.error;

    }


    districts =
        districtResult.data || [];


    fillProvinceSelects();

}



/* =========================================================
   公司人员
========================================================= */

async function loadStaff() {


    const result =
        await supabaseClient

        .from("profiles")

        .select(`
            id,
            full_name,
            login_email,
            role,
            status,
            created_at
        `)

        .in(
            "role",
            STAFF_ROLES
        )

        .order(
            "created_at"
        );


    if (result.error) {

        throw result.error;

    }


    staffList =
        result.data || [];



    const assignmentResult =
        await supabaseClient

        .from(
            "admin_assignments"
        )

        .select(`
            id,
            user_id,
            province_id,
            city_id,
            status
        `)

        .eq(
            "status",
            "active"
        );


    if (
        assignmentResult.error
    ) {

        throw assignmentResult.error;

    }


    assignmentList =
        assignmentResult.data || [];


    renderStaffStats();

    renderStaff();

}



/* =========================================================
   商户
========================================================= */

async function loadMerchants() {


    const result =
        await supabaseClient

        .from("merchants")

        .select(`
            id,
            merchant_code,
            merchant_name,
            merchant_type,
            province_id,
            city_id,
            district_id,
            contact_name,
            phone,
            email,
            certification_status,
            status,
            created_at
        `)

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if (result.error) {

        throw result.error;

    }


    merchantList =
        result.data || [];


    renderMerchantStats();

    renderMerchants();

}

function renderStaff() {


    const keyword =
        document.getElementById(
            "staffSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const role =
        document.getElementById(
            "staffRoleFilter"

        staffList.filter(
            item => {


                if (
                    role
                    &&
                    item.role !== role
                ) {

                    return false;

                }


                const text =
                    `${item.full_name || ""} ${item.login_email || ""}`

                return text.includes(
                    keyword

        document.getElementById(

    await loadFounderState();


    document.getElementById(
        "staffName"
    ).value = "";


    document.getElementById(
        "staffEmail"
    ).value = "";


    document.getElementById(
        "staffPassword"
    ).value = "";


    document.getElementById(
        "staffRole"
    ).value = "";


    staffRoleChanged();


    document.getElementById(
        "staffModal"
    ).classList.add(
        "show"
    );

}



/* =========================================================
   创建人员
========================================================= */

async function createStaff() {


    const name =
        document.getElementById(
            "staffName"
        )
        .value
        .trim();


    const email =
        document.getElementById(
            "staffEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
        document.getElementById(
            "staffPassword"
        )
        .value;


    const role =
        document.getElementById(
            "staffRole"
        )
        .value;


    const provinceId =
        document.getElementById(
            "staffProvince"
        )
        .value || null;


    const cityId =
        document.getElementById(
            "staffCity"
        )
        .value || null;



    if (!name) {

        showToast(
            "请输入姓名。",
            "error"
        );

        return;

    }


    if (
        !isEmail(email)
    ) {

        showToast(
            "请输入正确邮箱。",
            "error"
        );

        return;

    }


    if (
        password.length < 8
    ) {

        showToast(
            "初始密码至少8位。",
            "error"
        );

        return;

    }


    if (!role) {

        showToast(
            "请选择身份。",
            "error"
        );

        return;

    }


    if (
        role === "founder"
        &&
        !canCreateFounder
    ) {

        showToast(
            "系统已经存在2位创始人，不能继续创建。",
            "error"
        );

        return;

    }


    if (
        role === "province_admin"
        &&
        !provinceId
    ) {

        showToast(
            "请选择管理省份。",
            "error"
        );

        return;

    }


    if (
        role === "city_admin"
        &&
        (
            !provinceId
            ||
            !cityId
        )
    ) {

        showToast(
            "请选择管理省份和城市。",
            "error"
        );

        return;

    }



    const button =
        document.getElementById(
            "saveStaffButton"
        );


    button.disabled =
        true;


    button.textContent =
        "正在创建...";



    try {


        /*
        创建Auth账号必须通过Edge Function
        浏览器不能保存service_role

        Edge Function名称：
        create-system-user
        */


        const {
            data,
            error
        } =
        await supabaseClient.functions
        .invoke(

            "create-system-user",

            {

                body: {

                    account_type:
                        "management",

                    full_name:
                        name,

                    email,

                    password,

                    role,

                    province_id:
                        provinceId
                        ?
                        Number(provinceId)
                        :
                        null,

                    city_id:
                        cityId
                        ?
                        Number(cityId)
                        :
                        null

                }

            }

        );


        if (error) {
            throw error;
        }


        if (
            data?.error
        ) {


            throw new Error(
                data.error
            );

        }



        showToast(
            "公司人员账号创建成功。",
            "success"
        );


        closeStaffModal();


        await Promise.all([

            loadFounderState(),

            loadStaff()

        ]);


    }

    catch(error) {


        console.error(error);


        showToast(

            error.message
            ||
            "创建失败。",

            "error"

        );


    }

    finally {


        button.disabled =
            false;


        button.textContent =
            "创建账号";

    }

}

        "staffProvinceGroup"
    ).classList.add(

        );

/* =========================================================
   地区选择
========================================================= */

function fillProvinceSelects() {


    [
        "staffProvince",
        "merchantProvince"
    ]
    .forEach(
        id => {


            const el =
                document.getElementById(
                    id
                );


            el.innerHTML =
                `<option value="">
                    请选择省份
                </option>`;


            provinces.forEach(
                province => {


                    el.insertAdjacentHTML(

                        "beforeend",

                        `<option value="${province.id}">
                            ${escapeHtml(province.province_name)}
                        </option>`

                    );

                }
            );

        }
    );


    document.getElementById(
        "staffCity"
    ).innerHTML =
        `<option value="">
            请选择城市
        </option>`;


    document.getElementById(
        "merchantCity"
    ).innerHTML =
        `<option value="">
            请选择城市
        </option>`;


    document.getElementById(
        "merchantDistrict"
    ).innerHTML =
        `<option value="">
            区县（可选）
        </option>`;

}



function staffProvinceChanged() {


    fillCitySelect(

        "staffCity",

        document.getElementById(
            "staffProvince"
        ).value

    );

}



function merchantProvinceChanged() {


    fillCitySelect(

        "merchantCity",

        document.getElementById(
            "merchantProvince"
        ).value

    );


    document.getElementById(
        "merchantDistrict"
    ).innerHTML =
        `<option value="">
            区县（可选）
        </option>`;

}



function merchantCityChanged() {


    const cityId =
        document.getElementById(
            "merchantCity"
        ).value;


    const select =
        document.getElementById(
            "merchantDistrict"
        );


    select.innerHTML =
        `<option value="">
            区县（可选）
        </option>`;


    districts
    .filter(
        x =>
        String(x.city_id) ===
        String(cityId)
    )
    .forEach(
        x => {


            select.insertAdjacentHTML(

                "beforeend",

                `<option value="${x.id}">
                    ${escapeHtml(x.district_name)}
                </option>`

            );

        }
    );

}



function fillCitySelect(
    selectId,
    provinceId
) {


    const select =
        document.getElementById(
            selectId
        );


    select.innerHTML =
        `<option value="">
            请选择城市
        </option>`;


    cities
    .filter(
        city =>
        String(city.province_id) ===
        String(provinceId)
    )
    .forEach(
        city => {


            select.insertAdjacentHTML(

                "beforeend",

                `<option value="${city.id}">
                    ${escapeHtml(city.city_name)}
                </option>`

            );

        }
    );

}

/* =========================================================
   Helpers
========================================================= */

function roleText(role) {


    const map = {

        founder:
            "创始人",

        platform_admin:
            "平台管理员",

        platform_staff:
            "平台员工",

        province_admin:
            "省管理员",

        city_admin:
            "市管理员"

    };


    return map[role] || role;

}


function roleBadge(role) {


    let className =
        "badge-admin";


    if (
        role ===
        "founder"
    ) {

        className =
            "badge-founder";

    }


    if (
        role ===
        "province_admin"
    ) {

        className =
            "badge-province";

    }


    if (
        role ===
        "city_admin"
    ) {

        className =
            "badge-city";

    }


    return `

        <span class="badge ${className}">
            ${escapeHtml(roleText(role))}
        </span>

    `;

}



function statusBadge(status) {


    return `

        <span
            class="
                badge
                ${status === "active"
                    ?
                    "status-active"
                    :
                    "status-other"
                }
            "
        >
            ${statusText(status)}
        </span>

    `;

}



function statusText(status) {


    return {

        active:
            "正常",

        inactive:
            "无效",

        suspended:
            "停用"

    }[status] || status;

}



function merchantTypeText(type) {


    return type ===
        "individual"

        ?

        "个人"

        :

        "机构";

}



function certificationText(value) {


    const map = {

        pending:
            "待认证",

        approved:
            "已认证",

        rejected:
            "未通过",

        suspended:
            "已暂停"

    };


    return map[value] || value;

}



function provinceName(id) {


    if (!id) {
        return "-";
    }


    return (

        provinces.find(
            x =>
            String(x.id) ===
            String(id)
        )?.province_name

        ||

        "-"

    );

}



function cityName(id) {


    if (!id) {
        return "-";
    }


    return (

        cities.find(
            x =>
            String(x.id) ===
            String(id)
        )?.city_name

        ||

        "-"

    );

}



function staffProvinceText(
    role,
    province
) {


    if (
        [
            "founder",
            "platform_admin",
            "platform_staff"
        ]
        .includes(role)
    ) {

        return "全国";

    }


    return province || "-";

}



function staffCityText(
    role,
    city
) {


    if (
        [
            "founder",
            "platform_admin"
        ]
        .includes(role)
    ) {

        return "全国";

    }


    if (
        role ===
        "platform_staff"
    ) {

        return "按页面权限";

    }


    if (
        role ===
        "province_admin"
    ) {

        return "本省全部城市";

    }


    return city || "-";

}



function isEmail(value) {


    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(value);

}



function escapeHtml(value) {


    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   Toast
========================================================= */

let toastTimer;


function showToast(
    text,
    type="info"
) {


    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.className =
        `toast show ${type}`;


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {


                toast.className =
                    "toast";


            },
            3500
        );

}

   Home / Logout
========================================================= */

function goHome() {


    location.href =
        HOME_PAGE;

}



async function logout() {


    if (
        !confirm(
            "确定退出登录吗？"
        )
    ) {

        return;

    }


    await supabaseClient.auth
        .signOut();


    location.replace(
        LOGIN_PAGE
    );

}



/* =========================================================
   10分钟自动退出
========================================================= */

let idleTimer;


function resetIdle() {


    clearTimeout(
        idleTimer
    );


    idleTimer =
        setTimeout(

            async () => {


                await supabaseClient.auth
                    .signOut();


                alert(
                    "由于10分钟未操作，系统已经自动退出。"
                );


                location.replace(
                    LOGIN_PAGE
                );


            },

            10 * 60 * 1000

        );

}



[
    "click",
    "touchstart",
    "keydown",
    "mousemove",
    "scroll"
]
.forEach(
    event => {


        document.addEventListener(

            event,

            resetIdle,

            {
                passive:true
            }

        );

    }
);



/* =========================================================
   Start
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    () => {


        resetIdle();

        initialize();

    }

);

</script>
