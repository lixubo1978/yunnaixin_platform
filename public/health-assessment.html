<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>围产期心理健康自评 · 孕乃馨</title>
<meta name="ynx-layout-version" content="safety-v3">
<style>
:root{--rose:#af456e;--pale:#fdf1f4;--line:#eadce1;--ink:#243141;--muted:#536473}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fcf1f3,#f9f9f6);color:var(--ink);font:16px/1.65 system-ui,sans-serif}
.shell{max-width:870px;min-height:100dvh;background:white;margin:auto;padding:clamp(18px,4vw,34px)}header{display:flex;justify-content:space-between;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-bottom:30px;color:var(--rose);font-weight:750}header span{background:var(--pale);padding:5px 12px;border-radius:999px;font-size:13px}header a{color:inherit;font-size:14px}h1,h2,h3,p{margin:0 0 14px}h1{font-size:clamp(26px,4vw,38px);line-height:1.3}h2{font-size:24px;line-height:1.4}h3{font-size:18px}p,small{color:var(--muted)}.kicker{color:var(--rose);font-weight:700}.card{padding:clamp(14px,3vw,24px);margin:16px 0;border:1px solid var(--line);border-radius:19px;background:#fdf7f7}.card p:last-child{margin-bottom:0}.notice{background:#fff6e5;color:var(--ink);border:1px solid #ead6a7}.choices{display:grid;gap:9px;margin:18px 0}.choice{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:13px;cursor:pointer}.choice:has(:checked){background:var(--pale);border-color:var(--rose)}input{accent-color:var(--rose);width:18px;height:18px;flex:none}.consent{display:flex;align-items:flex-start;gap:9px;margin:16px 0}.buttons{display:flex;gap:10px;margin:18px 0 10px}button{font:inherit;cursor:pointer;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}button.primary{flex:1;background:var(--rose);color:white;font-weight:700;border-color:var(--rose)}:focus-visible{outline:3px solid #b47115;outline-offset:3px}progress{width:100%;height:9px;display:block;border:0;border-radius:12px;overflow:hidden;background:#f5e6eb;color:#c97092;accent-color:#c97092;margin:8px 0 22px}progress::-webkit-progress-bar{background:#f5e6eb}progress::-webkit-progress-value{background:#c97092}progress::-moz-progress-bar{background:#c97092}fieldset{padding:0;margin:0;border:0;min-inline-size:0}legend{font-weight:750}.safety-card{display:block;width:100%;min-width:0;background:white}.safety-card h2{font-size:1.125rem;line-height:1.5;overflow-wrap:anywhere}.safety-card .choices{grid-template-columns:minmax(0,1fr);margin-bottom:0}.safety-card .choice{width:100%;min-width:0;overflow-wrap:anywhere}.chart{display:block;width:min(100%,480px);margin:0 auto 15px}.score{display:flex;justify-content:space-between;gap:12px}.tag{color:var(--rose);font-size:13px;margin-left:8px}.support{text-align:center;background:white}.support img{display:block;width:min(230px,100%);margin:12px auto;background:white;padding:10px;border:2px dashed #e4b8ca;border-radius:16px}footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
</style>
</head>
<body>
<div class="shell">
<header><strong>✿ 孕乃馨 · 心晴孕语计划</strong><span>心晴孕语 · 心理关爱</span><a href="./index.html">返回首页</a></header>
<main id="screen"></main>
<footer>南通市妇联公益创投项目 · 孕乃馨·心晴孕语计划<br>健康教育参考｜非诊断工具｜不保存答题记录</footer>
</div>
<script>
"use strict";
const dimensions = ["情绪困扰","焦虑担忧","压力负荷","支持不足","恢复力不足"];
const stages = ["孕早期","孕中期","孕晚期","产后0—3个月","产后4—6个月","产后7—12个月"];
const frequency = ["0 · 从不","1 · 偶尔","2 · 经常","3 · 几乎每天"];
const questions = [
  "最近我常常觉得心情低落、沉重或提不起精神。",
  "原本能够让我开心的事情，现在很难让我感到愉快。",
  "我容易责怪自己，觉得自己做得不够好。",
  "我有时觉得自己没有价值，或者对家庭没有什么帮助。",
  "即使没有明显原因，我也会突然想哭、难过或感到无助。",
  "我经常担心胎儿/宝宝的健康，即使检查没有明显异常，也很难真正放心。",
  "我会反复想到分娩、生产风险、宝宝照护等问题，很难让这些想法停下来。",
  "最近我容易紧张、心慌，总觉得心里悬着事情。",
  "身体或宝宝出现一点变化，我容易想到比较严重的结果。",
  "即使身边的人告诉我“不用担心”，我仍然很难真正放松。",
  "最近需要处理的事情太多，我常常觉得应付不过来。",
  "我觉得生活中的很多事情已经超出了自己的掌控。",
  "工作、经济、家庭或育儿压力已经明显影响我的情绪。",
  "即使有时间休息，我的大脑仍然很难停下来。",
  "我觉得自己承担的责任已经超过目前能够承受的范围。",
  "当我遇到困难时，家里有人愿意真正听我说，并理解我的感受。",
  "在孕期或产后，我能够获得实际的生活帮助。",
  "我的伴侣或主要家庭成员能够尊重我的感受和需要。",
  "当我情绪不好时，我知道可以向谁求助。",
  "总体而言，我觉得自己不是一个人在承担孕育和育儿压力。",
  "虽然生活有压力，但我仍然能够感受到幸福、满足或希望。",
  "面对孕期、分娩和育儿问题，我相信自己能够逐渐学会应对。",
  "遇到困难后，我通常能够找到办法让自己的情绪慢慢恢复。",
  "我仍然能够感受到“作为我自己”的价值，而不仅仅是妻子或妈妈。",
  "对未来几个月的生活，我总体仍然抱有希望。"
];
const safety = [
  ["S1. 过去7天是否出现“不想活了”“如果自己消失就好了”或伤害自己的想法？",["没有","偶尔闪过但不会实施","反复出现","已考虑具体方法/计划"]],
  ["S2. 是否出现让自己害怕的、伤害自己/胎儿/宝宝的想法或冲动？",["没有","偶尔但可控制","反复出现且困扰","担心无法控制"]],
  ["S3. 近期是否出现明显异常兴奋、几乎不睡仍精力旺盛、异常冲动、幻听、明显不现实的坚信或行为异常？",["无","有"]]
];
const support = [
  ["情绪关爱","每天留出10分钟观察并记录心情，和信任的人谈谈最近最困扰的一件事。","给一位可信赖的人发消息，告诉对方你希望得到怎样的陪伴。"],
  ["缓解焦虑与担忧","如果担忧持续难以控制、影响睡眠或日常生活，建议向产检医生或心理专业人员寻求支持，不必独自承受。","写下最担心的一件事，以及下次向医护人员询问的具体问题。"],
  ["减轻压力负荷","如果长期感到应付不过来，请尽快与家人、社区服务人员或专业人员一起梳理压力来源和可获得的支持。","列出一项可以推迟的事情和一项可以请别人帮忙的事情。"],
  ["获得家庭与社会支持","试着明确表达需要，例如“今晚请帮我照看宝宝30分钟”，而不是只说“我很累”。","选出两位可能提供情感支持或实际帮助的人，并记下联系方式。"],
  ["重建信心与心理恢复力","把目标缩小到可完成的一步，记录今天已经做到的事，允许恢复需要时间。","写下一件已经努力完成的小事，并为自己安排一段短暂的个人时间。"]
];
const emergency = "如果你或他人面临立即危险，请立即联系当地急救服务或前往急诊。";
const screen = document.getElementById("screen");
let stage, answers, safetyAnswers;
function render(content){
  screen.innerHTML=content;
  const title=screen.querySelector("h1");
  title.tabIndex=-1;
  title.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function setForm(handler){
  screen.querySelector("form").onsubmit=event=>{
    event.preventDefault();
    handler(new FormData(event.currentTarget));
  };
}
function choices(name,options,selected){
  return '<div class="choices">'+options.map((label,index)=>
    `<label class="choice"><input type="radio" name="${name}" value="${index}" required ${selected===index?"checked":""}>${label}</label>`
  ).join("")+'</div>';
}
function buttons(next,previous){
  return `<div class="buttons">${previous?`<button type="button" id="back">${previous}</button>`:""}<button class="primary" type="submit">${next} →</button></div>`;
}
function start(){
  stage=null;
  answers=Array(25).fill(null);
  safetyAnswers=Array(3).fill(null);
  render(`<p class="kicker">围产期心理健康自评</p><h1>照顾好自己的心情<br>也是孕育的一部分</h1>
  <p>通过25道自评题，了解情绪、焦虑、压力、家庭支持和心理恢复力五个方面，并查看健康教育建议。</p>
  <section class="card"><h2>开始前请了解</h2><p>本自评帮助你了解近期心理感受，并提供健康教育与支持建议。自评结果不能替代医生或心理专业人员的判断。</p><p>本页面无需填写姓名和电话。答案仅在当前页面计算，不上传、不保存，刷新或关闭后清除。</p><p>本网页没有在线值班或危机响应能力。${emergency}</p></section>
  <form autocomplete="off"><label class="consent"><input type="checkbox" required>我已阅读说明，自愿进行本次心理健康自评。</label>${buttons("开始自评")}</form>`);
  setForm(showStage);
}
function showStage(){
  render(`<h1>你目前处于哪个阶段？</h1><p>仅用于报告中的阶段显示，不影响分数。</p><form autocomplete="off">${choices("stage",stages,stage)}${buttons("继续","返回说明")}</form>`);
  screen.querySelector("#back").onclick=start;
  setForm(data=>{stage=Number(data.get("stage"));showQuestion(0);});
}
function showQuestion(index){
  const number=index+1;
  render(`<p class="kicker">第 ${number} / 25 题 · ${dimensions[Math.floor(index/5)]}</p>
  <progress aria-label="答题进度" value="${number}" max="25"></progress>
  <h1 id="question">${questions[index]}</h1><form autocomplete="off"><fieldset aria-labelledby="question">${choices("frequency",frequency,answers[index])}</fieldset>
  ${buttons(number===25?"进入安全提示":"下一题","上一题")}</form><small>请根据过去7天的实际感受作答。</small>`);
  screen.querySelector("fieldset").onchange=event=>{ answers[index]=Number(event.target.value); };
  screen.querySelector("#back").onclick=()=>index===0?showStage():showQuestion(index-1);
  setForm(()=>number===25?showSafety():showQuestion(index+1));
}
function showSafety(){
  render(`<h1>安全与支持提醒</h1><p>以下问题独立于雷达图评分。请如实作答，任何需要帮助的情况都值得被认真对待。</p>
  <p class="card notice" id="safetyNotice" role="status"></p><form autocomplete="off">${safety.map(([question,options],index)=>
  `<div class="card safety-card" role="radiogroup" aria-labelledby="safety-title-${index}"><h2 id="safety-title-${index}">${question}</h2>${choices("s"+index,options,safetyAnswers[index])}</div>`).join("")}
  <p>如有紧急危险，请优先寻求现场医疗帮助。一般咨询可在结果页查看“心晴小屋”联系二维码。</p>${buttons("查看我的自评报告","上一题")}</form>`);
  const updateNotice=()=>{
    const needsSupport=safetyAnswers.some(answer=>answer>0);
    screen.querySelector("#safetyNotice").textContent=needsSupport?`请尽快联系正规医疗机构或专业人员，告诉对方你遇到的情况。${emergency}`:emergency;
  };
  screen.querySelector("form").onchange=event=>{
    safetyAnswers[Number(event.target.name.slice(1))]=Number(event.target.value);
    updateNotice();
  };
  updateNotice();
  screen.querySelector("#back").onclick=()=>showQuestion(24);
  setForm(showReport);
}
function radar(scores){
  const points = (i,r)=>{
    const angle=i*2*Math.PI/5-Math.PI/2;
    return [175+Math.cos(angle)*r,149+Math.sin(angle)*r].map(n=>n.toFixed(2)).join(",");
  };
  const ring=r=>dimensions.map((_,i)=>points(i,r)).join(" ");
  const chart=scores.map((score,i)=>points(i,score*100/15));
  return `<svg class="chart" viewBox="0 0 350 286" role="img" aria-label="五维雷达图，具体分数见下方">
  ${[25,50,75,100].map(r=>`<polygon points="${ring(r)}" fill="none" stroke="#e7d0db"/>`).join("")}
  ${dimensions.map((_,i)=>`<polyline points="175,149 ${points(i,100)}" fill="none" stroke="#e7d0db"/>`).join("")}
  <polygon points="${chart.join(" ")}" fill="#d8709940" stroke="#b64c77" stroke-width="2.5"/>
  ${chart.map(point=>{const [x,y]=point.split(",");return `<circle cx="${x}" cy="${y}" r="3.5" fill="#b64c77"/>`;}).join("")}
  ${[[175,28],[309,111],[253,253],[97,253],[41,111]].map(([x,y],i)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="13" fill="#536473">${dimensions[i]}</text>`).join("")}</svg>`;
}
function showReport(){
  const scores=dimensions.map((_,index)=>answers.slice(index*5,index*5+5).reduce((sum,value)=>sum+(index<3?value:3-value),0));
  const max=Math.max(...scores);
  const needsSupport=safetyAnswers.some(answer=>answer>0);
  render(`<p class="kicker">自评完成 · 我的结果 · ${stages[stage]}</p><h1>我的五维心理健康自评</h1>
  ${needsSupport?`<section class="card notice"><h2>请优先关注安全与支持</h2><p>根据你在安全提示中的回答，请尽快联系正规医疗机构或专业人员。${emergency}</p></section>`:""}
  <p>图表用于回顾本次回答中各维度的相对分数。外侧表示本次回答的该维度分数较高。分数仅供健康教育参考。</p>
  ${radar(scores)}${scores.map((score,index)=>`<div class="score"><strong>${dimensions[index]}</strong><span>${score}/15</span></div><progress aria-label="${dimensions[index]}分数" max="15" value="${score}"></progress>`).join("")}
  <h2>为你推荐的支持方向</h2><p>以下五个方向供日常自我关照参考。标注的方向是本次分数最高的维度。</p>
  ${support.map(([title,body,action],index)=>`<article class="card"><h3>${index+1}. ${title}${max>0&&scores[index]===max?'<span class="tag">本次优先关注方向</span>':""}</h3><p>${body}</p><p><small>今天可以做：${action}</small></p></article>`).join("")}
