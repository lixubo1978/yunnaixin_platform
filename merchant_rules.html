<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      viewport-fit=cover
    "
  >

  <meta
    name="theme-color"
    content="#fff7fa"
  >

  <title>商户分成规则 - 孕乃馨</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {

      --pink-50: #fff7fa;
      --pink-100: #ffeef4;
      --pink-200: #ffd9e7;
      --pink-300: #fbbfd3;
      --pink-400: #f28aae;
      --pink-500: #e85d8f;
      --pink-600: #d94d7d;
      --pink-700: #b93667;
      --pink-800: #8e294f;

      --rose-dark: #61213d;

      --text-main: #29242a;
      --text-sub: #716a73;
      --text-light: #9f969e;

      --border: #eee5e9;
      --surface: #ffffff;
      --background: #fbf9fa;

      --green-bg: #edf9f2;
      --green-text: #278255;

      --gray-bg: #f4f2f3;
      --gray-text: #8b8389;

      --warning-bg: #fff7e8;
      --warning-text: #ad741b;

      --danger-bg: #fff0f2;
      --danger-text: #c53e59;

      --touch-size: 48px;

    }


    * {

      box-sizing: border-box;
      margin: 0;
      padding: 0;

      -webkit-tap-highlight-color: transparent;

    }


    html {

      min-height: 100%;

    }


    body {

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #fff9fb 0%,
          #fbf9fa 45%,
          #f8f8fa 100%
        );

      color: var(--text-main);

      font-size: 14px;

      line-height: 1.6;

      -webkit-font-smoothing: antialiased;

    }


    button,
    input,
    select {

      font: inherit;

    }


    button {

      cursor: pointer;

    }


    .hidden {

      display: none !important;

    }



    /* =========================================================
       顶部
    ========================================================= */

    .topbar {

      min-height: 70px;

      position: sticky;
      top: 0;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 0 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.95
        );

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid
        var(--border);

    }


    .brand {

      display: flex;
      align-items: center;

      gap: 11px;

      min-width: 0;

    }


    .brand-logo {

      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      object-fit: contain;

      border-radius: 12px;

      background: white;

    }


    .brand-title {

      font-size: 18px;

      font-weight: 720;

      color: var(--rose-dark);

    }


    .brand-subtitle {

      margin-top: 2px;

      font-size: 11px;

      color: var(--text-light);

    }


    .top-actions {

      display: flex;
      align-items: center;

      gap: 10px;

    }


    .back-btn,
    .logout-btn {

      min-height: 44px;

      padding: 0 15px;

      border: none;

      border-radius: 12px;

      font-size: 12px;

      font-weight: 650;

    }


    .back-btn {

      background: var(--pink-50);

      color: var(--pink-700);

      border:
        1px solid
        var(--pink-200);

    }


    .logout-btn {

      background:
        linear-gradient(
          135deg,
          var(--pink-500),
          var(--pink-600)
        );

      color: white;

    }



    /* =========================================================
       页面
    ========================================================= */

    .page {

      width: 100%;

      max-width: 1500px;

      margin: 0 auto;

      padding: 28px;

    }



    /* =========================================================
       标题
    ========================================================= */

    .hero {

      padding: 25px 27px;

      margin-bottom: 18px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #fff0f5,
          #ffe1ec
        );

      border:
        1px solid
        rgba(
          232,
          93,
          143,
          0.10
        );

    }


    .hero-tag {

      display: inline-block;

      padding: 4px 10px;

      margin-bottom: 8px;

      border-radius: 999px;

      background: rgba(255,255,255,.72);

      color: var(--pink-700);

      font-size: 10px;

      font-weight: 700;

    }


    .hero h1 {

      margin-bottom: 6px;

      font-size: 24px;

      color: var(--rose-dark);

    }


    .hero p {

      color: #875064;

      font-size: 13px;

    }



    /* =========================================================
       统计
    ========================================================= */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap: 12px;

      margin-bottom: 18px;

    }


    .stat-card {

      padding: 17px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

    }


    .stat-label {

      margin-bottom: 5px;

      font-size: 11px;

      color: var(--text-light);

    }


    .stat-value {

      font-size: 21px;

      font-weight: 750;

      color: var(--rose-dark);

    }



    /* =========================================================
       工具栏
    ========================================================= */

    .toolbar {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 10px;

      align-items: center;

      margin-bottom: 16px;

      padding: 15px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

    }


    .field {

      min-width: 0;

    }


    .field select {

      width: 100%;

      min-height: var(--touch-size);

      padding: 0 13px;

      border:
        1px solid
        #e7dde2;

      border-radius: 12px;

      outline: none;

      background: white;

      color: var(--text-main);

    }


    .field select:focus {

      border-color: var(--pink-400);

      box-shadow:
        0 0 0 3px
        rgba(232,93,143,.08);

    }



    /* =========================================================
       表格
    ========================================================= */

    .table-wrap {

      overflow-x: auto;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

    }


    table {

      width: 100%;

      min-width: 1200px;

      border-collapse: collapse;

    }


    th {

      padding: 14px 12px;

      text-align: left;

      white-space: nowrap;

      font-size: 11px;

      color: #887e85;

      background: #fffafb;

      border-bottom:
        1px solid
        var(--border);

    }


    td {

      padding: 14px 12px;

      border-bottom:
        1px solid
        #f2ecef;

      vertical-align: middle;

      font-size: 12px;

    }


    tr:last-child td {

      border-bottom: none;

    }


    tbody tr:hover {

      background: #fffafb;

    }


    .merchant-name {

      font-weight: 700;

      color: #3a3238;

    }


    .merchant-no {

      margin-top: 3px;

      font-size: 10px;

      color: var(--text-light);

    }


    .product-name {

      font-weight: 650;

    }



    /* =========================================================
       状态标签
    ========================================================= */

    .badge {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 27px;

      padding: 3px 9px;

      border-radius: 999px;

      white-space: nowrap;

      font-size: 10px;

      font-weight: 700;

    }


    .badge-active {

      background: var(--green-bg);

      color: var(--green-text);

    }


    .badge-inactive {

      background: var(--gray-bg);

      color: var(--gray-text);

    }


    .undefined {

      color: var(--warning-text);

      font-weight: 700;

    }


    .defined {

      color: #393238;

      font-weight: 650;

    }



    /* =========================================================
       按钮
    ========================================================= */

    .edit-btn {

      min-height: 38px;

      padding: 0 13px;

      border: none;

      border-radius: 10px;

      background: var(--pink-50);

      color: var(--pink-700);

      font-size: 11px;

      font-weight: 700;

      border:
        1px solid
        var(--pink-200);

    }


    .edit-btn:hover {

      background: var(--pink-100);

    }



    /* =========================================================
       空状态
    ========================================================= */

    .empty {

      padding: 60px 20px;

      text-align: center;

      color: var(--text-light);

    }


    .empty-icon {

      margin-bottom: 10px;

      font-size: 35px;

    }



    /* =========================================================
       手机卡片
    ========================================================= */

    .mobile-list {

      display: none;

    }


    .rule-card {

      padding: 17px;

      margin-bottom: 10px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

    }


    .rule-card-head {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;

    }


    .rule-card-title {

      font-size: 15px;

      font-weight: 720;

    }


    .rule-card-product {

      margin-top: 3px;

      font-size: 12px;

      color: var(--pink-700);

      font-weight: 650;

    }


    .detail-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 10px;

      margin-bottom: 14px;

    }


    .detail-item {

      padding: 10px;

      background: #fcfafb;

      border-radius: 11px;

    }


    .detail-label {

      margin-bottom: 3px;

      font-size: 10px;

      color: var(--text-light);

    }


    .detail-value {

      font-size: 12px;

      font-weight: 650;

      word-break: break-word;

    }


    .mobile-edit-btn {

      width: 100%;

      min-height: 46px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--pink-500),
          var(--pink-600)
        );

      color: white;

      font-size: 13px;

      font-weight: 700;

    }



    /* =========================================================
       模态窗口
    ========================================================= */

    .modal-mask {

      position: fixed;

      inset: 0;

      z-index: 5000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 18px;

      background:
        rgba(
          48,
          31,
          39,
          .42
        );

      backdrop-filter: blur(4px);

    }


    .modal {

      width: 100%;

      max-width: 520px;

      max-height: 90vh;

      overflow-y: auto;

      padding: 23px;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 20px 60px
        rgba(80,30,50,.18);

    }


    .modal-title {

      margin-bottom: 4px;

      font-size: 19px;

      font-weight: 750;

      color: var(--rose-dark);

    }


    .modal-subtitle {

      margin-bottom: 19px;

      font-size: 12px;

      color: var(--text-sub);

    }


    .form-group {

      margin-bottom: 14px;

    }


    .form-label {

      display: block;

      margin-bottom: 6px;

      font-size: 12px;

      font-weight: 650;

      color: #554b52;

    }


    .form-input {

      width: 100%;

      min-height: 48px;

      padding: 0 13px;

      border:
        1px solid
        #e6dce1;

      border-radius: 12px;

      outline: none;

    }


    .form-input:focus {

      border-color: var(--pink-400);

      box-shadow:
        0 0 0 3px
        rgba(232,93,143,.08);

    }


    .form-help {

      margin-top: 5px;

      font-size: 10px;

      color: var(--text-light);

    }


    .modal-info {

      margin-bottom: 16px;

      padding: 12px;

      border-radius: 12px;

      background: var(--pink-50);

      color: #7e4960;

      font-size: 11px;

      line-height: 1.7;

    }


    .modal-actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 19px;

    }


    .cancel-btn,
    .save-btn {

      min-height: 48px;

      border: none;

      border-radius: 12px;

      font-size: 13px;

      font-weight: 700;

    }


    .cancel-btn {

      background: #f5f2f4;

      color: #6f666d;

    }


    .save-btn {

      background:
        linear-gradient(
          135deg,
          var(--pink-500),
          var(--pink-600)
        );

      color: white;

    }


    .save-btn:disabled {

      opacity: .55;

      cursor: not-allowed;

    }



    /* =========================================================
       加载
    ========================================================= */

    .loading-mask {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          180deg,
          #fff8fb,
          #ffffff
        );

    }


    .spinner {

      width: 40px;
      height: 40px;

      margin-bottom: 13px;

      border:
        4px solid
        var(--pink-100);

      border-top-color:
        var(--pink-500);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }


    .loading-text {

      color: var(--text-sub);

      font-size: 12px;

    }



    /* =========================================================
       Toast
    ========================================================= */

    .toast {

      position: fixed;

      left: 50%;
      bottom: 30px;

      z-index: 8000;

      transform: translateX(-50%);

      max-width:
        calc(100% - 30px);

      padding: 11px 17px;

      border-radius: 12px;

      background: #382f35;

      color: white;

      font-size: 12px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.15);

    }



    /* =========================================================
       响应式
    ========================================================= */

    @media (max-width: 900px) {

      .stats {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

      }

    }


    @media (max-width: 760px) {

      .topbar {

        min-height: 64px;

        padding:
          max(
            4px,
            env(safe-area-inset-top)
          )
          12px
          4px;

      }


      .brand-logo {

        width: 38px;
        height: 38px;

        flex-basis: 38px;

      }


      .brand-title {

        font-size: 16px;

      }


      .brand-subtitle {

        display: none;

      }


      .top-actions {

        gap: 6px;

      }


      .back-btn,
      .logout-btn {

        min-height: 42px;

        padding: 0 11px;

        font-size: 11px;

      }


      .page {

        padding: 13px;

      }


      .hero {

        padding: 20px 18px;

        margin-bottom: 12px;

        border-radius: 18px;

      }


      .hero h1 {

        font-size: 20px;

      }


      .hero p {

        font-size: 12px;

      }


      .stats {

        gap: 8px;

        margin-bottom: 12px;

      }


      .stat-card {

        padding: 13px;

        border-radius: 14px;

      }


      .stat-value {

        font-size: 18px;

      }


      .toolbar {

        grid-template-columns: 1fr;

        padding: 11px;

        gap: 8px;

        border-radius: 15px;

      }


      .table-wrap {

        display: none;

      }


      .mobile-list {

        display: block;

      }


      .modal-mask {

        align-items: flex-end;

        padding: 0;

      }


      .modal {

        max-width: none;

        max-height: 92vh;

        border-radius:
          22px
          22px
          0
          0;

        padding:
          22px
          17px
          calc(
            22px
            + env(safe-area-inset-bottom)
          );

      }

    }

  </style>

</head>


<body>


<!-- =========================================================
     加载
========================================================= -->

<div
  id="loadingMask"
  class="loading-mask"
>

  <div class="spinner"></div>

  <div class="loading-text">
    正在读取商户分成规则...
  </div>

</div>



<!-- =========================================================
     顶部
========================================================= -->

<header class="topbar">


  <div class="brand">


    <img
      src="./logo.jpeg"
      class="brand-logo"
      alt="孕乃馨 Logo"
    >


    <div>


      <div class="brand-title">
        商户分成规则
      </div>


      <div class="brand-subtitle">
        孕乃馨平台管理中心
      </div>


    </div>


  </div>



  <div class="top-actions">


    <button
      type="button"
      class="back-btn"
      onclick="goBack()"
    >
      返回首页
    </button>


    <button
      type="button"
      class="logout-btn"
      onclick="logout()"
    >
      退出
    </button>


  </div>


</header>



<main class="page">


  <!-- =======================================================
       页面说明
  ======================================================== -->

  <section class="hero">


    <div class="hero-tag">
      MERCHANT RULES
    </div>


    <h1>
      商户分成规则
    </h1>


    <p>
      每个有效商户自动拥有全部有效平台产品的分成规则。
      新规则初始化为“未定义”，商户与平台沟通确认后，由平台管理人员统一填写。
      商户只能查看，不能自行修改。
    </p>


  </section>



  <!-- =======================================================
       统计
  ======================================================== -->

  <section class="stats">


    <div class="stat-card">

      <div class="stat-label">
        规则总数
      </div>

      <div
        id="statTotal"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        涉及商户
      </div>

      <div
        id="statMerchants"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        完全已定义
      </div>

      <div
        id="statDefined"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        存在未定义
      </div>

      <div
        id="statUndefined"
        class="stat-value"
      >
        0
      </div>

    </div>


  </section>



  <!-- =======================================================
       筛选
  ======================================================== -->

  <section class="toolbar">


    <!-- 已开展业务城市 -->

    <div class="field">

      <select id="cityFilter">

        <option value="">
          全部已开展业务城市
        </option>

      </select>

    </div>


    <!-- 商户 -->

    <div class="field">

      <select id="merchantFilter">

        <option value="">
          全部商户
        </option>

      </select>

    </div>


    <!-- 规则状态 -->

    <div class="field">

      <select id="statusFilter">

        <option value="">
          全部规则
        </option>

        <option value="undefined">
          存在未定义
        </option>

        <option value="defined">
          完全已定义
        </option>

      </select>

    </div>


  </section>



  <!-- =======================================================
       电脑表格
  ======================================================== -->

  <section class="table-wrap">


    <table>


      <thead>

        <tr>

          <th>商户</th>

          <th>服务区域</th>

          <th>产品</th>

          <th>城市销售价</th>

          <th>税率</th>

          <th>平台比例</th>

          <th>门店比例</th>

          <th>操作人员比例</th>

          <th>状态</th>

          <th>操作</th>

        </tr>

      </thead>


      <tbody id="rulesTableBody">

      </tbody>


    </table>


    <div
      id="desktopEmpty"
      class="empty hidden"
    >

      <div class="empty-icon">
        📊
      </div>

      暂无符合条件的商户分成规则

    </div>


  </section>



  <!-- =======================================================
       手机列表
  ======================================================== -->

  <section
    id="mobileList"
    class="mobile-list"
  >
  </section>


  <div
    id="mobileEmpty"
    class="empty hidden"
  >

    <div class="empty-icon">
      📊
    </div>

    暂无符合条件的商户分成规则

  </div>


</main>



<!-- =========================================================
     编辑窗口
========================================================= -->

<div
  id="editModal"
  class="modal-mask hidden"
  onclick="modalMaskClick(event)"
>


  <div class="modal">


    <div class="modal-title">
      定义商户分成规则
    </div>


    <div
      id="modalSubtitle"
      class="modal-subtitle"
    >
      -
    </div>


    <div class="modal-info">

      本规则由平台管理人员维护。
      商户端只能查看。
      留空即表示“未定义”。

    </div>



    <div class="form-group">


      <label class="form-label">
        税率（%）
      </label>


      <input
        id="taxRateInput"
        class="form-input"
        type="number"
        min="0"
        max="100"
        step="0.01"
        placeholder="未定义"
      >


      <div class="form-help">
        例如：6 表示 6%
      </div>


    </div>



    <div class="form-group">


      <label class="form-label">
        平台比例（%）
      </label>


      <input
        id="platformRatioInput"
        class="form-input"
        type="number"
        min="0"
        max="100"
        step="0.01"
        placeholder="未定义"
      >


    </div>



    <div class="form-group">


      <label class="form-label">
        门店比例（%）
      </label>


      <input
        id="storeRatioInput"

/* ==========================================================
   04. 工具函数
========================================================== */


function isPlatformManager(
  role
) {


  return [

    "founder",

    "platform_admin"

  ].includes(
    role
  );

}



function escapeHtml(
  value
) {


  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}



function formatPercent(
  value
) {


  if (
    value === null
    ||
    value === undefined
    ||
    value === ""
  ) {


    return `
      <span class="undefined">
        未定义
      </span>
    `;

  }


  return `
    <span class="defined">
      ${escapeHtml(value)}%
    </span>
  `;

}



function formatPrice(
  value
) {


  if (
    value === null
    ||
    value === undefined
    ||
    value === ""
  ) {


    return `
      <span class="undefined">
        未定义
      </span>
    `;

  }


  const number =
    Number(value);


  if (
    Number.isNaN(number)
  ) {


    return escapeHtml(
      value
    );

  }


  return `
    <span class="defined">
      ¥${number.toFixed(2)}
    </span>
  `;

}



function isRuleFullyDefined(
  rule
) {


  return (

    rule.tax_rate !== null
    &&
    rule.tax_rate !== undefined
    &&
    rule.platform_ratio !== null
    &&
    rule.platform_ratio !== undefined
    &&
    rule.store_ratio !== null
    &&
    rule.store_ratio !== undefined
    &&
    rule.operator_ratio !== null
    &&
    rule.operator_ratio !== undefined

  );

}



function showToast(
  message
) {

      },

      2600

    );

}



/* ==========================================================
   05. 商户编号
========================================================== */


function getMerchantNumber(
  merchant
) {


  if (!merchant) {

    return "-";

  }


  const raw =
    merchant.record_no
    ??
    merchant.account_no
    ??
    merchant.merchant_no
    ??
    null;


  if (
    raw === null
    ||
    raw === undefined
  ) {


    return "-";

  }


  const numeric =
    Number(raw);


  if (
    Number.isFinite(numeric)
  ) {


    return String(
      numeric
    ).padStart(
      3,
      "0"
    );

  }


  return String(raw);

}



/* ==========================================================
   06. 商户名称
========================================================== */


function getMerchantName(
  merchant
) {


  if (!merchant) {

    return "未知商户";

  }


  return (

    merchant.merchant_name
    ||
    merchant.name
    ||
    merchant.full_name
    ||
    "未命名商户"

  );

}



/* ==========================================================
   07. 产品名称
========================================================== */


function getProductName(
  product
) {


  if (!product) {

    return "未知产品";

  }


  return (

    product.product_name
    ||
    product.name
    ||
    "未命名产品"

  );

}



/* ==========================================================
   08. 获取商户城市ID
========================================================== */


function getMerchantCityId(
  merchant
) {


  if (!merchant) {

    return null;

  }


  let cityId =
    merchant.city_id
    ??
    null;


  if (
    merchant.service_area_id
    &&
    serviceAreasMap.has(
      String(
        merchant.service_area_id
      )
    )
  ) {


    const area =
      serviceAreasMap.get(
        String(
          merchant.service_area_id
        )
      );


    cityId =
      area.city_id
      ??
      cityId;

  }


  return cityId;

}



/* ==========================================================
   09. 服务区域显示
========================================================== */


function getServiceAreaText(
  merchant
) {


  if (!merchant) {

    return "-";

  }


  let provinceId =
    merchant.province_id;


  let cityId =
    merchant.city_id;


  if (
    merchant.service_area_id
    &&
    serviceAreasMap.has(
      String(
        merchant.service_area_id
      )
    )
  ) {


    const area =
      serviceAreasMap.get(
        String(
          merchant.service_area_id
        )
      );


    provinceId =
      area.province_id
      ??
      provinceId;


    cityId =
      area.city_id
      ??
      cityId;

  }


  const province =
    provincesMap.get(
      String(
        provinceId
      )
    );


  const city =
    citiesMap.get(
      String(
        cityId
      )
    );


  const provinceName =
    province?.province_name
    ||
    "";


  const cityName =
    city?.city_name
    ||
    "";


  if (
    provinceName
    &&
    cityName
  ) {


    return `${provinceName} · ${cityName}`;

  }


  return (
    cityName
    ||
    provinceName
    ||
    "-"
  );

}



/* ==========================================================
   10. 城市价格
========================================================== */


function getCityPrice(
  rule
) {


  const merchant =
    merchantsMap.get(
      String(
        rule.merchant_id
      )
    );


  if (!merchant) {

    return null;

  }


  const cityId =
    getMerchantCityId(
      merchant
    );


  if (!cityId) {

    return null;

  }


  const key =
    `${cityId}_${rule.product_id}`;


  const price =
    cityPricesMap.get(
      key
    );


  return price?.price ?? null;

}

async function verifyAccess() {


  const {

    data: {
      session
    },

    error: sessionError

  } =

  await supabaseClient.auth
    .getSession();



  if (
    sessionError
    ||
    !session
  ) {


    window.location.href =
      LOGIN_PAGE;


    return false;

  }



  currentUser =
    session.user;



  const {

    data: profile,

    error: profileError

  } =

  await supabaseClient

    .from(
      "profiles"
    )

    .select(`
      id,
      full_name,
      role,
      status
    `)

    .eq(
      "id",
      currentUser.id
    )

    .maybeSingle();



  if (
    profileError
    ||
    !profile
  ) {


    await supabaseClient.auth
      .signOut();


    alert(
      "无法读取当前管理人员资料。"
    );


    window.location.href =
      LOGIN_PAGE;


    return false;

  }



  if (
    profile.status !==
    "active"
  ) {


    await supabaseClient.auth
      .signOut();


    alert(
      "当前账号已经停用。"
    );


    window.location.href =
      LOGIN_PAGE;


    return false;

  }



  if (
    !isPlatformManager(
      profile.role
    )
  ) {


    alert(
      "当前账号没有商户分成规则管理权限。"
    );


    window.location.href =
      HOME_PAGE;


    return false;

  }



  currentProfile =
    profile;


  return true;

}

  ] =

  merchantsMap =

          item

/* ==========================================================
   14. 已开展业务城市下拉菜单
========================================================== */


function buildCityFilter() {


  const select =
    document.getElementById(
      "cityFilter"
    );


  select.innerHTML =
    `
      <option value="">
        全部已开展业务城市
      </option>
    `;



  const activeAreas =

    Array.from(
      serviceAreasMap.values()
    )

    .filter(

      area =>
        area.status ===
        "active"

    )

    .filter(

      area =>
        area.city_id

    )

    .sort(

      (
        a,
        b
      ) => {


        const cityA =
          citiesMap.get(
            String(
              a.city_id
            )
          );


        const cityB =
          citiesMap.get(
            String(
              b.city_id
            )
          );


        const nameA =
          cityA?.city_name
          ||
          "";


        const nameB =
          cityB?.city_name
          ||
          "";


        return nameA.localeCompare(
          nameB,
          "zh-CN"
        );

      }

    );



  const usedCities =
    new Set();



  activeAreas.forEach(

    area => {


      const cityId =
        String(
          area.city_id
        );


      if (
        usedCities.has(
          cityId
        )
      ) {


        return;

      }


      usedCities.add(
        cityId
      );



      const city =
        citiesMap.get(
          cityId
        );


      const province =
        provincesMap.get(
          String(
            area.province_id
          )
        );


      if (!city) {

        return;

      }



      const option =
        document.createElement(
          "option"
        );


      option.value =
        cityId;



      const provinceName =
        province?.province_name
        ||
        "";


      option.textContent =
        provinceName
        ?
        `${provinceName} · ${city.city_name}`
        :
        city.city_name;



      select.appendChild(
        option
      );

    }

  );

}



/* ==========================================================
   15. 商户下拉菜单
   会根据城市自动联动
========================================================== */


function buildMerchantFilter() {


  const select =
    document.getElementById(
      "merchantFilter"
    );


  const selectedCityId =
    document.getElementById(
      "cityFilter"
    ).value;



  const oldValue =
    select.value;



  select.innerHTML =
    `
      <option value="">
        全部商户
      </option>
    `;



  const merchants =

    Array.from(
      merchantsMap.values()
    )

    .filter(

      merchant =>
        merchant.status ===
        "active"

    )

    .filter(

      merchant => {


        if (
          !selectedCityId
        ) {


          return true;

        }


        const cityId =
          getMerchantCityId(
            merchant
          );


        return (
          String(cityId)
          ===
          String(selectedCityId)
        );

      }

    )

    .sort(

      (
        a,
        b
      ) => {


        const noA =
          Number(
            a.record_no
            ??
            a.account_no
            ??
            999999999
          );


        const noB =
          Number(
            b.record_no
            ??
            b.account_no
            ??
            999999999
          );


        return noA - noB;

      }

    );



  merchants.forEach(

    merchant => {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        merchant.id;


      option.textContent =
        `${getMerchantNumber(merchant)}｜${getMerchantName(merchant)}`;


      select.appendChild(
        option
      );

    }

  );



  const exists =
    merchants.some(

      merchant =>
        String(
          merchant.id
        )
        ===
        String(
          oldValue
        )

    );



  if (exists) {


    select.value =
      oldValue;

  }

  else {


    select.value =
      "";

  }

}



/* ==========================================================
   16. 筛选
========================================================== */


function applyFilters() {


  const cityId =
    document.getElementById(
      "cityFilter"
    ).value;



  const merchantId =
    document.getElementById(
      "merchantFilter"
    ).value;



  const statusFilter =
    document.getElementById(
      "statusFilter"
    ).value;



  filteredRules =

    allRules.filter(

      rule => {


        const merchant =
          merchantsMap.get(
            String(
              rule.merchant_id
            )
          );


        const product =
          productsMap.get(
            String(
              rule.product_id
            )
          );


        if (
          !merchant
          ||
          !product
        ) {


          return false;

        }



        if (
          merchant.status !==
          "active"
        ) {


          return false;

        }



        if (
          product.status !==
          "active"
        ) {


          return false;

        }



        if (
          rule.status !==
          "active"
        ) {


          return false;

        }



        if (cityId) {


          const merchantCityId =
            getMerchantCityId(
              merchant
            );


          if (
            String(
              merchantCityId
            )
            !==
            String(
              cityId
            )
          ) {


            return false;

          }

        }



        if (
          merchantId
          &&
          String(
            rule.merchant_id
          )
          !==
          merchantId
        ) {


          return false;

        }



        const fullyDefined =
          isRuleFullyDefined(
            rule
          );



        if (
          statusFilter ===
          "defined"
          &&
          !fullyDefined
        ) {


          return false;

        }



        if (
          statusFilter ===
          "undefined"
          &&
          fullyDefined
        ) {


          return false;

        }



        return true;

      }

    );



  renderRules();

}



/* ==========================================================
   17. 统计
   统计当前筛选结果
========================================================== */


function updateStats() {


  const rules =
    filteredRules;



  const merchantIds =
    new Set(

      rules.map(
        rule =>
          String(
            rule.merchant_id
          )
      )

    );



  const definedCount =

    rules.filter(
      isRuleFullyDefined
    ).length;



  const undefinedCount =

    rules.length
    -
    definedCount;



  document.getElementById(
    "statTotal"
  ).textContent =
    rules.length;



  document.getElementById(
    "statMerchants"
  ).textContent =
    merchantIds.size;



  document.getElementById(
    "statDefined"
  ).textContent =
    definedCount;



  document.getElementById(
    "statUndefined"
  ).textContent =
    undefinedCount;

}

========================================================== */

  renderDesktopTable();

  renderMobileList();

  updateStats();

}

    productsMap.get(

      )

/* ==========================================================
   23. 数值处理
========================================================== */


function parseOptionalPercent(
  inputId
) {


  const raw =

    document.getElementById(
      inputId
    )
    .value
    .trim();



  if (
    raw === ""
  ) {


    return null;

  }



  const value =
    Number(raw);



  if (
    !Number.isFinite(
      value
    )
    ||
    value < 0
    ||
    value > 100
  ) {


    throw new Error(
      "比例和税率必须填写 0～100 之间的数字，或者留空表示未定义。"
    );

  }



  return value;

}



/* ==========================================================
   24. 保存规则
========================================================== */


async function saveRule() {


  if (
    editingRuleId === null
  ) {


    return;

  }



  let taxRate;

  let platformRatio;

  let storeRatio;

  let operatorRatio;



  try {


    taxRate =
      parseOptionalPercent(
        "taxRateInput"
      );


    platformRatio =
      parseOptionalPercent(
        "platformRatioInput"
      );


    storeRatio =
      parseOptionalPercent(
        "storeRatioInput"
      );


    operatorRatio =
      parseOptionalPercent(
        "operatorRatioInput"
      );


  }

  catch (error) {


    alert(
      error.message
    );


    return;

  }



  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "保存中...";



  try {


    const {

      data,

      error

    } =

    await supabaseClient

      .from(
        "merchant_product_rules"
      )

      .update({

        tax_rate:
          taxRate,

        platform_ratio:
          platformRatio,

        store_ratio:
          storeRatio,

        operator_ratio:
          operatorRatio

      })

      .eq(
        "id",
        editingRuleId
      )

      .select(`
        id,
        merchant_id,
        product_id,
        tax_rate,
        platform_ratio,
        store_ratio,
        operator_ratio,
        status,
        created_at,
        updated_at,
        updated_by
      `)

      .maybeSingle();



    if (error) {


      throw error;

    }



    if (!data) {


      throw new Error(
        "规则保存失败，数据库没有返回更新记录。"
      );

    }



    const index =
      allRules.findIndex(

        item =>
          Number(item.id)
          ===
          Number(editingRuleId)

      );



    if (
      index >= 0
    ) {


      allRules[index] =
        data;

    }



    closeEditModal();


    applyFilters();


    showToast(
      "商户分成规则已保存"
    );


  }

  catch (error) {


    console.error(
      "保存商户分成规则失败：",
      error
    );


    alert(
      "保存失败：" +
      (
        error.message
        ||
        "未知错误"
      )
    );


  }

  finally {


    saveButton.disabled =
      false;


    saveButton.textContent =
      "保存";

  }

}

    await loadRules();

    applyFilters();

      "loadingMask"

  }

  catch (error) {

      "页面初始化失败：",
      error
    );


    document.getElementById(
      "loadingMask"
    ).style.display =
      "none";


    alert(
      "读取商户分成规则失败：" +
      (
        error.message

    );

  }

}

    return;

  }



  try {


    await supabaseClient.auth

  catch (error) {


    console.error(
      "退出失败：",
      error
    );

  }



  window.location.href =
    LOGIN_PAGE;

}
