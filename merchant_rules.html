<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>商户分账规则管理</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:"Microsoft YaHei",Arial;
}


body{

margin:0;

background:#fff7fa;

color:#5b2333;

}



.header{

height:70px;

background:white;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 30px;

border-bottom:1px solid #f2d8e2;

}



.logo{

font-size:22px;

font-weight:bold;

color:#df4f7d;

}



button{

cursor:pointer;

border:none;

border-radius:20px;

padding:10px 20px;

}



.btn-back{

background:white;

border:1px solid #efbfd0;

}



.btn-out{

background:#df4f7d;

color:white;

}



.container{

width:1200px;

max-width:95%;

margin:30px auto;

}



.card{

background:white;

border-radius:18px;

padding:25px;

margin-bottom:25px;

box-shadow:0 5px 20px rgba(200,100,130,.08);

}



.title{

background:#ffe8f0;

}



.title h1{

margin:0 0 10px;

}



.select-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

}



label{

display:block;

margin-bottom:8px;

color:#966273;

}



select,input{

width:100%;

height:42px;

border:1px solid #efd5df;

border-radius:10px;

padding:0 12px;

}



.table-box{

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#fff0f5;

}



td,th{

padding:14px;

border-bottom:1px solid #f3e2e8;

text-align:center;

}



.lock-row{

background:#eeeeee;

opacity:.75;

}



.badge{

padding:5px 12px;

border-radius:15px;

background:#ddffe9;

color:#178542;

}



.pending{

background:#fff1cf;

color:#b47700;

}



.set-btn{

background:#df4f7d;

color:white;

}



.lock-btn{

background:#cccccc;

color:#666;

}



.edit-box{

display:none;

}



.rule-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}



.rule-item{

background:#fff6f9;

padding:15px;

border-radius:12px;

}



.rule-item span{

display:block;

margin-bottom:8px;

}



.total{

margin-top:20px;

background:#fff0f5;

padding:15px;

font-size:18px;

}



.save-btn{

margin-top:20px;

background:#df4f7d;

color:white;

}



</style>

</head>


<body>


<div class="header">


<div class="logo">

🌸 商户六方分账配置中心

</div>


<div>

<button class="btn-back" onclick="goBack()">

返回工作台

</button>


<button class="btn-out" onclick="logout()">

退出

</button>

</div>


</div>


<div class="container">


<div class="card title">


<h1>

产品分账规则管理

</h1>


<p>

每个商户显示全部可经营服务项目。
已经定义并生效的规则自动锁定。

</p>


</div>



<div class="card">


<h3>

选择商户

</h3>


<div class="select-grid">


<div>

<label>省份</label>

<select id="provinceSelect"></select>

</div>



<div>

<label>城市</label>

<select id="citySelect">

<option>请选择城市</option>

</select>

</div>



<div>

<label>商户</label>

<select id="merchantSelect">

<option>请选择商户</option>

</select>

</div>


</div>


</div>





<div class="card">


<h3>

全部服务项目

</h3>



<div class="table-box">


<table>


<thead>

<tr>

<th>
服务项目
</th>


<th>
状态
</th>


<th>
当前分账比例
</th>


<th>
操作
</th>


</tr>


</thead>


<tbody id="productList">


</tbody>


</table>


</div>


</div>
<script>


/* ===============================
 Supabase 配置
================================ */


const SUPABASE_URL =
"https://你的项目.supabase.co";


const SUPABASE_KEY =
"你的anon-key";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let currentUser=null;

let selectedProductId=null;



/* ===============================
 初始化
================================ */


window.onload=async()=>{


await checkLogin();


await loadProvinces();


bindEvents();


};





/* ===============================
 登录检查
================================ */


async function checkLogin(){


const {

data:{
user}

}
=
await supabaseClient.auth.getUser();



if(!user){

location.href="login.html";

return;

}


currentUser=user;


}





/* ===============================
 加载省份
================================ */


async function loadProvinces(){



const {

data

}
=
await supabaseClient

.from("provinces")

.select(
"id,name"
)

.eq(
"status",
"active"
)

.order(
"id"
);



let box=
document.getElementById(
"provinceSelect"
);



box.innerHTML="";


data?.forEach(p=>{


let op=
document.createElement(
"option"
);


op.value=p.id;

op.textContent=p.name;


box.appendChild(op);


});



await loadCities();


}





/* ===============================
 加载城市
================================ */


async function loadCities(){



let provinceId=
document.getElementById(
"provinceSelect"
).value;



let box=
document.getElementById(
"citySelect"
);



box.innerHTML=
"<option>加载中...</option>";




const {

data

}
=
await supabaseClient

.from("cities")

.select(
"id,city_name"
)

.eq(
"province_id",
provinceId
)

.eq(
"status",
"active"
);



box.innerHTML=
"<option value=''>请选择城市</option>";



data?.forEach(c=>{


let op=
document.createElement(
"option"
);


op.value=c.id;


op.textContent=
c.city_name;


box.appendChild(op);



});


}





/* ===============================
 加载商户
================================ */


async function loadMerchants(){



let cityId=
document.getElementById(
"citySelect"
).value;



let box=
document.getElementById(
"merchantSelect"
);



box.innerHTML=
"<option>加载中...</option>";



if(!cityId)
return;



const {

data

}
=
await supabaseClient

.from("merchants")

.select(
"id,merchant_name"
)

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);



box.innerHTML=
"<option value=''>请选择商户</option>";



data?.forEach(m=>{


let op=
document.createElement(
"option"
);


op.value=m.id;


op.textContent=
m.merchant_name;


box.appendChild(op);



});



}




/* ===============================
 加载商户全部产品
================================ */


async function loadMerchantProducts(){



let merchantId=
document.getElementById(
"merchantSelect"
).value;



let cityId=
document.getElementById(
"citySelect"
).value;



let tbody=
document.getElementById(
"productList"
);



tbody.innerHTML=
"";


if(!merchantId)
return;



/*

第一步：
读取城市可销售产品

*/


const {

data:prices

}
=
await supabaseClient

.from("city_prices")

.select(`

product_id,

products(

id,

product_name

)

`)

.eq(
"city_id",
cityId
)

.eq(
"status",
"active"
);





if(!prices || prices.length===0){


tbody.innerHTML=

"<tr><td colspan='4'>暂无服务项目</td></tr>";

return;


}



/*

第二步：
读取已经存在的分账规则

*/


const {

data:rules

}
=
await supabaseClient

.from("merchant_product_rules")

.select("*")

.eq(
"merchant_id",
merchantId
)

.eq(
"status",
"active"
);





/*

第三步：
合并显示

*/


prices.forEach(item=>{


let rule =
rules?.find(

r=>

r.product_id===item.product_id

);



let tr=
document.createElement(
"tr"
);




if(rule){


tr.className=
"lock-row";



tr.innerHTML=`

<td>

${item.products.product_name}

</td>


<td>

<span class="badge">

已生效

</span>

</td>


<td>

平台 ${rule.platform_ratio || 0}%<br>

城市 ${rule.city_manager_ratio || 0}%<br>

商户 ${rule.store_ratio || 0}%<br>

服务人员 ${rule.operator_ratio || 0}%<br>

顾问 ${rule.order_source_ratio || 0}%<br>

软件 ${rule.software_service_ratio || 2}%

</td>


<td>

<button class="lock-btn">

已锁定

</button>

</td>

`;



}

else{


tr.innerHTML=`

<td>

${item.products.product_name}

</td>


<td>

<span class="pending">

未定义

</span>

</td>


<td>

--

</td>


<td>


<button

class="set-btn"

onclick="openRule(${item.product_id},'${item.products.product_name}')

">

设置分账

</button>


</td>

`;



}




tbody.appendChild(tr);



});



}





/* ===============================
 打开设置窗口
================================ */


function openRule(
productId,
productName
){



selectedProductId=
productId;



document.getElementById(
"editTitle"
).innerHTML=

"设置服务项目："
+
productName;



document.querySelector(
".edit-box"
).style.display=
"block";



[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

].forEach(id=>{


document.getElementById(id).value=0;


});



calculateTotal();



window.scrollTo(
0,
document.body.scrollHeight
);



}





/* ===============================
 事件绑定
================================ */


function bindEvents(){



document.getElementById(
"provinceSelect"
)
.onchange=
loadCities;




document.getElementById(
"citySelect"
)
.onchange=
async()=>{


await loadMerchants();


};





document.getElementById(
"merchantSelect"
)
.onchange=
loadMerchantProducts;




[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

]
.forEach(id=>{


document.getElementById(id)
.oninput=
calculateTotal;



});



}





/* ===============================
比例计算
================================ */


function calculateTotal(){


let total=2;


[
"cityRatio",
"platformRatio",
"merchantRatio",
"workerRatio",
"advisorRatio"

]
.forEach(id=>{


total +=

Number(
document.getElementById(id).value||0
);


});



document.getElementById(
"totalRatio"
)
.innerText=
total;



}



    <!-- ===============================
     分账规则编辑窗口
================================ -->


<div class="card edit-box">


<h3 id="editTitle">

设置分账规则

</h3>



<div class="rule-grid">



<div class="rule-item">

<span>

城市负责人 %

</span>


<input

id="cityRatio"

type="number"

value="0"

min="0"

>


</div>





<div class="rule-item">


<span>

软件服务商 %

</span>


<input

id="softwareRatio"

type="number"

value="2"

readonly

>


</div>





<div class="rule-item">


<span>

运营平台 %

</span>


<input

id="platformRatio"

type="number"

value="0"

min="0"

>


</div>






<div class="rule-item">


<span>

商户 %

</span>


<input

id="merchantRatio"

type="number"

value="0"

min="0"

>


</div>






<div class="rule-item">


<span>

服务人员 %

</span>


<input

id="workerRatio"

type="number"

value="0"

min="0"

>


</div>






<div class="rule-item">


<span>

健康顾问 %

</span>


<input

id="advisorRatio"

type="number"

value="0"

min="0"

>


</div>



</div>





<div class="total">


当前比例合计：

<span id="totalRatio">

2

</span>

%

</div>




<button

class="save-btn"

onclick="saveRule()"

>

保存分账规则

</button>



</div>





</div>




<script>



/* ===============================
 保存分账规则
================================ */


async function saveRule(){



if(!selectedProductId){


alert(
"请选择服务项目"
);


return;


}




let merchantId=

document.getElementById(
"merchantSelect"
).value;




if(!merchantId){


alert(
"请选择商户"
);


return;


}





let total=

Number(

document.getElementById(
"totalRatio"
).innerText

);





if(total!==100){


alert(
"六方比例必须等于100%"
);


return;


}







let ruleData={



merchant_id:

merchantId,



product_id:

selectedProductId,



rule_type:

"standard",





city_manager_ratio:

Number(
document.getElementById(
"cityRatio"
).value||0
),




platform_ratio:

Number(
document.getElementById(
"platformRatio"
).value||0
),





store_ratio:

Number(
document.getElementById(
"merchantRatio"
).value||0
),





operator_ratio:

Number(
document.getElementById(
"workerRatio"
).value||0
),




order_source_ratio:

Number(
document.getElementById(
"advisorRatio"
).value||0
),




software_service_ratio:

2,



status:

"active",



version_no:

1,



created_by:

currentUser.id



};







/*

检查是否已经存在

理论上前端已经过滤

这里再次保护

*/


const {

data:exist

}

=

await supabaseClient

.from(
"merchant_product_rules"
)

.select(
"id"
)

.eq(
"merchant_id",
merchantId
)

.eq(
"product_id",
selectedProductId
)

.eq(
"status",
"active"
);






if(exist && exist.length){


alert(
"该项目已经存在有效规则，不能重复创建"
);


return;


}








const {

error

}

=

await supabaseClient

.from(
"merchant_product_rules"
)

.insert(
ruleData
);







if(error){


alert(
"保存失败："
+
error.message
);


return;


}





alert(
"分账规则保存成功"
);





document.querySelector(
".edit-box"
).style.display=
"none";





await loadMerchantProducts();




}







/* ===============================
 返回
================================ */


function goBack(){


location.href=
"wholemanagement.html";


}





/* ===============================
退出
================================ */


async function logout(){


await supabaseClient.auth.signOut();



location.href=
"login.html";


}



</script>



</body>

</html>
