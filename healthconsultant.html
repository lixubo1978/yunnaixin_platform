<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    'https://qbuqjwpkltbjhlfbyjyb.supabase.co';

const SUPABASE_ANON_KEY =
    'sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================================================
   页面
========================================================= */

const LOGIN_PAGE =
    './login.html';


const loadingBox =
    document.getElementById(
        'loadingBox'
    );

const mainContent =
    document.getElementById(
        'mainContent'
    );

const errorBox =
    document.getElementById(
        'errorBox'
    );

const consultantName =
    document.getElementById(
        'consultantName'
    );

const consultantNo =
    document.getElementById(
        'consultantNo'
    );

const consultantEmail =
    document.getElementById(
        'consultantEmail'
    );

const consultantArea =
    document.getElementById(
        'consultantArea'
    );

const projectCount =
    document.getElementById(
        'projectCount'
    );

const projectTableBody =
    document.getElementById(
        'projectTableBody'
    );

const mobileList =
    document.getElementById(
        'mobileList'
    );

const tableCard =
    document.getElementById(
        'tableCard'
    );

const emptyBox =
    document.getElementById(
        'emptyBox'
    );

const logoutButton =
    document.getElementById(
        'logoutButton'
    );


/* =========================================================
   当前登录信息
========================================================= */

let currentUser = null;

let currentProfile = null;

let currentConsultant = null;

let currentServiceArea = null;

let projectRules = [];


/* =========================================================
   HTML安全
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ''
    )
    .replaceAll(
        '&',
        '&amp;'
    )
    .replaceAll(
        '<',
        '&lt;'
    )
    .replaceAll(
        '>',
        '&gt;'
    )
    .replaceAll(
        '"',
        '&quot;'
    )
    .replaceAll(
        "'",
        '&#039;'
    );
}


/* =========================================================
   数字
========================================================= */

function formatMoney(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return '未定义';
    }


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return '未定义';
    }


    return '¥' +
        number.toLocaleString(
            'zh-CN',
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );
}


function formatRatio(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return '未定义';
    }


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return '未定义';
    }


    return number
        .toLocaleString(
            'zh-CN',
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        )
        + '%';
}


/* =========================================================
   错误
========================================================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        'block';
}


function hideError() {

    errorBox.textContent =
        '';

    errorBox.style.display =
        'none';
}


/* =========================================================
   登录验证
========================================================= */

async function verifyLogin() {

    const {
        data: sessionData,
        error: sessionError
    } =
    await supabaseClient.auth
        .getSession();


    if (
        sessionError ||
        !sessionData?.session
    ) {

        window.location.replace(
            LOGIN_PAGE
        );

        return false;
    }


    const {
        data: userData,
        error: userError
    } =
    await supabaseClient.auth
        .getUser();


    if (
        userError ||
        !userData?.user
    ) {

        await forceLogout();

        return false;
    }


    currentUser =
        userData.user;


    const {
        data: profile,
        error: profileError
    } =
    await supabaseClient

        .from('profiles')

        .select(`
            id,
            full_name,
            role,
            status,
            login_email,
            account_no
        `)

        .eq(
            'id',
            currentUser.id
        )

        .maybeSingle();


    if (
        profileError ||
        !profile
    ) {

        await forceLogout();

        return false;
    }


    /*
    只允许健康顾问进入
    */

    if (
        profile.role !==
        'health_consultant'
    ) {

        await forceLogout();

        return false;
    }


    /*
    无效账号禁止进入
    */

    if (
        profile.status !==
        'active'
    ) {

        await forceLogout();

        return false;
    }


    currentProfile =
        profile;


    return true;
}


/* =========================================================
   获取健康顾问本人资料
========================================================= */

async function loadConsultant() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from('health_consultants')

        .select(`
            id,
            auth_user_id,
            consultant_no,
            consultant_name,
            phone,
            email,
            service_area_id,
            status
        `)

        .eq(
            'auth_user_id',
            currentUser.id
        )

        .maybeSingle();


    if (error) {
        throw error;
    }


    if (!data) {

        throw new Error(
            '没有找到该健康顾问的业务资料。'
        );
    }


    if (
        data.status !==
        'active'
    ) {

        throw new Error(
            '该健康顾问账号已经停用。'
        );
    }


    currentConsultant =
        data;
}


/* =========================================================
   服务区域
========================================================= */

async function loadServiceArea() {

    if (
        !currentConsultant
            ?.service_area_id
    ) {

        currentServiceArea =
            null;

        return;
    }


    const {
        data: area,
        error: areaError
    } =
    await supabaseClient

        .from('service_areas')

        .select(`
            id,
            area_no,
            province_id,
            city_id,
            district_id,
            status
        `)

        .eq(
            'id',
            currentConsultant
                .service_area_id
        )

        .maybeSingle();


    if (areaError) {
        throw areaError;
    }


    if (!area) {

        currentServiceArea =
            null;

        return;
    }


    let provinceName =
        '';

    let cityName =
        '';

    let districtName =
        '';


    if (area.province_id) {

        const {
            data
        } =
        await supabaseClient

            .from('provinces')

            .select(`
                province_name
            `)

            .eq(
                'id',
                area.province_id
            )

            .maybeSingle();


        provinceName =
            data?.province_name || '';
    }


    if (area.city_id) {

        const {
            data
        } =
        await supabaseClient

            .from('cities')

            .select(`
                city_name
            `)

            .eq(
                'id',
                area.city_id
            )

            .maybeSingle();


        cityName =
            data?.city_name || '';
    }


    if (area.district_id) {

        const {
            data
        } =
        await supabaseClient

            .from('districts')

            .select(`
                district_name
            `)

            .eq(
                'id',
                area.district_id
            )

            .maybeSingle();


        districtName =
            data?.district_name || '';
    }


    currentServiceArea = {
        ...area,

        province_name:
            provinceName,

        city_name:
            cityName,

        district_name:
            districtName
    };
}


/* =========================================================
   服务区域文字
========================================================= */

function getAreaText() {

    if (!currentServiceArea) {

        return '未设置';
    }


    const parts = [];


    if (
        currentServiceArea
            .province_name
    ) {

        parts.push(
            currentServiceArea
                .province_name
        );
    }


    if (
        currentServiceArea
            .city_name
    ) {

        parts.push(
            currentServiceArea
                .city_name
        );
    }


    if (
        currentServiceArea
            .district_name
    ) {

        parts.push(
            currentServiceArea
                .district_name
        );
    }


    return (
        parts.join(' · ')
        ||
        '未设置'
    );
}


/* =========================================================
   显示顾问资料
========================================================= */

function renderConsultantInfo() {

    consultantName.textContent =
        currentConsultant
            ?.consultant_name
        ||
        currentProfile
            ?.full_name
        ||
        '健康顾问';


    consultantNo.textContent =
        currentConsultant
            ?.consultant_no
        ??
        currentProfile
            ?.account_no
        ??
        '-';


    consultantEmail.textContent =
        currentConsultant
            ?.email
        ||
        currentProfile
            ?.login_email
        ||
        currentUser
            ?.email
        ||
        '-';


    consultantArea.textContent =
        getAreaText();
}


/* =========================================================
   加载本人健康顾问项目规则
========================================================= */

async function loadProjectRules() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from(
            'merchant_product_rules'
        )

        .select(`
            id,
            merchant_id,
            product_id,
            rule_type,
            health_consultant_id,
            health_consultant_ratio,
            status,
            version_no
        `)

        .eq(
            'health_consultant_id',
            currentConsultant.id
        )

        .eq(
            'rule_type',
            'health_consultant'
        )

        .eq(
            'status',
            'active'
        )

        .order(
            'id',
            {
                ascending: false
            }
        );


    if (error) {
        throw error;
    }


    projectRules =
        data || [];


    /*
    没有项目
    */

    if (
        projectRules.length === 0
    ) {

        renderProjects([]);

        return;
    }


    /*
    获取产品ID
    */

    const productIds =
        [
            ...new Set(
                projectRules
                    .map(
                        item =>
                            item.product_id
                    )
                    .filter(Boolean)
            )
        ];


    /*
    获取商户ID
    */

    const merchantIds =
        [
            ...new Set(
                projectRules
                    .map(
                        item =>
                            item.merchant_id
                    )
                    .filter(Boolean)
            )
        ];


    /*
    产品
    */

    let products = [];


    if (
        productIds.length > 0
    ) {

        const {
            data,
            error
        } =
        await supabaseClient

            .from('products')

            .select(`
                id,
                product_code,
                product_name,
                status
            `)

            .in(
                'id',
                productIds
            );


        if (error) {
            throw error;
        }


        products =
            data || [];
    }


    /*
    商户
    */

    let merchants = [];


    if (
        merchantIds.length > 0
    ) {

        const {
            data,
            error
        } =
        await supabaseClient

            .from('merchants')

            .select(`
                id,
                merchant_name,
                service_area_id,
                status
            `)

            .in(
                'id',
                merchantIds
            );


        if (error) {
            throw error;
        }


        merchants =
            data || [];
    }


    /*
    Map
    */

    const productMap =
        new Map(
            products.map(
                item => [
                    item.id,
                    item
                ]
            )
        );


    const merchantMap =
        new Map(
            merchants.map(
                item => [
                    item.id,
                    item
                ]
            )
        );


    /*
    只保留当前有效产品 + 有效商户
    */

    const validRules =
        projectRules.filter(
            rule => {

                const product =
                    productMap.get(
                        rule.product_id
                    );

                const merchant =
                    merchantMap.get(
                        rule.merchant_id
                    );


                return (
                    product
                    &&
                    merchant
                    &&
                    product.status
                        === 'active'
                    &&
                    merchant.status
                        === 'active'
                );
            }
        );


    /*
    获取涉及到的服务区域
    */

    const serviceAreaIds =
        [
            ...new Set(
                validRules
                    .map(
                        rule =>
                            merchantMap
                                .get(
                                    rule.merchant_id
                                )
                                ?.service_area_id
                    )
                    .filter(Boolean)
            )
        ];


    let areaMap =
        new Map();


    if (
        serviceAreaIds.length > 0
    ) {

        const {
            data: areas,
            error: areaError
        } =
        await supabaseClient

            .from('service_areas')

            .select(`
                id,
                province_id,
                city_id,
                district_id
            `)

            .in(
                'id',
                serviceAreaIds
            );


        if (areaError) {
            throw areaError;
        }


        const provinceIds =
            [
                ...new Set(
                    (areas || [])
                        .map(
                            item =>
                                item.province_id
                        )
                        .filter(Boolean)
                )
            ];


        const cityIds =
            [
                ...new Set(
                    (areas || [])
                        .map(
                            item =>
                                item.city_id
                        )
                        .filter(Boolean)
                )
            ];


        const districtIds =
            [
                ...new Set(
                    (areas || [])
                        .map(
                            item =>
                                item.district_id
                        )
                        .filter(Boolean)
                )
            ];


        let provinces = [];
        let cities = [];
        let districts = [];


        if (
            provinceIds.length > 0
        ) {

            const {
                data
            } =
            await supabaseClient

                .from('provinces')

                .select(`
                    id,
                    province_name
                `)

                .in(
                    'id',
                    provinceIds
                );


            provinces =
                data || [];
        }


        if (
            cityIds.length > 0
        ) {

            const {
                data
            } =
            await supabaseClient

                .from('cities')

                .select(`
                    id,
                    city_name
                `)

                .in(
                    'id',
                    cityIds
                );


            cities =
                data || [];
        }


        if (
            districtIds.length > 0
        ) {

            const {
                data
            } =
            await supabaseClient

                .from('districts')

                .select(`
                    id,
                    district_name
                `)

                .in(
                    'id',
                    districtIds
                );


            districts =
                data || [];
        }


        const provinceMap =
            new Map(
                provinces.map(
                    item => [
                        item.id,
                        item.province_name
                    ]
                )
            );


        const cityMap =
            new Map(
                cities.map(
                    item => [
                        item.id,
                        item.city_name
                    ]
                )
            );


        const districtMap =
            new Map(
                districts.map(
                    item => [
                        item.id,
                        item.district_name
                    ]
                )
            );


        areaMap =
            new Map(
                (areas || []).map(
                    area => {

                        const parts = [];


                        if (
                            provinceMap.get(
                                area.province_id
                            )
                        ) {

                            parts.push(
                                provinceMap.get(
                                    area.province_id
                                )
                            );
                        }


                        if (
                            cityMap.get(
                                area.city_id
                            )
                        ) {

                            parts.push(
                                cityMap.get(
                                    area.city_id
                                )
                            );
                        }


                        if (
                            districtMap.get(
                                area.district_id
                            )
                        ) {

                            parts.push(
                                districtMap.get(
                                    area.district_id
                                )
                            );
                        }


                        return [
                            area.id,
                            parts.join(' · ')
                                ||
                                '未设置'
                        ];
                    }
                )
            );
    }


    /*
    当前城市价格
    */

    const cityIdsForPrice =
        [
            ...new Set(
                validRules
                    .map(
                        rule => {

                            const merchant =
                                merchantMap.get(
                                    rule.merchant_id
                                );


                            const serviceAreaId =
                                merchant
                                    ?.service_area_id;


                            /*
                            这里从已加载区域中
                            再查对应city
                            */

                            return serviceAreaId;
                        }
                    )
                    .filter(Boolean)
            )
        ];


    /*
    为避免前端做复杂联表，
    逐条获取当前有效城市价格。
    1.0数据量很小，可以直接使用。
    */

    const finalRows = [];


    for (
        const rule
        of validRules
    ) {

        const product =
            productMap.get(
                rule.product_id
            );


        const merchant =
            merchantMap.get(
                rule.merchant_id
            );


        let price =
            null;


        if (
            merchant
                ?.service_area_id
        ) {

            const {
                data: area
            } =
            await supabaseClient

                .from('service_areas')

                .select(`
                    city_id
                `)

                .eq(
                    'id',
                    merchant
                        .service_area_id
                )

                .maybeSingle();


            if (
                area?.city_id
            ) {

                const {
                    data: priceData
                } =
                await supabaseClient

                    .from('city_prices')

                    .select(`
                        price
                    `)

                    .eq(
                        'city_id',
                        area.city_id
                    )

                    .eq(
                        'product_id',
                        rule.product_id
                    )

                    .eq(
                        'status',
                        'active'
                    )

                    .maybeSingle();


                price =
                    priceData?.price
                    ??
                    null;
            }
        }


        finalRows.push({

            rule_id:
                rule.id,

            product_id:
                rule.product_id,

            product_code:
                product
                    ?.product_code
                ||
                '',

            product_name:
                product
                    ?.product_name
                ||
                '未命名项目',

            merchant_id:
                rule.merchant_id,

            merchant_name:
                merchant
                    ?.merchant_name
                ||
                '未命名商户',

            service_area:
                areaMap.get(
                    merchant
                        ?.service_area_id
                )
                ||
                '未设置',

            price:
                price,

            health_consultant_ratio:
                rule
                    .health_consultant_ratio,

            version_no:
                rule.version_no
        });
    }


    renderProjects(
        finalRows
    );
}


/* =========================================================
   渲染项目
========================================================= */

        +

    if (
        rows.length === 0
    ) {

        tableCard.style.display =
            'none';

        mobileList.style.display =
            'none';

        emptyBox.style.display =
            'block';

        return;

    emptyBox.style.display =

    /*

    rows.forEach(

                                escapeHtml(
                                    row.product_name
                                )
                            }

                        </div>

                        <div class="mobile-project-code">

                            ${
                                escapeHtml(
                                    row.product_code
                                    ||
                                    '-'
                                )
                            }

                        </div>

                    </div>


                    <span class="ratio-badge">

                        ${
                            escapeHtml(
                                formatRatio(
                                    row.health_consultant_ratio
                                )
                            )
                        }

                    </span>

                </div>


                <div class="mobile-info-row">

                    <span class="mobile-info-label">
                        商户
                    </span>

                    <span class="mobile-info-value">

                        ${
                            escapeHtml(
                                row.merchant_name
                            )
                        }

                    </span>

                </div>


                <div class="mobile-info-row">

                    <span class="mobile-info-label">
                        服务区域
                    </span>

                    <span class="mobile-info-value">

                        ${
                            escapeHtml(
                                row.service_area
                            )
                        }

                    </span>

                </div>


                <div class="mobile-info-row">

                    <span class="mobile-info-label">

                    </span>

/* =========================================================
   退出登录
========================================================= */

async function forceLogout() {

    try {

        await supabaseClient.auth
            .signOut();

    }
    catch (error) {

        console.error(
            '退出失败：',
            error
        );
    }


    window.location.replace(
        LOGIN_PAGE
    );
}


logoutButton.onclick =
    forceLogout;


/* =========================================================
   10分钟无操作退出
========================================================= */

const IDLE_LIMIT =
    10 * 60 * 1000;


let idleTimer =
    null;


function resetIdleTimer() {

    if (idleTimer) {

        clearTimeout(
            idleTimer
        );
    }


    idleTimer =
        setTimeout(

            async function () {

                await forceLogout();

            },

            IDLE_LIMIT

        );
}


[
    'click',
    'touchstart',
    'keydown',
    'scroll'
]
.forEach(
    eventName => {

        document.addEventListener(
            eventName,
            resetIdleTimer,
            {
                passive: true
            }
        );
    }
);


resetIdleTimer();


/* =========================================================
   初始化
========================================================= */

async function initialize() {

    hideError();


    try {

        const valid =
            await verifyLogin();


        if (!valid) {
            return;
        }


        await loadConsultant();


        await loadServiceArea();


        renderConsultantInfo();


        await loadProjectRules();


        loadingBox.style.display =
            'none';


        mainContent.style.display =
            'block';
    }

    catch (error) {

        console.error(
            '健康顾问工作台加载失败：',
            error
        );


        loadingBox.style.display =
            'none';


        showError(
            error?.message
            ||
            '健康顾问工作台加载失败。'
        );
    }
}


/* =========================================================
   Auth状态变化
========================================================= */

supabaseClient.auth
    .onAuthStateChange(

        (
            event,
            session
        ) => {

            if (
                event ===
                'SIGNED_OUT'
            ) {

                window.location.replace(
                    LOGIN_PAGE
                );
            }
        }

    );


/* =========================================================
   启动
========================================================= */

initialize();

</script>
