<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>孕乃馨 - 客户中心</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #fff7f9 0%,
          #ffffff 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      border-radius: 22px;
      background: #ffffff;
      padding: 8px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);

      margin-bottom: 22px;
    }

    .brand {
      font-size: 34px;
      font-weight: 700;
      color: #222222;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 17px;
      color: #888888;
      margin-bottom: 45px;
    }

    .card {
      background: #ffffff;

      border-radius: 28px;

      padding:
        55px
        28px;

      box-shadow:
        0 18px 55px
        rgba(0, 0, 0, 0.08);
    }

    .flower {
      font-size: 58px;
      margin-bottom: 25px;
    }

    .welcome {
      font-size: 28px;
      font-weight: 700;
      color: #222222;
      line-height: 1.6;
    }

    .debug {
      margin-top: 24px;

      font-size: 15px;
      color: #999999;

      line-height: 1.8;
    }

    .home-button {
      display: block;

      width: 100%;

      margin-top: 42px;

      padding: 18px 20px;

      border: none;
      border-radius: 18px;

      background: #222222;
      color: #ffffff;

      font-size: 18px;
      font-weight: 600;

      text-decoration: none;

      cursor: pointer;
    }

    .home-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 600px) {

      body {
        padding: 18px;
      }

      .brand {
        font-size: 30px;
      }

      .card {
        padding:
          48px
          22px;
      }

      .welcome {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="./logo.jpeg"
      alt="孕乃馨 Logo"
      class="logo"
    >

    <div class="brand">
      孕乃馨
    </div>

    <div class="subtitle">
      专业服务 · 安心生活
    </div>

    <section class="card">

      <div class="flower">
        🌹
      </div>

      <div class="welcome">
        欢迎登入调试页面🌹
      </div>

      <div class="debug">
        客户端系统正在建设中<br>
        后续功能将逐步开放
      </div>

      <a
        href="index.html"
        class="home-button"
      >
        返回主页
      </a>

    </section>

  </main>

</body>
</html>
